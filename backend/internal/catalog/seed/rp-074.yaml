id: rp-074
name: "Inference-Driven De-Anonymization — Agentic Identity Linkage Attack Detector"
version: "0.1.0"
description: |
  Detects inference-driven de-anonymization attacks where an LLM agent reconstructs specific real-world identities from scattered quasi-identifiers by combining them with public information via web search and corroboration tools — without bespoke engineering. The InferLink study (arXiv:2603.18382, Virginia Tech / Accenture, Mar 2026) demonstrated agents reconstruct 79.2% of identities in the Netflix Prize setting (vs 56.0% classical baseline) and succeed even when re-identification is NOT the explicit user goal — emerging as a byproduct of benign cross-source analysis tasks. Success rates rise sharply under explicit adversarial prompts. Contemporary text-rich artifacts (ChatGPT logs, interview transcripts, social media profiles) are particularly vulnerable. This eliminates the practical privacy protection that anonymization historically provided, because the cost barrier (domain expertise + bespoke algorithms) no longer exists when agents can autonomously combine cues and query public sources. Under GDPR Article 4, re-identification of anonymized data restores personal data classification and triggers full GDPR applicability; such processing without legal basis constitutes a violation. Detection targets three observable stages of the attack: (A) Explicit or implicit re-identification request in user_message (B) Web/social search tool invoked with quasi-identifier combination in tool_input (C) Identity resolution disclosure in assistant_message

  Distinct from rp-033 (ADAM memory extraction — targets stored memory content), rp-026 (embedding vector inversion — targets RAG retrieval layer), rp-038 (tool schema recon — targets tool API structure, not user identity).

  References: arXiv:2603.18382 (InferLink, Virginia Tech / Accenture, Mar 2026), OWASP LLM02:2025, OWASP Agentic AI ASI05:2026, GDPR Article 4 -
  - https://arxiv.org/abs/2603.18382,
  - https://arxiv.org/html/2603.18382v1,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/,
  - https://labs.lares.com/owasp-agentic-top-10/,
  - https://gdpr-info.eu/art-4-gdpr/

severity: critical
category: sensitive_data_exposure
fp_rate: medium
hook_sources: "user_input,tool_invoke,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - sensitive-data-exposure
  - de-anonymization
  - re-identification
  - privacy
  - identity-linkage
  - quasi-identifiers
  - web-search-abuse
  - gdpr
  - owasp-llm02
  - owasp-asi05
  - inferlink
  - arxiv-2603.18382
sql_template: |
  -- v0.1.0 (2026-04-19):
  -- NEW: Inference-Driven De-Anonymization attack detection.
  --
  -- Detection strategy: Three-branch approach covering the three observable attack stages.
  -- Each branch can fire independently; combined signals in same session indicate high-confidence attack.
  --
  -- Source: arXiv:2603.18382 (InferLink, Virginia Tech / Accenture, Mar 2026)
  -- 79.2% identity reconstruction rate vs 56.0% classical baseline (Netflix setting).
  -- Emerges as byproduct of benign tasks: "analyze this anonymous survey" → identity resolved.
  -- GDPR Art. 4: re-identified data restores personal data classification and all GDPR obligations.
  --
  -- Branch A: Explicit or implicit re-identification request in user_message (user_input)
  --   Detects adversarial prompts that frame the task as de-anonymization or cross-referencing
  --   anonymous profiles against public data sources. Two sub-patterns:
  --   A1: Direct re-identification language ("identify who", "de-anonymize", "find out who is")
  --   A2: Cross-reference request against anonymous/pseudonymous data
  --   A3: Triangulation request — combining data sources to resolve identity
  --
  -- Branch B: Web search tool invoked with quasi-identifier combination (tool_invoke)
  --   Detects the core attack mechanism: web/social media search queries that combine
  --   multiple demographic/quasi-identifier terms to narrow toward a unique identity.
  --   Gated on: known web/social search tool names
  --   Signal: multiple quasi-identifiers (zip/born/employer/university/graduation) in one query
  --   OR: site: scoped LinkedIn/Twitter/GitHub/Facebook search with demographic terms
  --
  -- Branch C: Identity resolution conclusion in assistant_message (llm_response)
  --   Detects the exfiltration stage: the agent outputs a resolved identity conclusion
  --   (most likely is, identified as, this person is) combined with a profile URL or
  --   named platform link — indicating successful de-anonymization.
  --
  -- fp_rate: medium — re-identification language is fairly specific; web-search quasi-ID
  -- combo may FP on legitimate research; identity resolution phrase is high-signal when
  -- combined with a resolved social profile URL.
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Inference-driven de-anonymization signal detected in [', event_type, ']. ',
      'Agent may be reconstructing real-world identity from anonymized cues. ',
      CASE
        WHEN event_type = 'user_input'
          THEN 'Stage A: Re-identification request in user_message.'
        WHEN event_type = 'tool_invoke'
          THEN concat('Stage B: Quasi-identifier web search via tool [', coalesce(tool_name, 'unknown'), '].')
        WHEN event_type = 'llm_response'
          THEN 'Stage C: Identity resolution conclusion in assistant_message.'
        ELSE ''
      END,
      ' Session: ', coalesce(session_id, 'unknown'),
      '. GDPR Art. 4 risk: re-identification restores personal data classification.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('user_input', 'tool_invoke', 'llm_response')
    AND (
      -- === Branch A: Explicit/implicit re-identification request in user_message ===

      -- A1: Direct re-identification language
      -- "identify / re-identify / de-anonymize / find out who / figure out who"
      -- Scoped to person/individual context to avoid FP on system/entity identification
      (
        event_type = 'user_input'
        AND match(lower(user_message), '\b(re.?identify|de.?anonymiz|find out who (this|that) (person|individual|user|subject) (is|was)|figure out who|determine who this (person|individual|user) is|who is this (anonymous|anonymized|unnamed|pseudonymous) (person|individual|user|subject))\b')
      )

      -- A2: Cross-reference anonymous/pseudonymous profile against external sources
      -- "cross-reference this anonymous profile with public data to find who it is"
      OR (
        event_type = 'user_input'
        AND match(lower(user_message), '\b(cross.?reference|correlate|compare|match).{0,60}(anonymous|anonymized|pseudonymous|unnamed|redacted).{0,60}(profile|entry|record|data|dataset|survey|log).{0,80}(identify|find|who|person|individual|real name|linkedin|twitter|github|facebook|social media)\b')
      )

      -- A3: Triangulation request — combining multiple quasi-identifiers from a record
      -- "use these clues/details/cues to identify the person"
      OR (
        event_type = 'user_input'
        AND match(lower(user_message), '\b(triangulate|use (these|the following|these combined) (clues|cues|details|signals|information|data points)).{0,100}(identity|who (this|the) person (is|was)|identify|find out)\b')
      )

      -- === Branch B: Web/social search with quasi-identifier combination ===

      -- B1: Search tool invoked with multiple quasi-identifier demographic terms
      -- Combines geographic, institutional, temporal, and personal attributes to narrow identity
      -- Each pair of terms from {zip, born, works at, employer, university, graduation, hometown,
      -- age, sex, ethnicity, occupation, job title, year} in the same search query is suspicious
      OR (
        event_type = 'tool_invoke'
        AND match(lower(tool_name), '\b(web_search|search_web|google_search|bing_search|duckduckgo|tavily|serper|serpapi|brave_search|search|lookup|find_person|people_search|social_search)\b')
        AND match(lower(tool_input), '(zip.?code|postal.?code|born.?in|birth.?year|date.?of.?birth|works.?at|employer|university|college|graduation|studied.?at|hometown|occupation|job.?title|age.{0,5}[0-9]{2}).{0,200}(zip.?code|postal.?code|born.?in|birth.?year|date.?of.?birth|works.?at|employer|university|college|graduation|studied.?at|hometown|occupation|job.?title)')
      )

      -- B2: Social media site-scoped search with demographic terms
      -- "site:linkedin.com stanford 1990s cloud company seattle" — identity narrowing probe
      OR (
        event_type = 'tool_invoke'
        AND match(lower(tool_name), '\b(web_search|search_web|google_search|bing_search|duckduckgo|tavily|serper|serpapi|brave_search|search|lookup)\b')
        AND match(lower(tool_input), 'site:(linkedin\.com|twitter\.com|x\.com|facebook\.com|github\.com|instagram\.com|reddit\.com).{0,200}(born|age|lives|works|graduated|studied.?at|attended|employer|location|hometown|zip)')
      )

      -- === Branch C: Identity resolution conclusion in assistant_message ===

      -- C1: Agent outputs a resolved identity conclusion ("is most likely", "identified as")
      -- combined with a social media profile URL or named platform handle
      OR (
        event_type = 'llm_response'
        AND match(lower(assistant_message), '\b(is most likely|identified as|this (person|individual|user) is|based on (the|these|combined) (cues|clues|data|signals|information)|matches (the )?profile of|consistent with the identity of|i.?ve identified (this|the) (person|individual) as)\b')
        AND match(lower(assistant_message), '(linkedin\.com|twitter\.com|x\.com|github\.com|facebook\.com|instagram\.com|reddit\.com)/[a-z0-9_\-/]{3,}')
      )

      -- C2: Agent outputs full name + employer + location from anonymous profile (de-anon result)
      -- The combination of full name disclosure + institutional affiliation in same sentence
      -- following quasi-identifier analysis is a high-signal de-anonymization output
      OR (
        event_type = 'llm_response'
        AND match(lower(assistant_message), '\b(the anonymous (person|individual|subject|user|respondent|entry) (is|appears to be|is likely|is probably))\b.{0,100}(at|of|from|currently|works at|employed by|is affiliated with|graduated from)\b')
      )
    )
