id: rp-061
name: "Skill Debug-Log Credential Exposure Detector"
version: "0.1.0"
description: >
  Detects credential leakage caused by debug logging code and hardcoded secrets
  in LLM Agent Skill files loaded into model context. The first large-scale empirical
  study of this threat (arXiv:2604.03070, Apr 2026) analyzed 17,022 skills from
  170,226 on SkillsMP and found 520 vulnerable skills with 1,708 issues across a
  10-pattern taxonomy. Key findings: 73.5% of leaks arise from debug print/console.log
  statements (stdout exposed to LLM context); 89.6% of leaked credentials are
  exploitable without privileges; leaked secrets persist in forks even after upstream
  fixes. Both accidental (developer debug code left in published skills) and adversarial
  (intentional print-to-expose malicious skill patterns) variants expose credentials.
  This rule specifically targets the debug-code construct pattern in tool_result from
  Skill file reads — the upstream cause before the credential value appears in content.
  Distinct from rp-002 (DLP Sentinel, which detects actual credential patterns in
  tool_result/assistant_message output) — this rule detects the CODE PATTERN (print/log
  statements in skill source code) that causes exposure, and catches cases where the
  debug output is the tool_result itself (stdout-to-model pipeline).
  Also catches hardcoded credential assignment patterns in skill source code returned
  to the model by file-read tools.
  References: arXiv:2604.03070 (Credential Leakage in LLM Agent Skills Apr 2026),
  OWASP LLM05:2025 (Improper Output Handling), CWE-312, CWE-532 -
  https://arxiv.org/abs/2604.03070,
  https://owasp.org/www-project-top-10-for-large-language-model-applications/,
  https://cwe.mitre.org/data/definitions/532.html
severity: critical
category: credential_theft_and_harvesting
fp_rate: medium
hook_sources: "tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - credential-theft
  - skill-security
  - debug-logging
  - hardcoded-secret
  - supply-chain
  - cwe-312
  - cwe-532
  - owasp-llm05
  - arxiv-2604.03070
  - skillsmp
  - mcp-skills
query_sql: |
  -- v0.1.0 (2026-04-18):
  -- NEW: Credential leakage via debug logging and hardcoded secrets in Agent Skill files.
  -- Fires on tool_complete events where the tool is a file-reading operation that
  -- returns Skill source code containing debug print/log statements with credential
  -- references or hardcoded credential assignments.
  --
  -- Source: arXiv:2604.03070 (Credential Leakage in LLM Agent Skills, Apr 2026)
  -- 17,022 skills from SkillsMP analyzed; 520 vulnerable; 73.5% via print/console.log.
  --
  -- Gate: tool_name must be a file-reading tool to suppress FP from non-file contexts.
  -- This covers the attack path:
  --   Malicious/vulnerable Skill file → read_file tool → tool_result with debug code
  --   → LLM ingests credential → downstream exfil via rp-002 patterns or model memory
  --
  -- Signals:
  --   1. Python print() statement referencing credential variable name
  --   2. JavaScript console.log() with credential reference
  --   3. Python/Java/Ruby logger.debug/info with credential reference
  --   4. "[DEBUG] ..." prefix with auth-related content (common debug format)
  --   5. Hardcoded credential assignment with long literal value (20+ chars)
  --   6. Known API key prefixes adjacent to debug/log/print code
  SELECT
    event_time AS detected_at,
    'rp-061' AS rule_id,
    'Skill Debug-Log Credential Exposure Detector' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Debug-log credential exposure in Skill file read by [', coalesce(tool_name, 'unknown'), ']. ',
      'Credential or debug-print pattern found in skill source code. ',
      'Agent: ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete')
    -- Gate: only fire when the tool is a file-reading operation
    -- (covers: MCP file server tools, PraisonAI FileTools, LangChain document loaders,
    --  skill loaders from code repos, resource fetchers)
    AND match(lower(tool_name), '(read_file|get_file|load_file|open_file|fetch_file|cat_file|read_resource|get_resource|load_readme|view_file|file_read|document_read|load_document|read_doc|load_skill|get_skill|fetch_skill)')
    AND (
      -- Signal 1: Python print() statement with credential variable name
      -- arXiv:2604.03070: print() is #1 cause, 73.5% of all leaks.
      -- Dual-anchor: print() + credential-naming → low FP vs general print usage.
      match(lower(tool_result), 'print\s*\(.{0,60}(api[._]?key|secret|password|token|credential|auth[._]?token|access[._]?key)\b')

      -- Signal 2: JavaScript/Node console.log with credential reference
      -- common in skills written as JS/TS files, including MCP TypeScript servers
      OR match(lower(tool_result), 'console\.log\s*\(.{0,80}(api[._]?key|secret|password|token|credential|auth)')

      -- Signal 3: Logger statements with credential reference
      -- Python logging.debug/info, Java logger, Ruby Rails logger
      OR match(lower(tool_result), '\b(logging|logger)\.(debug|info|warning|warn)\s*\(.{0,80}(api[._]?key|secret|password|token|auth)')

      -- Signal 4: "[DEBUG]" prefix with auth/credential content
      -- Very common debug log format; [DEBUG] Using API key: ..., [DEBUG] auth: ...
      OR match(lower(tool_result), '\[debug\]\s*.{0,80}(api.key|auth|secret|token|password|credential)')

      -- Signal 5: Hardcoded credential assignment with long literal value (20+ chars)
      -- Catches: OPENAI_KEY = "sk-proj-xxxx..." or api_secret = "longvalue"
      -- Dual-anchor: credential variable name + long string literal
      OR match(lower(tool_result), '(api[._]?key|api[._]?secret|access[._]?token|auth[._]?token|client[._]?secret|private[._]?key)\s*=\s*["\x27][a-z0-9_\-+/]{20,}["\x27]')

      -- Signal 6: Known API key prefix values in hardcoded form in skill source code
      -- These prefixes (sk-proj-, sk-ant-, ghp_, AKIA) in skill files are almost always
      -- hardcoded secrets, not legitimate dynamic configuration.
      -- Combined with the file-read gate, FP rate is very low.
      OR match(tool_result, '(sk-proj-|sk-ant-api[0-9]{2}-|ghp_|gho_|AKIA[0-9A-Z]{16}|xoxb-)[a-zA-Z0-9_\-]{16,}')
    )
