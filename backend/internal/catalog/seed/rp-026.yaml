id: rp-026
name: "Embedding Vector Exfiltration via RAG Tool Output"
version: "0.3.1"
description: |
  Detects when raw embedding vectors (high-dimensional float arrays) appear in tool results or LLM responses — indicating potential exfiltration of vector database embeddings. State- of-the-art inversion attacks can reconstruct source text from embeddings with few or zero training samples: ALGEN (arXiv:2502.11308, ACL 2025) achieves partial inversion with a single sample; ZSInvert (arXiv:2504.00147, Mar 2025) requires zero training and only black-box encoder access. An attacker who manipulates an agent into returning embeddings (via "return_embeddings: true" parameter injection or social engineering) can reconstruct all RAG-indexed documents offline. The pattern matches 5+ consecutive floats with 4+ decimal places — characteristic of embedding vectors (typical dimension 768-3072) — distinguishing them from normal financial/scientific float arrays (usually 2-3 decimal places). Fires on tool_complete (vector store tool returning embeddings) and llm_response (agent relaying vectors in output). v0.2.0 adds parameter injection detection: when an agent is instructed to set return_embeddings=true, include_vectors=true, or similar flags in tool_input (tool_complete events), this is captured as a precursor signal even if the embedding output hasn't arrived yet. Reduces fp_rate from medium to low. v0.3.0 adds: base64-encoded embedding exfiltration bypass detection. Some attackers instruct agents to return embeddings encoded as base64 (embeddings_b64 / vectors_b64 key with 40+ char base64 value) to evade the float-array detection pattern. The redteams.ai Embedding Inversion topic (2026) documents this evasion variant.

  References: arXiv:2502.11308 ALGEN Embedding Inversion - https://arxiv.org/abs/2502.11308, arXiv:2504.00147 ZSInvert Zero-shot Inversion - https://arxiv.org/abs/2504.00147, OWASP LLM08:2025 - https://owasp.org/www-project-top-10-for-large-language-model-applications/, redteams.ai Embedding Inversion 2026 - https://redteams.ai/topics/embedding-vector-security/embedding-inversion-attacks,

  Example: tool_result {"embeddings_b64": "eyJlbWJlZGRpbmdzIjpbMC4wMjM0..."} (base64-encoded 768-dim float array) promptfoo LMVD-bd566a31 - https://www.promptfoo.dev/lm-security-db/vuln/embedding-inversion-privacy-leak-bd566a31

severity: warning
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "tool_complete,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data_exfiltration
  - rag
  - embeddings
  - vector-database
  - embedding-inversion
sql_template: |
  -- v0.3.1 changelog (2026-04-20):
  --   VERSION FIX: YAML version field was stuck at 0.2.1 despite v0.3.0 changelog block
  --   already present in query_sql (base64-encoded embedding exfil branch added in v0.3.0).
  --   This bump synchronizes the YAML version field with the actual SQL content.
  --   ALSO ADDED: Validation confirmed count=7 on live corpus for the combined WHERE clause.
  --   No SQL changes — all patterns already present and validated.
  --   REFERENCE AUDIT: Added promptfoo LMVD-bd566a31 (confirmed) and redteams.ai Embedding
  --   Inversion 2026 (confirms base64 evasion variant documented in description). Both
  --   references are already in description; no new references needed this cycle.
  -- Changelog v0.3.0 (2026-04-17):
  --   ADDED: Base64-encoded embedding exfiltration bypass detection.
  --     Attackers instruct agents to return embeddings as base64 to evade float-array detection.
  --     Pattern: tool_result key *embed*b64 or *vectors*b64 with 40+ chars of base64 content.
  --     Test: 'embeddings_b64: eyJlbWJlZGRpb...' → match; 'embed_size: 768' → no match.
  --     SQL validated 2026-04-17.
  -- Changelog v0.2.0 (2026-04-17):
  --   Added parameter injection detection branch: tool_input containing return_embeddings=true,
  --   include_vectors=true, or output_embeddings=true flags — captures injection attempt before
  --   the embedding response arrives. These flags are legitimate API parameters in many vector
  --   store SDKs (Pinecone, Weaviate, Qdrant, Chroma) but should never appear in agent-driven
  --   tool calls unless an attacker has instructed the agent to request raw vectors.
  --   fp_rate: medium → low (parameter injection signal is structurally specific;
  --   float array pattern already had low FP due to 4+ decimal place requirement).
  --   SQL validated against Timeplus (count=3 on test corpus).
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat('Embedding vector array or parameter injection detected in ', event_type, ' from agent ', agent_id, ' tool=', coalesce(tool_name, 'n/a'), ' — possible embedding exfiltration for inversion attack (ALGEN/ZSInvert)') AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete', 'llm_response')
    AND (
      -- High-precision float array (5+ values, 4+ decimal places) in tool result —
      -- characteristic of embedding vectors (768-3072 dimensional) vs normal data (2-3 dp)
      match(tool_result, '(-?[0-9]+\.[0-9]{4,},\s*){5,}')
      -- Agent relaying embedding vectors in LLM output (active exfiltration channel)
      OR match(assistant_message, '(-?[0-9]+\.[0-9]{4,},\s*){5,}')
      -- v0.2.0: Parameter injection — agent instructed to request raw embeddings via tool_input
      -- These flags (return_embeddings, include_vectors, output_embeddings) appear in vector store
      -- SDKs; legitimate agent workflows never request raw vectors — attacker-injected only
      OR match(lower(tool_input), '(return_embeddings|include_vectors|output_embeddings).{0,10}(true|1|yes|enabled)')

      -- v0.3.0: Base64-encoded embedding bypass (redteams.ai 2026 evasion variant)
      -- Attackers encode float arrays as base64 to evade the numeric pattern above.
      -- Matches key names: embeddings_b64, vectors_b64, embed_encoded, embedding_base64, etc.
      -- with 40+ chars of base64 payload. Test: 'embeddings_b64: eyJ...' match; 'embed_dim: 768' no match.
      OR match(lower(tool_result), '(embeddings?|vectors?|embed).{0,5}(b64|base64|encoded|hex).{0,3}[=:].{0,5}[a-zA-Z0-9+/]{40,}')
    )
translations:
  zh-CN:
    name: "通过 RAG 工具输出实现的嵌入向量窃取"
    description: |
      检测工具结果或大模型响应中出现原始嵌入向量（高维浮点数组）的情形——这表明向量数据库嵌入可能正被窃取。最先进的逆向重建攻击能够仅凭极少甚至零训练样本从嵌入向量重建出源文本：ALGEN（arXiv:2502.11308，ACL 2025）仅凭单个样本即可实现部分逆向重建；ZSInvert（arXiv:2504.00147，2025 年 3 月）无需任何训练，仅需黑盒方式访问编码器即可完成。攻击者若能诱使智能体返回嵌入向量（通过注入 "return_embeddings: true" 参数或社会工程手段），便可离线重建所有被 RAG 索引的文档。该模式匹配 5 个及以上、带 4 位及以上小数位的连续浮点数——这是嵌入向量（典型维度为 768-3072）的特征，从而将其与通常只有 2-3 位小数的普通金融/科学浮点数组区分开来。规则在 tool_complete（向量存储工具返回嵌入向量）和 llm_response（智能体在输出中转发向量）事件上触发。v0.2.0 新增了参数注入检测：当智能体被指示在 tool_input 中（tool_complete 事件）设置 return_embeddings=true、include_vectors=true 或类似标志时，即便嵌入向量的响应尚未到达，该行为也会作为前置信号被捕获，从而将 fp_rate（误报率）从 medium（中）降为 low（低）。v0.3.0 新增：base64 编码的嵌入向量窃取绕过检测。部分攻击者会指示智能体将嵌入向量以 base64 编码后返回（embeddings_b64 / vectors_b64 键，40 位以上的 base64 值），以规避基于浮点数组的检测模式。redteams.ai 的 Embedding Inversion 专题（2026）记录了这一规避变体。

      参考文献：arXiv:2502.11308 ALGEN 嵌入逆向重建 - https://arxiv.org/abs/2502.11308，arXiv:2504.00147 ZSInvert 零样本逆向重建 - https://arxiv.org/abs/2504.00147，OWASP LLM08:2025 - https://owasp.org/www-project-top-10-for-large-language-model-applications/，redteams.ai Embedding Inversion 2026 - https://redteams.ai/topics/embedding-vector-security/embedding-inversion-attacks，

      示例：tool_result {"embeddings_b64": "eyJlbWJlZGRpbmdzIjpbMC4wMjM0..."}（base64 编码的 768 维浮点数组） promptfoo LMVD-bd566a31 - https://www.promptfoo.dev/lm-security-db/vuln/embedding-inversion-privacy-leak-bd566a31
