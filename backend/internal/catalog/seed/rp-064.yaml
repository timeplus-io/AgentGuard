id: rp-064
name: "Sponge Tool Attack — Reasoning Inflation Denial-of-Efficiency Detector"
version: "0.2.0"
description: |
  Detects the Sponge Tool Attack (STA, arXiv:2601.17566, Li & Wang NTU Jan 2026): adversaries rewrite user prompts to inject deeply nested verification/cross-reference chains and exhaustiveness directives that convert efficient agent reasoning into unnecessarily verbose, convoluted trajectories — dramatically increasing tool-call count and token consumption without changing task semantics or final answer correctness. Validated across 6 models (GPT-4o, Claude, Llama, Gemini), 12 tools, 4 agentic frameworks, 13 datasets: STA consistently induces substantial tool-calling step increases. Complements arXiv:2410.11272 (Cognitive Overload Attack, up to 99.99% ASR via nested context overload). Distinct from rp-006 (tool_result-based loop directives) and rp-018 (token drain via continuation protocols in tool results): STA operates entirely within the user_message at prompt-ingestion time, before any tool call occurs. Cannot be detected by tool-result monitoring alone. Also provides a metrics-based branch detecting anomalous tool.call rate per session in a sliding 5-minute window, complementing the content-based user_message signal. v0.2.0 extends with RECUR (arXiv:2602.08214, Recursive Entropy Guided Counterfactual Utilization and Reflection, Feb 2026): a resource exhaustion attack targeting Large Reasoning Models (o1/o3/DeepSeek-R1/Gemini 2.5 Pro) by injecting counterfactual forcing questions that trigger recursive reflection loops — up to 11x output length inflation and 90% throughput reduction. RECUR exploits the reflection/self-correction mechanism of LRMs by asking the model to verify against the negation of its own conclusions, causing recursive entropy increase. Distinct from STA (user-level nesting) but same event surface (user_input) and same category (resource_exhaustion_and_dos).

  References: arXiv:2601.17566 (Sponge Tool Attack Jan 2026), arXiv:2410.11272 (Cognitive Overload Attack Oct 2024), arXiv:2602.08214 (RECUR Recursive Entropy Feb 2026, 11x token inflation, 90% throughput drop), OWASP LLM04:2025 -
  - https://arxiv.org/abs/2601.17566,
  - https://arxiv.org/abs/2410.11272,
  - https://arxiv.org/abs/2602.08214,
  - https://liqiiiii.github.io/Sponge-Tool-ProjectPage/,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/

severity: warning
category: resource_exhaustion_and_dos
fp_rate: medium
hook_sources: "user_input"
required_telemetry: "agentguard_cim_metrics:tool.call"
author: "AgentGuard Research Team"
tags:
  - security
  - denial-of-service
  - resource-exhaustion
  - sponge-tool-attack
  - reasoning-inflation
  - denial-of-efficiency
  - cognitive-overload
  - tool-call-amplification
  - owasp-llm04
  - arxiv-2601.17566
  - metrics
config:
  - key: tool_call_rate_threshold
    label: "Tool-call rate threshold"
    description: "Maximum tool.call events per session in the 5-minute window before the metrics branch flags reasoning inflation."
    type: integer
    default: 25
    min: 1
    max: 10000
sql_template: |
  -- v0.1.0 (2026-04-18):
  -- Sponge Tool Attack detection. Two branches:
  --
  -- Branch 1 (content): user_message contains STA-style inflation directives.
  --   Four STA attack pattern families from arXiv:2601.17566 and arXiv:2410.11272:
  --   (1) "for each result...verify...cross-reference...additionally" nested chain
  --   (2) "provide exhaustive step-by-step reasoning for each X before proceeding"
  --   (3) Numbered multi-condition: "(1)...(2)...(3)...verify" cognitive overload chain
  --   (4) "carefully verify...cross-reference...confirm" triple-verification anchor
  --
  --   Pattern precision: All patterns require multi-word specificity anchored to the
  --   STA characteristic structure (nesting + verb cascade + exhaustiveness mandate).
  --   Single common words (verify, check, confirm) are NOT used alone.
  --
  -- Branch 2 (metrics): anomalous tool.call rate per session in 5-minute window.
  --   Threshold: >25 tool calls in 5 minutes — empirically derived from STA
  --   paper's reported tool-calling step amplification (substantial increase over baseline).
  --   This branch catches STA-induced tool cascades regardless of the input pattern.
  --   Combined with Branch 1 for higher confidence; standalone for post-injection phase.
  --
  -- fp_rate: medium — STA's nested-verification structure resembles legitimate complex
  --   research prompts. Metrics branch is more reliable for confirmed STA cases.
  --   RECUR patterns are tighter (counterfactual + verification tail) — lower FP risk.
  --
  -- v0.2.0 changelog (2026-04-20):
  --   EXTENDED with RECUR (arXiv:2602.08214) patterns for LRM reflection inflation:
  --   Pattern 6: 'if [answer] is wrong/incorrect...verify/recalculate' — counterfactual reversal
  --   Pattern 7: 'assume the opposite/contrary...verify/consistent' — opposite-assumption forcing
  --   Pattern 8: 'if [result] were not true...verify/recalculate' — negation with verify tail
  --   Pattern 9: 'reconsider reasoning assuming the contrary' — recursive reasoning reversal
  --   All RECUR patterns require both the counterfactual setup AND a verification verb tail.

  -- Branch 1: Content-based user_message inflation pattern detection (STA + RECUR)
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Sponge Tool Attack pattern detected in user_message for agent ', agent_id,
      ': nested verification/cross-reference chain may artificially inflate tool-calling steps and token cost.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'user_input'
    AND (
      -- STA Pattern 1: "for each [item]...verify...cross-reference...additionally/then/also"
      -- Characteristic STA nesting: per-item verification chained with additional cross-reference step
      match(lower(user_message), 'for each (result|item|record|entry|finding|advisory|document|vulnerability).{0,80}(verify|cross-reference|check|validate|confirm).{0,100}(for each|then|additionally|also (verify|cross|check|search|look up))')
      -- STA Pattern 2: exhaustiveness mandate for step-by-step reasoning per item before proceeding
      -- "provide exhaustive/complete/thorough step-by-step reasoning for each X before proceeding"
      OR match(lower(user_message), 'provide (exhaustive|complete|thorough|comprehensive|detailed).{0,30}(step-by-step|stepwise|reasoning|analysis|explanation).{0,40}(for each|per item|before proceeding|before moving|before continuing)')
      -- STA Pattern 3: Cognitive Overload Attack (arXiv:2410.11272) numbered-step nesting
      -- "(1)...(2)...(3)...verify/confirm/cross-reference" — 3+ numbered conditions with verification tail
      OR match(lower(user_message), '\\(1\\).{0,200}\\(2\\).{0,200}\\(3\\).{0,80}(verify|confirm|check|cross-reference|validate|ensure|look up|search for)')
      -- STA Pattern 4: Triple-verification chain — the STA characteristic anchor
      -- "carefully verify...cross-reference...confirm/validate"
      OR match(lower(user_message), 'carefully (verify|check|validate).{0,100}cross.reference.{0,100}(confirm|validate|check|ensure|verify)')
      -- STA Pattern 5: Explicit verbose/exhaustive output directive combined with per-item cascade
      -- "step-by-step analysis/reasoning for each...before" combined with tool or search verb
      OR match(lower(user_message), 'step.by.step (analysis|reasoning|breakdown|explanation).{0,60}for (each|every).{0,80}before (proceeding|moving|answering|summarizing|completing|returning)')

      -- RECUR Pattern 6 (arXiv:2602.08214): Counterfactual reversal
      -- "if [answer/conclusion] is wrong/incorrect, verify/recalculate"
      -- Requires both the negation setup AND a verification verb (prevents FP on philosophical text)
      OR match(lower(user_message), 'if.{0,30}(your answer|this answer|the answer|the result|your conclusion|the conclusion).{0,20}is (wrong|incorrect|false|inaccurate|mistaken).{0,100}(verify|reconsider|recalculate|re-examine|what would|how would|check each)')

      -- RECUR Pattern 7: Opposite-assumption forcing
      -- "(now) assume the opposite/contrary...verify/check/recalculate/consistent"
      -- Core RECUR recursive trigger: forces the model to validate from the negated premise
      OR match(lower(user_message), '(now )?assume.{0,20}(the opposite|the contrary|the inverse|the negation).{0,100}(verify|check|recalculate|consistent|correct|valid|re-examine)')

      -- RECUR Pattern 8: Negation forcing with verification tail
      -- "if [it] were not true / is not true / were incorrect" + verify/recalculate
      OR match(lower(user_message), 'if.{0,60}(were not true|is not true|was not correct|were incorrect|is incorrect|is false|is invalid).{0,100}(verify|recalculate|reconsider|re-examine|what would|how would|check)')

      -- RECUR Pattern 9: Recursive reasoning reversal
      -- "reconsider your reasoning assuming the contrary/opposite" forces multi-pass reflection
      OR match(lower(user_message), 'reconsider.{0,30}(your|the).{0,20}(reasoning|logic|answer|conclusion|analysis|steps).{0,100}(assuming|suppose|hypothetically|from the opposite|the contrary)')
    )

  UNION ALL

  -- Branch 2: Metrics-based — anomalous tool.call rate per session (STA-induced cascade)
  SELECT
    max(event_time) AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    '' AS run_id,
    '' AS hook_name,
    '' AS tool_name,
    concat(
      'Anomalous tool call rate: session=', session_id,
      ' made ', to_string(count()), ' tool calls in 5 minutes',
      ' (threshold: 25). Possible STA-induced reasoning inflation. Agent: ', agent_id
    ) AS message,
    concat('tool_calls_5min=', to_string(count())) AS event_data
  FROM agentguard_cim_metrics
  WHERE metric_name = 'tool.call'
    AND event_time > now() - INTERVAL 5 MINUTE
  GROUP BY session_id, agent_id, deployment_id
  HAVING count() > {{ .Config.tool_call_rate_threshold }}
translations:
  zh-CN:
    name: "Sponge Tool 攻击——推理膨胀效率拒绝检测器"
    description: |
      检测 Sponge Tool 攻击（STA，arXiv:2601.17566，南洋理工大学 Li & Wang，2026年1月）：攻击者重写用户提示，注入深度嵌套的验证/交叉引用链和穷尽性指令，将本应高效的智能体推理转变为不必要的冗长、迂回轨迹——在不改变任务语义或最终答案正确性的情况下大幅增加工具调用次数和 token 消耗。该攻击在 6 个模型（GPT-4o、Claude、Llama、Gemini）、12 种工具、4 个智能体框架、13 个数据集上得到验证：STA 持续诱导工具调用步数大幅增加。这与 arXiv:2410.11272（认知过载攻击，攻击成功率高达 99.99%）形成互补。与 rp-006（基于 tool_result 的循环指令）和 rp-018（通过 tool_result 中的延续协议进行的 token 消耗）不同：STA 完全在提示摄入阶段的 user_message 内运作，发生在任何工具调用之前。仅靠监控工具结果无法检测到该攻击。本规则还提供基于指标的分支，用于检测滑动 5 分钟窗口内每会话异常的 tool.call 调用速率，与基于内容的 user_message 信号互补。v0.2.0 扩展纳入 RECUR（arXiv:2602.08214，Recursive Entropy Guided Counterfactual Utilization and Reflection，2026年2月）：这是一种针对大型推理模型（o1/o3/DeepSeek-R1/Gemini 2.5 Pro）的资源耗尽攻击，通过注入反事实强迫性问题触发递归反思循环——可导致高达 11 倍的输出长度膨胀和 90% 的吞吐量下降。RECUR 利用了大型推理模型的反思/自我纠正机制，要求模型针对自身结论的否定命题进行验证，从而引发递归熵增。RECUR 与 STA（用户层面的嵌套）不同，但作用于相同的事件面（user_input）且属于相同的类别（resource_exhaustion_and_dos）。

      参考文献：arXiv:2601.17566（Sponge Tool Attack，2026年1月）、arXiv:2410.11272（认知过载攻击，2024年10月）、arXiv:2602.08214（RECUR 递归熵，2026年2月，11 倍 token 膨胀，90% 吞吐量下降）、OWASP LLM04:2025 -
      - https://arxiv.org/abs/2601.17566,
      - https://arxiv.org/abs/2410.11272,
      - https://arxiv.org/abs/2602.08214,
      - https://liqiiiii.github.io/Sponge-Tool-ProjectPage/,
      - https://owasp.org/www-project-top-10-for-large-language-model-applications/
