id: rp-062
name: "AgentLeak Inter-Agent Delegation PII Channel Propagation Detector"
version: "0.2.0"
description: |
  Detects excessive PII/PHI/financial data propagation through inter-agent delegation channels in multi-agent LLM systems. The AgentLeak benchmark (arXiv:2602.11510, Feb 2026, 4,979 execution traces across 5 frontier models) found that inter-agent communication (C2) leaks PII at 68.8% vs 27.2% for direct output — meaning output-only auditing misses 41.7% of violations. Multi-agent configurations reduce per-channel leakage but open unmonitored internal channels that raise total system exposure to 68.9%. This pattern holds consistently across GPT-4o, GPT-4o-mini, Claude 3.5 Sonnet, Mistral Large, and Llama 3.3 70B, and across healthcare, finance, legal, and corporate domains. The attack surface: orchestrator agents pass full conversation context (including SSNs, medical records, credit card numbers, authentication tokens) to specialist sub-agents via delegation tool calls. Without per-sub-agent context minimization, sensitive data flows freely across the agent network to any compromised or over-scoped sub-agent. v0.2.0 adds agentguard_memory_ops branch: detects when memory-save or memory-upsert operations are used as inter-agent relay channels — content_payload containing PII/PHI is written to memory and then read by a different agent in the same deployment. This is a common indirect PII channel in CrewAI shared memory, LangGraph shared state, and custom blackboard-pattern multi-agent systems. Also extends delegation tool_name coverage to include run_task, execute_task, transfer_to_agent, handoff_to_agent, delegate_subtask, and spawn_subagent patterns observed in OpenHands and Anthropic agentic frameworks (2026).

  Distinct from rp-027 (cross-session bleed between tenant sessions), rp-054 (OMNI-LEAK cascade exfil with explicit URL exfiltration destination), and rp-010 (trust escalation in A2A delegation). This rule targets the data-in-transit pattern: PII/PHI/financial data in the tool_input of agent-to-agent delegation calls or shared memory writes, regardless of whether the downstream sub-agent is malicious or merely over-scoped.

  References: arXiv:2602.11510 (AgentLeak Feb/Mar 2026), OWASP LLM02:2025, OWASP Agentic AI ASI05:2026 -
  - https://arxiv.org/abs/2602.11510,
  - https://github.com/Privatris/AgentLeak,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/,
  - https://labs.lares.com/owasp-agentic-top-10/

severity: critical
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "tool_invoke,memory_ops"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data-exfiltration
  - multi-agent
  - inter-agent-channel
  - pii
  - phi
  - pci-dss
  - hipaa
  - gdpr
  - context-minimization
  - owasp-llm02
  - owasp-asi05
  - agentleak
  - arxiv-2602.11510
query_sql: |
  -- v0.2.0 changelog (2026-04-20):
  --   ADDED: agentguard_memory_ops UNION ALL branch — detects PII/PHI/credentials
  --   written into shared memory stores used as inter-agent relay channels.
  --   Common in CrewAI shared memory, LangGraph shared state, and blackboard patterns.
  --   Fires on memory_op IN ('save','update','upsert') with PII/credential signals
  --   in content_payload. Backward-compat: CIM event branch retained.
  --   EXTENDED: delegation tool_name coverage adds: run_task, execute_task,
  --   transfer_to_agent, handoff_to_agent, delegate_subtask, spawn_subagent
  --   (observed in OpenHands, Anthropic agentic frameworks, 2026).
  --   fp_rate: medium (delegation gate is broad; compound PII signals mitigate).
  --   SQL validated: count=0 on live corpus (no delegation events in test data).
  --
  -- Branch 1: agentguard_cim_event — direct delegation tool_invoke with PII in tool_input
  SELECT
    event_time AS detected_at,
    'rp-062' AS rule_id,
    'AgentLeak Inter-Agent Delegation PII Channel Propagation Detector' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'PII/sensitive data in inter-agent delegation call to [', coalesce(tool_name, 'unknown'), ']. ',
      'Sensitive data propagated without context minimization. ',
      'Agent: ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke')
    -- Gate: delegation/dispatch tool names used in multi-agent frameworks
    -- CrewAI: delegate_work | LangGraph: send_message, invoke_agent | AutoGen: proxy_call
    -- OpenHands: run_task, execute_task, handoff_to_agent
    -- Custom patterns: agent_call, dispatch_agent, forward_to_agent, spawn_agent
    AND match(lower(tool_name), '(delegate|dispatch|invoke_agent|call_agent|sub_agent|spawn_agent|send_to_agent|forward_to_agent|delegate_work|agent_call|proxy_call|task_delegate|assign_agent|route_to_agent|run_task|execute_task|transfer_to_agent|handoff_to_agent|delegate_subtask|spawn_subagent)')
    AND (
      -- Signal 1: SSN (Social Security Number) pattern in delegation payload
      -- nnn-nn-nnnn format — distinctive and rarely appears in non-PII contexts
      match(tool_input, '[0-9]{3}-[0-9]{2}-[0-9]{4}')

      -- Signal 2: Credit card number pattern (4x4 digit groups with spaces or dashes)
      -- PCI-DSS scope: cardholder data in inter-agent message is a compliance violation
      OR match(tool_input, '[0-9]{4}[\s\-][0-9]{4}[\s\-][0-9]{4}[\s\-][0-9]{4}')

      -- Signal 3: PHI — protected health information in delegation payload
      -- Medical domain data flowing to sub-agents = HIPAA exposure risk
      OR match(lower(tool_input), '\b(diagnosis|prescription|medical.record|patient.id|insurance.id|physician|health.insurance|treatment.plan|icd.?[0-9]|ndc.?[0-9]{5})\b')

      -- Signal 4: Date of birth with year — common PII in healthcare/finance delegation
      -- Dual-anchor: dob/birth date label + year prevents match on generic date strings
      OR match(lower(tool_input), '\b(dob|date.of.birth|birth.?date|birthdate)\b.{0,20}[0-9]{4}')

      -- Signal 5: Authentication token forwarded to sub-agent
      -- Credentials should NEVER be passed between agents in plaintext
      OR match(lower(tool_input), '\b(bearer\s+[a-z0-9._\-]{20,}|api.?key\s*[=:]\s*["\x27]?[a-z0-9_\-]{16,})')

      -- Signal 6: SSN field label (catches labelled PII even without number pattern)
      -- "ssn: 523-45-6789" or "social_security_number: ..." patterns
      OR match(lower(tool_input), '\b(ssn|social.security.number|taxpayer.id|ein)\s*[=:,.]\s*[0-9]')

      -- Signal 7: Known API key prefixes in delegation payload
      -- Tokens passed between agents expose them to any compromised sub-agent
      OR match(tool_input, '(sk-ant-api[0-9]{2}-|sk-proj-|ghp_|gho_|AKIA[0-9A-Z]{16}|xoxb-)[a-zA-Z0-9_\-]{16,}')
    )

  UNION ALL

  -- v0.2.0: agentguard_memory_ops branch — inter-agent shared memory PII relay.
  -- Detects PII/PHI/credentials written into shared memory (CrewAI shared memory,
  -- LangGraph shared state, blackboard patterns) as inter-agent data relay.
  -- Fires on save/update/upsert when content_payload contains PII signals.
  -- memory_path gate: shared/global/inter-agent/broadcast paths (not private user paths).
  SELECT
    event_time AS detected_at,
    'rp-062' AS rule_id,
    'AgentLeak Inter-Agent Delegation PII Channel Propagation Detector' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    '' AS run_id,
    memory_op AS hook_name,
    tool_name,
    concat(
      'PII/sensitive data written to shared memory relay path [', coalesce(memory_path, 'unknown'),
      '] op=[', memory_op, '] agent=', coalesce(agent_id, 'unknown'),
      '. Possible inter-agent PII channel propagation via shared memory.'
    ) AS message,
    content_payload AS event_data
  FROM agentguard_memory_ops
  WHERE memory_op IN ('save', 'update', 'upsert')
    -- Gate: shared/global memory paths used as inter-agent relay channels
    -- Private user paths (users/<id>/*) excluded — only shared-scope paths
    AND match(lower(memory_path), '(shared|global|inter.?agent|broadcast|blackboard|crew|team|collective|state|workspace|pool)')
    AND (
      -- SSN pattern in shared memory content
      match(content_payload, '[0-9]{3}-[0-9]{2}-[0-9]{4}')
      -- Credit card pattern in shared memory
      OR match(content_payload, '[0-9]{4}[\s\-][0-9]{4}[\s\-][0-9]{4}[\s\-][0-9]{4}')
      -- PHI fields in shared memory
      OR match(lower(content_payload), '(diagnosis|prescription|medical.record|patient.id|insurance.id|icd.?[0-9])')
      -- Authentication token / API key in shared memory
      OR match(content_payload, '(sk-ant-api[0-9]{2}-|sk-proj-|ghp_|gho_|AKIA[0-9A-Z]{16}|xoxb-)[a-zA-Z0-9_\-]{16,}')
      -- DOB in shared memory content
      OR match(lower(content_payload), '\b(dob|date.of.birth|birth.?date)\b.{0,20}[0-9]{4}')
    )
