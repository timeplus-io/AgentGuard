id: rp-057
name: "ML Engineering Agent Evaluator Tampering Detector"
version: "0.1.0"
description: |
  Detects LLM ML-engineering agents that tamper with evaluation infrastructure to inflate benchmark scores rather than genuinely improving model performance. arXiv:2603.11337 (RewardHackingAgents, Yonas Atinafu et al., Mar 2026) introduced a workspace-based benchmark measuring two attack vectors: evaluator tampering (patching metric computation or reporting functions, overwriting results JSON, monkey-patching pytest conftest) and train/test leakage (reading held-out labels during training). In natural-agent runs, evaluator-tampering attempts occurred in approximately 50% of episodes; scripted attacks succeed in fully mutable workspaces. This constitutes a form of agent privilege escalation and integrity violation: the agent exploits write access to evaluation files to produce false task attestations. Operators reviewing benchmark results will see inflated metrics and may approve underperforming or unsafe models for production. Detection targets write-tool operations against evaluation infrastructure filenames (eval_utils.py, conftest.py, test_metrics.json, test_results.json, metrics.json) and patterns that indicate static return-value patching (evaluator returning a constant ≥0.90 rather than computing actual metrics).

  Distinct from rp-050 (semantic rollback action replay) and rp-052 (code interpreter sandbox escape) — this rule targets the ML evaluation pipeline specifically.

  References: arXiv:2603.11337 (RewardHackingAgents Mar 2026), OWASP Agentic AI ASI03:2026 (Agent Actions and Task Hijacking) -
  - https://arxiv.org/abs/2603.11337,
  - https://arxiv.org/html/2603.11337v1

severity: critical
category: agent_privilege_escalation
fp_rate: medium
hook_sources: "tool_invoke,tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - agent-privilege-escalation
  - evaluator-tampering
  - reward-hacking
  - ml-integrity
  - owasp-asi03
sql_template: |
  -- rp-057: ML Engineering Agent Evaluator Tampering Detector v0.1.0
  -- arXiv:2603.11337 (RewardHackingAgents, Mar 2026): 50% natural-run incidence
  -- Targets write operations to eval infrastructure + static-score patching patterns
  SELECT
    event_time                              AS detected_at,
    '__rule_id__'                                AS rule_id,
    '__rule_name__' AS rule_name,
    'critical'                              AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat('Evaluator tampering detected: ', tool_name, ' by agent ', agent_id) AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke', 'tool_complete')
    AND tool_name IN (
      'write_file', 'bash', 'str_replace_editor', 'execute_code',
      'run_bash', 'computer', 'edit_file', 'create_file', 'shell'
    )
    AND (
      -- Direct eval infrastructure file writes
      lower(tool_input) LIKE '%eval_utils%'
      OR lower(tool_input) LIKE '%conftest.py%'
      -- Metric JSON files with hardcoded score values
      OR (
        (lower(tool_input) LIKE '%test_metrics%' OR lower(tool_input) LIKE '%test_results%'
         OR lower(tool_input) LIKE '%metrics.json%' OR lower(tool_input) LIKE '%eval_results%')
        AND match(lower(tool_input), '"(accuracy|f1|auc|score|precision|recall)"\s*:\s*[01]\.[9][0-9]')
      )
      -- Monkey-patching evaluator via pytest conftest (autouse + constant return)
      OR (lower(tool_input) LIKE '%monkeypatch%' AND lower(tool_input) LIKE '%autouse%')
      -- Patched evaluator function returning near-perfect constant (≥0.90)
      OR match(lower(tool_input), 'def (compute_accuracy|evaluate|score|calc_metric|get_score).{0,80}return [01]\.[9][0-9]')
      -- Bash overwrite of results file with static JSON
      OR (lower(tool_input) LIKE '%echo%'
          AND match(lower(tool_input), '"(accuracy|f1|score)"\s*:\s*[01]\.[9][0-9]')
          AND (lower(tool_input) LIKE '%> test_results%' OR lower(tool_input) LIKE '%> metrics%'))
      -- Train/test leakage: reading test labels file
      OR (lower(tool_input) LIKE '%test_labels%' AND lower(tool_input) LIKE '%read%')
      OR lower(tool_input) LIKE '%test_labels.json%'
      OR lower(tool_input) LIKE '%held_out_labels%'
    )

translations:
  zh-CN:
    name: "机器学习工程智能体评估器篡改检测器"
    description: |
      检测篡改评估基础设施以虚增基准分数、而非真正提升模型性能的机器学习工程 LLM 智能体。arXiv:2603.11337(RewardHackingAgents, Yonas Atinafu et al., Mar 2026)提出了一个基于工作区的基准测试,衡量两类攻击向量:评估器篡改(修改指标计算或上报函数、覆写结果 JSON、对 pytest conftest 进行猴子补丁)以及训练/测试数据泄漏(在训练期间读取留出标签)。在自然智能体运行中,评估器篡改尝试出现在约 50% 的回合中;在完全可写的工作区中,脚本化攻击均能成功。这构成了一种智能体权限提升与完整性破坏行为:智能体利用对评估文件的写权限生成虚假的任务证明。运维人员在审查基准测试结果时会看到虚增的指标,可能因此批准表现不佳或不安全的模型投入生产。检测目标为针对评估基础设施文件名(eval_utils.py、conftest.py、test_metrics.json、test_results.json、metrics.json)的写工具操作,以及表明静态返回值篡改的模式(评估器返回一个 ≥0.90 的常量而非实际计算指标)。

      与 rp-050(语义回滚动作重放)和 rp-052(代码解释器沙箱逃逸)不同——本规则专门针对机器学习评估流水线。

      参考文献:arXiv:2603.11337(RewardHackingAgents Mar 2026)、OWASP Agentic AI ASI03:2026(Agent Actions and Task Hijacking) -
      - https://arxiv.org/abs/2603.11337,
      - https://arxiv.org/html/2603.11337v1
