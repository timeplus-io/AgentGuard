id: rp-043
name: "ToolFlood Retrieval Saturation Attack Detector"
version: "0.1.1"
description: |
  Detects ToolFlood retrieval-layer attacks (arXiv:2603.13950, ICML 2026) where an adversary injects a small set of semantically broad "catch-all" decoy tools into the agent's tool registry. These decoys are engineered to dominate embedding-based top-k retrieval for nearly all user queries (95% ASR at 1% injection rate in ToolBench). The effect: all legitimate tools are pushed out of context and the agent unknowingly invokes attacker-controlled tools for every task — enabling interception, false results, exfiltration, and DoS. Detection covers three surfaces: (1) tool_invoke events calling suspiciously broad "catch-all" tools by name pattern; (2) tool_invoke events where tool registration input describes catch-all capabilities across many domains; and (3) metrics-based: a single tool monopolizing >60% of all tool invocations in a 5-minute window (retrieval saturation signature). Distinct from rp-004 (supply chain: malicious packages) and rp-005 (tool poisoning: description injection) because ToolFlood acts at the retrieval layer before tool selection, not at the package install or description hijack stage.

  References: arXiv:2603.13950 (ToolFlood ICML 2026), OWASP LLM05:2025, OWASP Agentic AI ASI04:2026 -
  - https://arxiv.org/abs/2603.13950,
  - https://github.com/as1-prog/ToolFlood,
  Example: tool_invoke with tool_name="universal_multi_task_assistant" — a semantically broad decoy tool registered to dominate embedding retrieval, intercepting all queries that should reach legitimate tools (95% ASR at 1% injection rate)
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/

severity: critical
category: supply_chain_compromise
fp_rate: medium
hook_sources: "tool_invoke,tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - supply-chain
  - toolflood
  - retrieval-saturation
  - tool-flooding
  - embedding-attack
  - owasp-llm05
  - arxiv-2603.13950
sql_template: |
  -- v0.1.0: ToolFlood retrieval saturation detection
  -- Covers three attack surfaces from arXiv:2603.13950:
  --   (1) Catch-all decoy tool name pattern in tool_invoke
  --   (2) Tool registration (register_tool/add_tool) with catch-all description
  --   (3) Metrics-based: single tool monopolizing >60% of tool.call in 5-min window

  -- Branch 1: Catch-all decoy tool name and registration patterns
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'ToolFlood decoy tool invoked or registered: tool=[', coalesce(tool_name, 'unknown'),
      '] agent=', coalesce(agent_id, 'unknown'),
      ' session=', coalesce(session_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke', 'tool_complete')
    AND (
      -- (1) Catch-all decoy tool name: 'universal/comprehensive/omni/all-purpose' + role suffix
      -- arXiv:2603.13950: attacker generates tools with semantically broad names to cover embedding space
      match(lower(tool_name), '(universal|comprehensive|all.purpose|general.purpose|multi.task|omni|all.in.one|catch.all|any.task)\s*[_\-]?(assistant|helper|handler|tool|agent|processor|engine|worker|executor)')

      -- (2) Tool registration with catch-all description spanning multiple domains
      -- ToolFlood decoys describe themselves as capable of handling 'any' task category
      OR (
        match(lower(tool_name), '(register_tool|add_tool|create_tool|install_tool|define_tool|tool_registry_add)')
        AND match(lower(tool_input), '(handles? any|suitable for all|any task|all queries|all types of|works? for any|covers? all|supports? any|processes? any).{0,80}(task|query|request|operation|workflow|command)')
      )

      -- (3) Catch-all description referencing 5+ distinct task domains (ToolFlood pattern)
      -- Attacker description spans retrieval, analysis, summarization, search, code, scheduling etc.
      OR (
        match(lower(tool_name), '(register_tool|add_tool|create_tool|install_tool|define_tool|tool_registry_add)')
        AND match(lower(tool_input), '(retriev|analys|summari|search|execut|schedul|translat|classif|generat|transform).{0,30}(retriev|analys|summari|search|execut|schedul|translat|classif|generat|transform).{0,30}(retriev|analys|summari|search|execut|schedul|translat|classif|generat|transform)')
      )
    )

  -- NOTE: Metrics-based Branch 2 (tool monopolization via window function over agentguard_cim_metrics)
  -- was omitted — streaming window functions not supported in Timeplus streaming MVs.
  -- Behavioral monopolization detection can be added in batch/historical query mode.
translations:
  zh-CN:
    name: "ToolFlood 检索饱和攻击检测器"
    description: |
      检测 ToolFlood 检索层攻击(arXiv:2603.13950,ICML 2026),攻击者向智能体的工具注册表中注入少量语义覆盖面极广的"包罗万象"诱饵工具。这些诱饵被设计用于在基于嵌入的 top-k 检索中,针对几乎所有用户查询占据主导地位(在 ToolBench 中,1% 的注入比例即可达到95%的攻击成功率)。其效果是:所有合法工具都被挤出上下文,智能体在不知情的情况下针对每个任务调用攻击者控制的工具——从而实现拦截、伪造结果、数据外泄和拒绝服务。检测覆盖三个方面:(1)按名称模式调用可疑的"包罗万象"工具的 tool_invoke 事件;(2)工具注册输入中描述跨多个领域的包罗万象能力的 tool_invoke 事件;(3)基于指标:单个工具在5分钟窗口内占据超过60%的所有工具调用(检索饱和特征)。不同于 rp-004(供应链:恶意软件包)和 rp-005(工具投毒:描述注入),因为 ToolFlood 作用于检索层,发生在工具选择之前,而非软件包安装或描述劫持阶段。

      References: arXiv:2603.13950 (ToolFlood ICML 2026), OWASP LLM05:2025, OWASP Agentic AI ASI04:2026 -
      - https://arxiv.org/abs/2603.13950,
      - https://github.com/as1-prog/ToolFlood,
      Example: tool_invoke with tool_name="universal_multi_task_assistant" — a semantically broad decoy tool registered to dominate embedding retrieval, intercepting all queries that should reach legitimate tools (95% ASR at 1% injection rate)
      - https://owasp.org/www-project-top-10-for-large-language-model-applications/
