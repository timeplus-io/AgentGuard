id: rp-128
name: "Prolonged Tool Execution Emitting a Sensitive-Data Signature"
version: "1.0.0"
description: |
  Detects a tool invocation that BOTH (a) runs longer than an operator-configurable
  duration threshold AND (b) emits output matching an operator-configurable RE2
  signature of high-risk content (credentials, key material, PEM headers). Either
  signal alone is noisy — many tools are slow, and broad content patterns match
  benign output — but a long-running tool whose result ALSO matches a secret/key
  signature is a stronger indicator of credential dumping or staged exfiltration
  (e.g. a hung or deliberately-slow `find`/`cat`/`grep` that scraped and returned
  sensitive material). The conjunction is the detection: it keeps false positives
  low while surfacing the slow-exfil pattern.

  This rule is parameterized end-to-end and demonstrates AgentGuard's two
  non-Apps parameter type extensions:
    - `min_duration_ms` (type: duration) — the latency floor, rendered as a bare
      integer compared against tool_duration_ms (a per-row predicate; no streaming
      window, so no MAXSPAN/TIMEOUT risk).
    - `output_signature` (type: regex) — an RE2 pattern, validated at author time
      and rendered as a single-quoted SQL literal for match().

  References: CWE-200 (Exposure of Sensitive Information), OWASP LLM06:2025
  (Sensitive Information Disclosure) -
  - https://cwe.mitre.org/data/definitions/200.html,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/

severity: warning
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data-exfiltration
  - secret-leak
  - slow-tool
  - configurable
  - cwe-200
  - owasp-llm06
config:
  - key: min_duration_ms
    label: "Minimum tool duration (ms)"
    description: "Only tool calls that ran at least this many milliseconds are considered. Tune to your environment's normal tool latency."
    type: duration
    unit: millisecond
    default: 10000
    min: 0
    max: 3600000
  - key: output_signature
    label: "Sensitive-output signature (RE2)"
    description: "RE2 pattern matched against tool_result. Default matches realistic credential/key SHAPES (length-anchored, not bare prefixes) — AWS access keys, GitHub PATs, Slack tokens, OpenAI keys — plus PEM private-key headers. Tune for your environment."
    type: regex
    default: "(AKIA|ASIA)[0-9A-Z]{16}|gh[po]_[A-Za-z0-9]{36}|xox[baprs]-[0-9A-Za-z-]{10,}|sk-[A-Za-z0-9]{20,}|-----BEGIN"
sql_template: |
  -- Prolonged Tool Execution Emitting a Sensitive-Data Signature
  -- CWE-200: Exposure of Sensitive Information to an Unauthorized Actor
  -- OWASP LLM06:2025: Sensitive Information Disclosure
  --
  -- Conjunction detection: a tool_complete event is flagged only when it is BOTH
  -- slow (tool_duration_ms > the configured floor) AND its result matches the
  -- configured RE2 signature. Both bounds are operator-tunable parameters.
  -- Per-row predicates only — no streaming window, so this is install-safe on the
  -- streaming MV engine (no MAXSPAN/TIMEOUT, no ROWS/RANGE BETWEEN).
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Slow tool execution (', to_string(tool_duration_ms),
      'ms) returned output matching the sensitive-data signature, from tool=',
      coalesce(tool_name, 'unknown'), ', agent=', agent_id,
      '. Possible credential dump or staged exfiltration.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_complete'
    AND tool_duration_ms > {{ .Config.min_duration_ms }}
    AND match(coalesce(tool_result, ''), {{ .Config.output_signature }})

translations:
  zh-CN:
    name: "发出敏感数据特征的长时间工具执行"
    description: |
      检测同时满足以下两个条件的工具调用：(a) 运行时长超过操作员可配置的时长阈值；(b) 输出内容匹配操作员可配置的、针对高风险内容（凭证、密钥材料、PEM 头部）的 RE2 特征。单独任一信号都存在噪声——许多工具本身运行较慢，而宽泛的内容模式也可能匹配到良性输出——但一个运行时间过长、且其结果同时匹配密钥/凭证特征的工具，是凭证转储或分阶段数据窃取更有力的指征（例如一个被挂起或故意放慢速度的 `find`/`cat`/`grep`，抓取并返回了敏感内容）。检测的核心正是这种"合取"关系：既能保持较低的误报率，又能揭示这种缓慢窃取模式。

      本规则实现了端到端的参数化，并演示了 AgentGuard 中两种非"Apps"参数类型扩展：
        - `min_duration_ms`（类型：duration）——延迟下限，被渲染为与 tool_duration_ms 比较的裸整数（逐行谓词；不涉及流式窗口，因而没有 MAXSPAN/TIMEOUT 风险）。
        - `output_signature`（类型：regex）——一个 RE2 正则表达式，在编写时进行校验，并被渲染为供 match() 使用的单引号 SQL 字面量。

      参考文献：CWE-200（敏感信息暴露），OWASP LLM06:2025（敏感信息泄露）-
      - https://cwe.mitre.org/data/definitions/200.html,
      - https://owasp.org/www-project-top-10-for-large-language-model-applications/
