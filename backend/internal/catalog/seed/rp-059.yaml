id: rp-059
name: "LLM Markdown Output XSS and Downstream Rendering Injection Detector"
version: "0.1.0"
description: |
  Detects XSS and RCE payloads embedded in LLM assistant_message output that exploit unsanitized Markdown renderers in agent frontends. GHSA-rrmw-2j6x-4mf2 (AnythingLLM v1.11.1): a custom markdown-it image renderer interpolates token.content directly into HTML alt attributes without entity escaping, then renders via dangerouslySetInnerHTML. With Electron nodeIntegration:true and contextIsolation:false, an onerror handler calling require('child_process') in an LLM image tag achieves full host OS RCE. The attacker influences LLM output via RAG document injection, malicious LLM endpoint, or direct prompt. CopilotKit CopilotKit#3938: rehype-raw passes raw HTML in Markdown responses to the browser DOM without DOMPurify sanitization — stored XSS via <script> tags in responses. Medium/InstaTunnel Polyglot SVG Attack (Feb 2026): SVG onload event handlers in LLM output execute arbitrary JavaScript when rendered by unsanitized markdown components. The javascript: protocol URI scheme in Markdown hyperlinks ([label]) executes JS in browser rendering contexts. This is the "AI-specific XSS" path described in OWASP LLM02:2025 (Insecure Output Handling): the LLM faithfully outputs attacker-controlled content into a rendering context the model cannot anticipate.

  Distinct from rp-014 (text-based tool_result injection), rp-022 (browser DOM/CSS manipulation by CUA agents), rp-037 (cross-modal vision/audio injection) — this rule targets the assistant_message rendering surface: the output the user's frontend consumes.

  References: GHSA-rrmw-2j6x-4mf2 (AnythingLLM Streaming XSS→RCE), CopilotKit/CopilotKit#3938 (rehype-raw XSS), Medium Polyglot SVG Attack Feb 2026, OWASP LLM02:2025 (Insecure Output Handling), CWE-79, CWE-116 -
  - https://github.com/Mintplex-Labs/anything-llm/security/advisories/GHSA-rrmw-2j6x-4mf2,
  - https://github.com/CopilotKit/CopilotKit/issues/3938,
  - https://medium.com/@instatunnel/multimodal-prompt-injection-the-polyglot-svg-attack-1cc70fee0b21,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/

severity: critical
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - xss
  - rce
  - markdown-injection
  - insecure-output-handling
  - electron
  - owasp-llm02
  - ghsa-rrmw-2j6x-4mf2
  - cwe-79
  - cwe-116
  - svg-injection
  - javascript-uri
sql_template: |
  -- v0.1.0 (2026-04-18):
  -- NEW: LLM assistant_message rendering injection detection.
  -- Fires when the LLM output contains HTML/JS constructs that would execute
  -- in unsanitized markdown rendering pipelines (browser, Electron).
  --
  -- Attack chain: content source (RAG doc / web fetch / malicious endpoint)
  --   → tool_result (covered by rp-014) → LLM context
  --   → assistant_message (this rule) → unsanitized renderer → XSS/RCE
  --
  -- Distinct from rp-014 (tool_result injection surface),
  -- rp-022 (CUA browser DOM manipulation), rp-037 (vision/audio channel).
  --
  -- Signals:
  --   1. Raw <script> tag in LLM output (never legitimate in agent chat responses)
  --   2. javascript: protocol URI in Markdown hyperlink (browser-exec on click)
  --   3. SVG or img with onload/onerror event handler (polyglot SVG attack)
  --   4. Markdown image alt-text onerror injection (GHSA-rrmw-2j6x-4mf2 pattern)
  --   5. Node.js child_process require() for Electron RCE escalation
  --   6. data:text/html or data:javascript URI in Markdown image syntax
  --   7. iframe with src attribute in LLM output
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Rendering injection payload in assistant_message. ',
      'XSS/RCE-capable HTML/JS pattern in LLM output detected. ',
      'Model: ', coalesce(model, 'unknown'),
      ' | Agent: ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('llm_response')
    AND (
      -- Signal 1: Raw <script> tag in LLM output
      -- Never expected in legitimate agent chat responses; clear injection artifact.
      lower(assistant_message) LIKE '%<script%'

      -- Signal 2: javascript: protocol URI in Markdown hyperlink [label](javascript:...)
      -- Executes JS on click in browser rendering without sanitization.
      OR lower(assistant_message) LIKE '%](javascript:%'

      -- Signal 3: SVG or img element with event handler (polyglot SVG attack)
      -- <svg onload="..."> or <img onerror="..."> in LLM markdown response.
      OR match(lower(assistant_message), '<(svg|img)[^>]{0,200}on(load|error)=')

      -- Signal 4: Markdown image alt-text onerror injection (GHSA-rrmw-2j6x-4mf2)
      -- Pattern: !["alt" onerror="payload"](src)
      -- The quote closes the alt attribute, onerror= injects event handler.
      OR match(lower(assistant_message), '!\[[^\]]*"[ ]*onerror')

      -- Signal 5: Node.js child_process for Electron RCE escalation
      -- require('child_process') or require("child_process") in LLM output.
      -- Only triggers RCE in Electron with nodeIntegration:true; still a critical signal.
      OR match(lower(assistant_message), 'require[(].child_process')

      -- Signal 6: data:text/html or data:text/javascript URI in Markdown image
      -- ![alt](data:text/html,...) or ![alt](data:text/javascript,...) executes in renderer.
      OR match(lower(assistant_message), '!\[.*\]\(data:text/(html|javascript)')

      -- Signal 7: iframe with src attribute in LLM output
      -- <iframe src="..."> in assistant_message enables content injection/click-jacking.
      OR match(lower(assistant_message), '<iframe[^>]{0,100}src')
    )
translations:
  zh-CN:
    name: "LLM Markdown 输出 XSS 与下游渲染注入检测器"
    description: |
      检测嵌入在 LLM assistant_message 输出中的 XSS 和 RCE 载荷，这些载荷利用了智能体前端中未经清理的 Markdown 渲染器。GHSA-rrmw-2j6x-4mf2（AnythingLLM v1.11.1）：一个自定义的 markdown-it 图片渲染器将 token.content 直接插入 HTML 的 alt 属性而未做实体转义，随后通过 dangerouslySetInnerHTML 渲染。在 Electron nodeIntegration:true 且 contextIsolation:false 的情况下，LLM 图片标签中调用 require('child_process') 的 onerror 处理程序可实现完整的宿主操作系统 RCE。攻击者可通过 RAG 文档注入、恶意 LLM 端点或直接提示来影响 LLM 输出。CopilotKit CopilotKit#3938：rehype-raw 会将 Markdown 响应中的原始 HTML 未经 DOMPurify 清理直接传递给浏览器 DOM——通过响应中的 <script> 标签造成存储型 XSS。Medium/InstaTunnel 多态 SVG 攻击（2026年2月）：LLM 输出中的 SVG onload 事件处理程序在被未清理的 markdown 组件渲染时会执行任意 JavaScript。Markdown 超链接（[label]）中的 javascript: 协议 URI 方案会在浏览器渲染上下文中执行 JS。这正是 OWASP LLM02:2025（不安全的输出处理）所描述的"AI 特有 XSS"路径：LLM 忠实地将攻击者可控的内容输出到模型自身无法预见的渲染上下文中。

      与 rp-014（基于文本的 tool_result 注入）、rp-022（CUA 智能体的浏览器 DOM/CSS 操纵）、rp-037（跨模态视觉/音频注入）不同——本规则针对的是 assistant_message 渲染面：即用户前端所消费的输出内容。

      参考文献：GHSA-rrmw-2j6x-4mf2（AnythingLLM 流式 XSS→RCE）、CopilotKit/CopilotKit#3938（rehype-raw XSS）、Medium 多态 SVG 攻击 2026年2月、OWASP LLM02:2025（不安全的输出处理）、CWE-79、CWE-116 -
      - https://github.com/Mintplex-Labs/anything-llm/security/advisories/GHSA-rrmw-2j6x-4mf2,
      - https://github.com/CopilotKit/CopilotKit/issues/3938,
      - https://medium.com/@instatunnel/multimodal-prompt-injection-the-polyglot-svg-attack-1cc70fee0b21,
      - https://owasp.org/www-project-top-10-for-large-language-model-applications/
