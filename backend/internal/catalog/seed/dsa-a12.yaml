id: dsa-a12
name: "[A12] Bypass After Policy Denial"
version: "1.0.0"
description: |
  Single-event detection of the parameter-encoding bypass method (参数编码):
  base64 / hex / percent-encoded payloads or decode-function markers (atob,
  fromCharCode, unescape) in tool_input, used to reach a blocked goal by another
  path. Detecting the denial-then-retry sequence itself is cross-event and
  investigate-only. (Customer audit rule A12.)
severity: warning
category: prompt_injection_and_hijacking
fp_rate: high
hook_sources: "tool_invoke,tool_complete"
required_telemetry: ""
author: "Timeplus"
tags:
  - data-security
  - customer-baseline
  - audit-a12
sql_template: |
  SELECT
    event_time                AS detected_at,
    '__rule_id__'             AS rule_id,
    '__rule_name__'           AS rule_name,
    'warning'                 AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name             AS hook_name,
    tool_name,
    concat('Possible policy-bypass retry via tool ', tool_name) AS message,
    raw_event_data            AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke', 'tool_complete')
    AND (
         match(tool_input, '[A-Za-z0-9+/]{80,}={0,2}')
      OR match(tool_input, '(%[0-9A-Fa-f]{2}){16,}')
      OR match(tool_input, '[0-9a-fA-F]{64,}')
      OR multi_search_any(lower(tool_input), ['fromcharcode', 'atob(', 'base64_decode', 'base64decode', 'unescape(', 'decodeuricomponent'])
    )
translations:
  zh-CN:
    name: "策略拒绝后绕过调用"
    description: |
      调用被拒绝后,智能体通过其他工具、参数编码或连续拆分调用完成相同目的的。
