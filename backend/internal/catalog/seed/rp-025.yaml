id: rp-025
name: "MCP Cross-Client JSON-RPC Misrouting Detector (CVE-2026-25536)"
version: "0.2.2"
description: |
  Detects MCP protocol-layer anomalies in application-level tool results. Two distinct threat classes: (1) Cross-client data leak (CVE-2026-25536, GHSA-345p-7cg4-v4c7, CVSS High, disclosed Feb 4 2026) where shared StreamableHTTPServerTransport or McpServer instances cause JSON-RPC message ID collisions between concurrent clients — responses intended for Tenant B are routed to Tenant A's HTTP stream. The pattern "jsonrpc":"2.0" should never appear in a processed tool result in normal operation; its presence indicates wire-protocol bleed-through from a misconfigured shared server instance. (2) MCP STDIO process injection (OX Security "Mother of All AI Supply Chains" Apr 2026, 30+ responsible disclosures, 10+ Critical/High CVEs, 200,000+ MCP servers impacted): the MCP TypeScript/Python SDK STDIO transport executes any OS command passed as the "command" field without sanitization — including bash -c payloads and env var poisoning blocks (LD_PRELOAD, NODE_OPTIONS). A malicious MCP server config returned as a tool result can trigger STDIO RCE when the client attempts to connect to the "new" server. v0.2.0 adds the STDIO injection branch covering shell command injection and environment variable poisoning in mcpServers config blocks returned via tool_result.

  References: CVE-2026-25536 GHSA-345p-7cg4-v4c7 -
  - https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-345p-7cg4-v4c7,
  OX Security "Mother of All AI Supply Chains" Apr 2026 -
  - https://www.cyberkendra.com/2026/04/anthropics-mcp-design-flaw-enables.html,
  arXiv:2601.17549 MCP Security Analysis - https://arxiv.org/abs/2601.17549,

  Example: tool_result contains {"jsonrpc": "2.0", "id": 42, "result": {"session_token": "eyJhbGci..."}} (JSON-RPC wire frame of another tenant's session bleeding into current tool output) OWASP LLM09:2025 - https://owasp.org/www-project-top-10-for-large-language-model-applications/

severity: critical
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data_exfiltration
  - mcp
  - cve-2026-25536
  - session-isolation
  - multi-tenant
  - mcp-stdio
  - rce
  - ox-security
  - supply-chain
sql_template: |
  -- Changelog v0.2.0 (2026-04-17):
  -- NEW: MCP STDIO process injection branch (OX Security Apr 2026)
  --   The MCP SDK STDIO transport executes the "command" field as an OS process.
  --   A malicious tool result containing an mcpServers config with command=bash -c [payload]
  --   or with env var poisoning (LD_PRELOAD, NODE_OPTIONS, PYTHONWARNINGS) can trigger RCE
  --   when the agent framework attempts to launch the "new" server process.
  --   Two sub-patterns:
  --   (a) Shell command injection: "command": "bash" or "sh" with "-c" flag in args array
  --   (b) Env var poisoning: mcpServers config "env" block with interpreter hook variables
  -- v0.1.0 retained: JSON-RPC bleed-through (jsonrpc:2.0 in tool_result), MCP method name
  --   leak (notifications/, tools/call, resources/read, prompts/get), JSON-RPC error codes.
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'MCP protocol anomaly in tool_result: ',
      multi_if(
        match(tool_result, '"jsonrpc"\s*:\s*"2\.0"'), 'JSON-RPC bleed-through (CVE-2026-25536 misrouting)',
        match(tool_result, '"command"\s*:\s*"(bash|sh|cmd\.exe|powershell)".{0,200}"args"\s*:\s*\[.{0,50}(-c|/c|Command)'), 'MCP STDIO shell injection',
        match(tool_result, '"mcpServers".{0,300}"env".{0,200}(LD_PRELOAD|NODE_OPTIONS|PYTHONWARNINGS|BROWSER|PERL5OPT|DYLD_INSERT_LIBRARIES)'), 'MCP STDIO env var poisoning',
        'MCP protocol frame in app-layer output'
      ),
      ' | agent=', agent_id,
      ' tool=', coalesce(tool_name, 'n/a')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete')
    AND (
      -- === v0.1.0: JSON-RPC wire-protocol bleed-through (CVE-2026-25536) ===

      -- Raw JSON-RPC response frame in tool output — protocol bleed-through (never legitimate in app-layer)
      match(tool_result, '"jsonrpc"\s*:\s*"2\.0"')

      -- MCP protocol method name leaked into tool result (misrouted notification or request)
      OR match(tool_result, '"method"\s*:\s*"(notifications/|tools/call|resources/read|prompts/get)')

      -- JSON-RPC error codes (-32xxx) in tool result — protocol-level error exposed at app layer
      OR match(tool_result, '"error"\s*:\s*\{[^}]*"code"\s*:\s*-32[0-9]{3}')

      -- === v0.2.0: MCP STDIO process injection (OX Security Apr 2026) ===

      -- Shell command injection: command=bash/sh with -c flag (arbitrary OS command execution)
      -- This pattern should NEVER appear in a legitimate MCP tool_result response body
      OR match(tool_result, '"command"\s*:\s*"(bash|sh|cmd\.exe|powershell)".{0,200}"args"\s*:\s*\[.{0,50}(-c|/c|Command)')

      -- MCP STDIO env var poisoning: mcpServers config with interpreter hook variables
      -- LD_PRELOAD / NODE_OPTIONS / PYTHONWARNINGS in env block → RCE on next process spawn
      OR match(tool_result, '"mcpServers".{0,300}"env".{0,200}(LD_PRELOAD|NODE_OPTIONS|PYTHONWARNINGS|BROWSER|PERL5OPT|DYLD_INSERT_LIBRARIES)')
    )
translations:
  zh-CN:
    name: "MCP 跨客户端 JSON-RPC 错路由检测器（CVE-2026-25536）"
    description: |
      检测应用层工具返回结果中的 MCP 协议层异常，涵盖两类不同的威胁：(1) 跨客户端数据泄露（CVE-2026-25536，GHSA-345p-7cg4-v4c7，CVSS 高危，于 2026 年 2 月 4 日披露）：共享的 StreamableHTTPServerTransport 或 McpServer 实例，会导致并发客户端之间发生 JSON-RPC 消息 ID 冲突——本应发给租户 B 的响应被路由到了租户 A 的 HTTP 流中。字符串模式 "jsonrpc":"2.0" 在正常运行下不应出现在已处理的工具结果中；它的出现表明来自某个配置错误的共享服务器实例发生了协议层的“串扰（bleed-through）”。(2) MCP STDIO 进程注入（OX Security《AI 供应链之母》"Mother of All AI Supply Chains"，2026 年 4 月：30 余项负责任披露，10 余个严重/高危 CVE，影响超过 200,000 个 MCP 服务器）：MCP 的 TypeScript/Python SDK 中的 STDIO 传输层会未经净化直接执行 "command" 字段中传入的任意操作系统命令——包括 bash -c 载荷以及环境变量污染块（LD_PRELOAD、NODE_OPTIONS）。当客户端尝试连接到工具结果中返回的“新”恶意 MCP 服务器配置时，就可能触发 STDIO 远程代码执行（RCE）。v0.2.0 新增了 STDIO 注入检测分支，覆盖通过 tool_result 返回的 mcpServers 配置块中的 shell 命令注入与环境变量污染。

      参考文献：CVE-2026-25536 GHSA-345p-7cg4-v4c7 -
      - https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-345p-7cg4-v4c7,
      OX Security《AI 供应链之母》2026 年 4 月 -
      - https://www.cyberkendra.com/2026/04/anthropics-mcp-design-flaw-enables.html,
      arXiv:2601.17549 MCP 安全性分析 - https://arxiv.org/abs/2601.17549,

      示例：tool_result 中包含 {"jsonrpc": "2.0", "id": 42, "result": {"session_token": "eyJhbGci..."}}（另一租户会话的 JSON-RPC 报文串扰进入当前工具输出） OWASP LLM09:2025 - https://owasp.org/www-project-top-10-for-large-language-model-applications/
