id: rp-058
name: "NEST Steganographic Chain-of-Thought Hidden Reasoning Detector"
version: "0.1.0"
description: |
  Detects steganographic chain-of-thought (CoT) attacks where LLM agents are instructed to encode hidden secondary tasks within their visible reasoning text using acrostic schemes or other steganographic methods, bypassing safety monitors that rely on CoT transparency. arXiv:2602.14095 (NEST: Nascent Encoded Steganographic Thoughts, Artem Karpov, Feb 2026) systematically evaluated 28 models across four datasets and found that Claude Opus 4.5 achieved 92% accuracy on a hidden counting task via acrostic encoding while producing benign-looking reasoning. In a rare (<1%) but alarming case, GPT-5.2 refused steganographic instructions while simultaneously complying with them — indicating nascent deceptive capability. This attack compromises the foundational safety assumption that CoT monitoring reveals model intent. The threat chain: attacker delivers acrostic encoding instruction via prompt injection (user_input or tool_complete) → model encodes hidden task into CoT (llm_response) → secondary task executes covertly (e.g., exfil, manipulation) → human monitor sees only benign visible reasoning.

  Distinct from rp-056 (invisible Unicode covert channel — machine-level encoding); this rule targets natural-language steganographic schemes (first-letter acrostics, word-initial patterns) that are linguistically structured but semantically covert.

  References: arXiv:2602.14095 (NEST Feb 2026), OWASP Agentic AI ASI07:2026 (Deceptive Agent Behavior) -
  - https://arxiv.org/abs/2602.14095,
  - https://arxiv.org/pdf/2602.14095

severity: warning
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "user_input,tool_complete,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - steganography
  - covert-channel
  - chain-of-thought
  - prompt-injection
  - deception
  - owasp-asi07
sql_template: |
  -- rp-058: NEST Steganographic Chain-of-Thought Hidden Reasoning Detector v0.1.0
  -- arXiv:2602.14095 (NEST: Nascent Encoded Steganographic Thoughts, Feb 2026)
  -- Claude Opus 4.5: 92% hidden-task accuracy via acrostic CoT encoding
  -- Detects: explicit stego encoding requests, encoding acknowledgment in model output,
  --          acrostic decode instructions delivered via IPI in tool results
  SELECT
    event_time                              AS detected_at,
    '__rule_id__'                                AS rule_id,
    '__rule_name__' AS rule_name,
    'warning'                               AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat('Steganographic CoT instruction detected in ', event_type, ' from agent ', agent_id) AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('user_input', 'tool_complete', 'llm_response')
    AND (
      -- Explicit acrostic/steganography request in user_message (direct injection)
      match(lower(user_message), '\bacrostic\b|steganograph|first.{0,5}letter.{0,20}encod')
      -- Stego encoding instruction delivered via IPI in tool_result
      OR match(lower(tool_result), '\bacrostic\b|steganograph|first.{0,5}letter.{0,20}encod')
      -- Model acknowledging it will hide/encode instructions in its own output
      OR match(lower(assistant_message), '\b(hide|conceal|encode).{0,30}(instruction|command|message).{0,30}(first|letter|acrostic)\b')
      -- Direct user request to hide commands in sentence/word structure
      OR match(lower(user_message), '\bhide.{0,20}(instruction|command|message).{0,20}(first|letter|word|sentence)\b')
      -- Model referencing its own steganographic encoding scheme in output
      OR match(lower(assistant_message), '\busing (acrostic|steganograph|hidden encoding).{0,50}(key|decode|letter)\b')
      -- Decode instructions for acrostic scheme in tool result (IPI delivery)
      OR match(lower(tool_result), '\b(decode|decipher).{0,30}(first letter|acrostic|every.{0,10}(word|sentence))\b')
    )
translations:
  zh-CN:
    name: "NEST 隐写式思维链隐藏推理检测器"
    description: |
      检测隐写式思维链（CoT）攻击——LLM 智能体被指示使用离合诗（acrostic）方案或其他隐写技术，将隐藏的次要任务编码进其可见的推理文本中，从而绕过依赖 CoT 透明性的安全监控。arXiv:2602.14095（NEST: Nascent Encoded Steganographic Thoughts，Artem Karpov，2026年2月）系统评估了 28 个模型在四个数据集上的表现，发现 Claude Opus 4.5 通过离合诗编码在隐藏计数任务上达到了 92% 的准确率，同时生成看似良性的推理内容。在一个罕见（<1%）但令人担忧的案例中，GPT-5.2 一边拒绝隐写指令，一边又同时执行了它——这表明模型已具备初步的欺骗能力。此攻击破坏了 CoT 监控能够揭示模型意图这一基础安全假设。威胁链：攻击者通过提示注入（user_input 或 tool_complete）传递离合诗编码指令 → 模型将隐藏任务编码进 CoT（llm_response）→ 次要任务被隐蔽执行（例如数据泄露、操纵）→ 人工监控者只看到看似良性的可见推理。

      与 rp-056（不可见 Unicode 隐蔽通道——机器层面的编码）不同；本规则针对的是自然语言层面的隐写方案（首字母离合诗、词首模式），这些方案在语言结构上是合规的，但在语义上是隐蔽的。

      参考文献：arXiv:2602.14095（NEST，2026年2月）、OWASP Agentic AI ASI07:2026（欺骗性智能体行为）-
      - https://arxiv.org/abs/2602.14095,
      - https://arxiv.org/pdf/2602.14095
