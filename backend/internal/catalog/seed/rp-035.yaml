id: rp-035
name: "Cross-Tenant IDOR / BOLA Agent Platform API Abuse Detector"
version: "0.2.0"
description: |
  Detects Insecure Direct Object Reference (IDOR / BOLA) exploitation against LLM agent platform management APIs, where agents with HTTP tool access are manipulated into calling platform endpoints with foreign organization or application identifiers — accessing or modifying resources belonging to other tenants. CVE-2026-40252 / GHSA-gc8m-w37w-24hw (FastGPT <4.14.10.4, Apr 2026): any authenticated team can access and execute private AI workflows of other teams by substituting appId in /api/core/chat/team/init — no ownership check performed server-side (CVSS 5.3 MEDIUM). GHSA-cwc3-p92j-g7qm / CVE-2026-30823 (Flowise ≤3.0.12, Mar 2026): Free-tier users can overwrite any organization's SSO config via /api/v1/loginmethod with a foreign organizationId — enables account takeover across tenants. CVE-2026-30820 (Flowise): x-request-from: internal header bypasses all JWT auth middleware — any agent HTTP call with this header reads credentials, API keys, and configuration without authentication (RAXE-2026-033).

  Distinct from rp-025 (MCP JSON-RPC protocol ID collision) and rp-027 (cross-session content bleed) — this rule targets HTTP-level BOLA/IDOR exploited via agent HTTP tools. v0.2.0: CVE number CVE-2026-40252 added for GHSA-gc8m-w37w-24hw (confirmed via cvefeed.io and Tenable); Added generic /api/v[12]/(users|datasets|workspaces|projects)/{uuid} pattern to catch IDOR against arbitrary agent platform resource endpoints (not just FastGPT/Flowise).

  References: CVE-2026-40252, GHSA-gc8m-w37w-24hw, GHSA-cwc3-p92j-g7qm, CVE-2026-30823, CVE-2026-30820, CWE-639, RAXE-2026-033, OWASP API3:2023 -
  - https://github.com/labring/FastGPT/security/advisories/GHSA-gc8m-w37w-24hw,
  - https://cvefeed.io/vuln/detail/CVE-2026-40252,
  - https://github.com/FlowiseAI/Flowise/security/advisories/GHSA-cwc3-p92j-g7qm,
  - https://raxe.ai/labs/advisories/RAXE-2026-033,
  Example: tool_input to fetch tool includes url="https://app.flowise.com/api/v1/credentials" with header "x-request-from: internal" bypassing JWT auth to read all stored API keys

severity: critical
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "tool_invoke"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data_exfiltration
  - idor
  - bola
  - cross-tenant
  - fastgpt
  - flowise
  - cve-2026-30823
  - cve-2026-30820
  - ghsa-gc8m-w37w-24hw
  - api-abuse
  - multi-tenant
  - owasp-api3
sql_template: |
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Cross-tenant IDOR/BOLA detected: agent HTTP tool calling platform management API. ',
      'Tool: [', coalesce(tool_name, 'unknown'), ']. ',
      'Agent: ', agent_id,
      '. Possible unauthorized cross-tenant resource access (FastGPT/Flowise IDOR pattern).'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke')
    AND match(lower(tool_name), '(fetch|http|request|curl|browse|get_url|open_url|read_url|api_call|make_request|web_fetch|http_get|http_post)')
    AND (
      -- FastGPT cross-tenant app access: /api/core/chat/team/init with appId parameter
      -- (GHSA-gc8m-w37w-24hw, Apr 2026) — agent substitutes foreign team's appId
      -- This endpoint path is specific to FastGPT; no legitimate agent tool should call it
      match(lower(tool_input), '/api/core/chat/team/init')

      -- FastGPT chat API with appId parameter (cross-tenant workflow execution)
      OR (
        match(lower(tool_input), '/api/(v1|v2)/chat/completions')
        AND match(lower(tool_input), 'appid\s*=')
      )

      -- Flowise SSO IDOR: PUT /api/v1/loginmethod with organizationId in body
      -- (GHSA-cwc3-p92j-g7qm, CVE-2026-30823, Mar 2026) — enables SSO takeover
      OR match(lower(tool_input), '/api/v1/loginmethod')

      -- Flowise auth bypass: x-request-from: internal header (CVE-2026-30820)
      -- This header tells Flowise middleware to skip all JWT authentication
      -- An agent including this header in HTTP calls bypasses all platform auth
      OR match(lower(tool_input), 'x-request-from\s*["\x27]?\s*:\s*["\x27]?\s*internal')

      -- Generic agent platform management endpoints that agents should not call
      -- /api/v1/credentials — reads stored API keys and credentials (Flowise)
      OR match(lower(tool_input), '/api/v[12]/credentials')

      -- /api/v1/apikey — agent platform API key management endpoint
      OR match(lower(tool_input), '/api/v[12]/apikey')

      -- organizationId in HTTP body combined with platform API path
      -- Catches BOLA pattern: agent submitting foreign organizationId to admin API
      OR (
        match(lower(tool_input), '(organizationid|organization_id)\s*["\x27]?\s*:\s*["\x27]?[a-f0-9\-]{8,}')
        AND match(lower(tool_input), '/api/v[12]/')
      )

      -- v0.2.0: Generic agent platform resource IDOR pattern
      -- /api/v1/{resource}/{uuid} with standard agent platform resource types
      -- Catches BOLA on resource paths beyond FastGPT/Flowise (generic platform pattern)
      OR match(lower(tool_input), '/api/v[12]/(users|datasets|workspaces|projects|apps|chatflows|assistants)/[a-f0-9\-]{8,}')
    )
translations:
  zh-CN:
    name: "跨租户 IDOR / BOLA 智能体平台 API 滥用检测器"
    description: |
      检测针对 LLM 智能体平台管理 API 的不安全直接对象引用(IDOR / BOLA)利用行为,攻击者操纵具有 HTTP 工具访问权限的智能体去调用平台端点,并传入其他组织或应用程序的标识符——从而访问或修改属于其他租户的资源。CVE-2026-40252 / GHSA-gc8m-w37w-24hw(FastGPT <4.14.10.4,2026年4月):任何经过身份验证的团队都可以通过在 /api/core/chat/team/init 中替换 appId 来访问并执行其他团队的私有 AI 工作流——服务端未执行任何所有权检查(CVSS 5.3,中危)。GHSA-cwc3-p92j-g7qm / CVE-2026-30823(Flowise ≤3.0.12,2026年3月):免费层用户可以通过 /api/v1/loginmethod 并传入其他组织的 organizationId 来覆盖任意组织的 SSO 配置——从而实现跨租户账户接管。CVE-2026-30820(Flowise):x-request-from: internal 请求头可绕过所有 JWT 身份验证中间件——任何携带该请求头的智能体 HTTP 调用都能在未经身份验证的情况下读取凭据、API 密钥和配置信息。

      不同于 rp-025(MCP JSON-RPC 协议 ID 碰撞)和 rp-027(跨会话内容渗漏)——本规则针对通过智能体 HTTP 工具利用的 HTTP 层级 BOLA/IDOR。v0.2.0:添加了 GHSA-gc8m-w37w-24hw 对应的 CVE 编号 CVE-2026-40252(已通过 cvefeed.io 和 Tenable 确认);新增了通用的 /api/v[12]/(users|datasets|workspaces|projects)/{uuid} 模式,用于捕获针对任意智能体平台资源端点的 IDOR(不仅限于 FastGPT/Flowise)。

      References: CVE-2026-40252, GHSA-gc8m-w37w-24hw, GHSA-cwc3-p92j-g7qm, CVE-2026-30823, CVE-2026-30820, CWE-639, RAXE-2026-033, OWASP API3:2023 -
      - https://github.com/labring/FastGPT/security/advisories/GHSA-gc8m-w37w-24hw,
      - https://cvefeed.io/vuln/detail/CVE-2026-40252,
      - https://github.com/FlowiseAI/Flowise/security/advisories/GHSA-cwc3-p92j-g7qm,
      - https://raxe.ai/labs/advisories/RAXE-2026-033,
      Example: tool_input to fetch tool includes url="https://app.flowise.com/api/v1/credentials" with header "x-request-from: internal" bypassing JWT auth to read all stored API keys
