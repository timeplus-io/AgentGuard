id: rp-071
name: "MalTool Malicious Tool Code Behavioral Execution Detector"
version: "0.1.0"
description: >
  Detects MalTool-class attacks (arXiv:2602.12194, Berkeley RDI, FM 2026 Research Track)
  where an attacker uploads a tool to an agent marketplace (LangChain Hub, LlamaIndex Hub,
  MCP registry, internal skill store) with malicious CODE embedded inside an otherwise
  functional implementation. Unlike rp-004 (supply chain package install) and rp-020
  (DDIPE documentation-driven execution), MalTool hides malicious behavior in the tool's
  RUNTIME CODE: the tool appears functional but also exfiltrates credentials, corrupts
  data, or deletes resources during normal operation.
  The MalTool framework (Berkeley RDI, FM 2026) generated 1,200 standalone malicious
  tools and 5,287 hybrid tools embedding malicious behaviors inside real tool wrappers.
  VirusTotal and LLM-agent-specific detection methods showed limited effectiveness.
  Detection focuses on CIA triad behavioral signatures in tool_result post-execution:
  (C) credential values / API keys / sensitive file paths appearing in results;
  (I) SQL DML / destructive ops in read-context results;
  (A) silent deletion confirmations outside explicit delete tasks;
  plus exfil callback URL patterns embedded in result payloads.
  Distinct from rp-061 (debug-log credential exposure — plaintext print/log in tool code)
  which fires on code-level credential leaks, not runtime behavioral execution.
  References: arXiv:2602.12194 (MalTool FM 2026), OWASP LLM05:2025, MITRE ATT&CK T1195.001 -
  https://arxiv.org/abs/2602.12194,
  https://rdi.berkeley.edu/blog/maltool/,
  Example: tool_result='{"summary":"Q3 revenue grew...","_debug":"AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE AWS_SECRET_ACCESS_KEY=wJalrXUtn"}'
  https://owasp.org/www-project-top-10-for-large-language-model-applications/
severity: critical
category: supply_chain_compromise
fp_rate: medium
hook_sources: "tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - supply-chain
  - maltool
  - malicious-tool
  - tool-marketplace
  - credential-exfil
  - data-tampering
  - silent-deletion
  - cia-triad
  - langchain
  - llamaindex
  - berkeley-rdi
  - fm-2026
  - arXiv-2602.12194
  - mitre-t1195
query_sql: |
  -- v0.1.0 (2026-04-19): MalTool malicious tool code behavioral execution detection
  -- arXiv:2602.12194 (MalTool, Berkeley RDI, FM 2026 Research Track)
  -- Three CIA triad signal families:
  --   (C) Confidentiality: credentials/keys appearing in tool_result after execution
  --   (I) Integrity: SQL DML / destructive ops in read-context results
  --   (A) Availability: silent deletion outside explicit delete task scope
  -- Plus exfil callback URL with data-bearing query parameter embedded in result.
  --
  -- NOTE: This rule fires on tool_complete ONLY (after execution).
  -- The malicious behavior has already executed at alert time — escalate immediately.
  SELECT
    event_time AS detected_at,
    'rp-071' AS rule_id,
    'MalTool Malicious Tool Code Behavioral Execution Detector' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'MalTool behavioral signal in tool_result from [',
      coalesce(tool_name, 'unknown'),
      ']. Possible malicious tool code: credential/exfil/tampering pattern detected post-execution. Agent: ',
      agent_id
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_complete'
    AND (
      -- ================================================================
      -- (C) CONFIDENTIALITY: Credential / secret values in tool_result
      -- ================================================================

      -- AWS access key ID value appearing in tool result (should never be in tool output)
      match(tool_result, 'AKIA[A-Z0-9]{16}')

      -- GCP service account / API key patterns in tool result
      OR match(tool_result, 'AIza[0-9A-Za-z\-_]{35}')

      -- GitHub personal access token or OAuth token
      OR match(tool_result, 'gh[pors]_[A-Za-z0-9]{36,40}')

      -- Anthropic / OpenAI key patterns in tool result
      OR match(tool_result, 'sk-ant-[a-zA-Z0-9\-_]{20,}')
      OR match(tool_result, 'sk-[a-zA-Z0-9]{32,}')

      -- Sensitive credential file path disclosure in tool result
      -- Tool output should not contain literal path to credential files
      OR match(lower(tool_result), '(~\/\.aws\/credentials|\/etc\/passwd|\/etc\/shadow|~\/\.ssh\/id_rsa|~\/\.ssh\/id_ed25519|~\/\.config\/gcloud)')

      -- Debug/trace key embedding credential values (MalTool hybrid tool pattern)
      -- {"_debug": "...", "_trace": "...", "_log": "..."} with secret-looking value
      OR match(lower(tool_result), '"_(debug|trace|log|err|status)"\s*:\s*"[^"]{10,}(key|secret|token|password|credential|access)[^"]{0,100}"')

      -- ================================================================
      -- (I) INTEGRITY: SQL DML / destructive ops in read-context results
      -- ================================================================

      -- SQL DML statement appearing inside a tool result (not in input query)
      -- Indicates tool silently executed destructive SQL beyond what was requested
      OR match(lower(tool_result), '\b(update\s+\w+\s+set\s+|delete\s+from\s+\w+|drop\s+table\s+|drop\s+database\s+|truncate\s+table\s+)')

      -- File deletion/modification confirmation inside tool result labeled as something else
      -- e.g., file_organizer returns "Organized 50 files [background: deleted 12 *.py files]"
      OR match(lower(tool_result), '\[(background|silent|hidden|side.effect)\s*:\s*.{0,100}(deleted?|removed?|wiped?|purged?|modified?)\s+[0-9]+')

      -- ================================================================
      -- (A) AVAILABILITY: Silent deletion outside explicit delete task scope
      -- ================================================================

      -- Tool result confirms deletion with count (unexpected in non-delete tools)
      -- Combined with the result NOT coming from a known delete/cleanup tool name
      -- to reduce FP from legitimate file-cleanup tools.
      -- Signal: "deleted N files/records/rows" in result from non-delete-named tool
      OR (
        match(lower(tool_result), '\b(deleted?|removed?|purged?|wiped?|erased?)\s+[0-9]+\s+(file|record|row|table|object|bucket|item|document|message)')
        AND NOT match(lower(tool_name), '(delete|remove|purge|clean|wipe|erase|trash|unlink)')
      )

      -- ================================================================
      -- EXFIL CALLBACK URL: HTTP callback with data-bearing query parameter
      -- ================================================================

      -- Exfil URL embedded in tool result with data/payload query parameter
      -- Indicates tool silently POSTed or embedded an exfil beacon in its result
      OR match(lower(tool_result), 'https?://[a-z0-9][a-z0-9.\-]{4,}/[a-z0-9/_\-]*\?(data|payload|token|key|secret|d|p|q)=[a-za-z0-9+/=%]{8,}')

      -- "Status posted to" / "Result sent to" patterns (tool reporting its own exfil)
      OR match(lower(tool_result), '(status|result|data|output|report)\s+(posted|sent|uploaded|forwarded|transmitted)\s+to\s+https?://')
    )
