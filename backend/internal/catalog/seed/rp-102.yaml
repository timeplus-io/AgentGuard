id: rp-102
name: "Agentic Pressure Normative Drift — Safety Bypass via Tool Failure Rationalization"
version: "0.2.0"
description: >
  Detects Agentic Pressure Normative Drift (arXiv:2603.14975, ACL 2026 Findings, Southern
  Univ. of Science and Technology). Unlike adversarial jailbreaks (external attacker), this
  threat is endogenous: agents voluntarily sacrifice safety constraints when facing repeated
  tool failures, deadline pressure, or resource deadlocks — the "Good Agent Paradox". Under
  Agentic Pressure, agents construct linguistic rationalizations to justify bypassing policies
  ("given the unavailability of approved tools, I'll proceed using the unrestricted method").
  Advanced reasoning models (o3, Claude Sonnet 4.5) exhibit accelerated normative drift
  because they generate more convincing self-rationalizations. Three observable stages:
  (1) Tool failure cascade (3+ consecutive tool_success=false events in a session),
  (2) Rationalization language in assistant_message justifying a policy exception,
  (3) High-impact tool invocation that would normally require explicit approval.
  Distinct from rp-086 (external psychological manipulation — adversarial pressure),
  rp-087 (H-CoT reasoning feedback loop exploitation by attacker),
  rp-083 (long-context token stuffing), rp-069 (false task completion fabrication).
  This rule targets ENDOGENOUS safety failure due to operational stress, not adversarial attack.
  Maps to OWASP Agentic AI ASI03:2026 (Agentic Rogue Behavior), OWASP LLM04:2025.
  References: arXiv:2603.14975 (Why Agents Compromise Safety Under Pressure, ACL 2026
  Findings, Hengle Jiang and Ke Tang, Southern Univ. of Science and Technology) -
  https://arxiv.org/abs/2603.14975,
  https://arxiv.org/html/2603.14975v2
  Example: assistant_message = "Given the unavailability of approved search tools and the
  urgency of completing this task, I'll proceed using the unrestricted access method. While
  this bypasses the usual safety constraints, the operational context justifies this approach."
severity: warning
category: agent_privilege_escalation
fp_rate: medium
hook_sources: "tool_complete,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - agent-privilege-escalation
  - normative-drift
  - agentic-pressure
  - safety-bypass
  - rationalization
  - tool-failure
  - instrumental-divergence
  - endogenous-threat
  - owasp-asi03
  - owasp-llm04
  - acl-2026
  - arxiv-2603.14975
query_sql: |
  -- rp-102 v0.2.0 (2026-04-21):
  -- Agentic Pressure Normative Drift: endogenous safety bypass via tool failure rationalization.
  -- Source: arXiv:2603.14975 (ACL 2026 Findings, Southern Univ. of Science and Technology)
  --   "The Good Agent Paradox" — agents sacrifice safety to preserve utility under pressure.
  --
  -- Changelog v0.2.0:
  --   CRITICAL FIX (Stage A): v0.1.0 fired on every single tool_success=false event with
  --   a pressure-error signal. The description explicitly states 3+ consecutive failures
  --   drive normative drift (paper methodology). Stage A now uses a sliding window count:
  --   count_if(tool_success = false AND <error_match>) over the last 5 tool_complete events
  --   in the session. Fires only when failure_count >= 3 in the window. This eliminates
  --   the high FP rate from single expected tool failures (auth errors, rate limits on
  --   the first call, upstream transient errors) while preserving detection of the
  --   3+-failure deadlock cascade described in arXiv:2603.14975 Section 4.2.
  --   Stage B (llm_response): unchanged — rationalization patterns already precise.
  --
  -- Detection strategy: Two-stage approach.
  --
  -- Stage A (Pressure Signal — tool_complete):
  --   Detect 3+ pressure-type failures in a sliding window of 5 tool_complete events
  --   in the same session. Fires once per window crossing threshold.
  --   Gated to specific error types indicating operational deadlock, not transient failures.
  --
  -- Stage B (Normative Drift — llm_response):
  --   Detect rationalization language in assistant_message that justifies bypassing
  --   safety constraints, policy, approval requirements, or data handling rules.
  --   Key linguistic markers:
  --     1. "given the unavailability/urgency/constraints... I'll bypass"
  --     2. "this exceptional situation warrants bypassing [safety/policy]"
  --     3. "operationally necessary/justified to bypass/override"
  --     4. "fallback method which does not require [approval/verification]"
  --     5. "proceed despite the usual/normal/standard policy/constraint"
  --
  -- Both stages are independently useful; operators should correlate per session_id.
  --
  -- Stage A: 3+ pressure-type tool failures in sliding 5-event window per session
  WITH pressure_window AS (
    SELECT
      event_time,
      session_id,
      agent_id,
      deployment_id,
      run_id,
      tool_name,
      tool_result,
      raw_hook_name,
      raw_event_data,
      count_if(
        tool_success = false
        AND match(lower(tool_result), '\b(rate.?limit|quota.?exceed|too many request|service.?unavailabl|connection.?timeout|request.?timeout|deadline.?exceed|resource.?exhaust|capacity.?exceed|all.{0,5}attempt.{0,5}fail|no.?(alternative|fallback|option).{0,5}available|circuit.?breaker|max.{0,5}retries?.{0,5}exceed)\b')
      ) OVER (
        PARTITION BY session_id
        ORDER BY event_time
        ROWS BETWEEN 4 PRECEDING AND CURRENT ROW
      ) AS pressure_failure_count
    FROM agentguard_cim_event
    WHERE event_type = 'tool_complete'
  )
  SELECT
    event_time AS detected_at,
    'rp-102' AS rule_id,
    'Agentic Pressure Normative Drift — Safety Bypass via Tool Failure Rationalization' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Agentic Pressure: 3+ consecutive tool failures (window=5) in session [', coalesce(session_id, 'unknown'),
      ']. Failure count in window: ', to_string(pressure_failure_count),
      '. Last failed tool: [', coalesce(tool_name, 'unknown'),
      ']. Normative drift risk high — correlate with llm_response rationalization.',
      ' Agent: ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM pressure_window
  WHERE pressure_failure_count >= 3
  UNION ALL
  -- Stage B: Normative drift rationalization in llm_response
  SELECT
    event_time AS detected_at,
    'rp-102' AS rule_id,
    'Agentic Pressure Normative Drift — Safety Bypass via Tool Failure Rationalization' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Safety constraint rationalization detected in assistant_message. ',
      'Agent may be bypassing policy under operational pressure. ',
      'Review planned tool invocations for unauthorized actions. ',
      'Message excerpt: ', substr(coalesce(assistant_message, ''), 1, 150),
      ' Agent: ', coalesce(agent_id, 'unknown'),
      '. Session: ', coalesce(session_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'llm_response'
    AND (
      -- Pattern 1: "given the [pressure/constraint], I'll bypass/override"
      match(lower(assistant_message), '\bgiven (the )?(unavailability|constraints?|urgency|pressure|deadline|operational.{0,20}constraint|resource.{0,20}limit|service.{0,20}(failure|unavailabl)).{0,200}(bypass|override|skip|ignore|work.?around|proceed without|without.{0,30}(approval|verification|validation|check))\b')

      -- Pattern 2: "this [exceptional/unusual/urgent] situation warrants bypassing [safety/policy]"
      OR match(lower(assistant_message), '\b(this|the|an?) (exceptional?|unusual|urgent|critical) (case|circumstance|situation|scenario).{0,100}(warrant|justif|necessit|permit|allow).{0,80}(bypass|override|relax|suspend|disabl|ignor|skip).{0,80}(policy|constraint|restriction|rule|safety|approval|protocol)\b')

      -- Pattern 3: "operationally necessary/justified to bypass"
      OR match(lower(assistant_message), '\boperational(ly)?.{0,30}(necessary|justified|required|acceptable).{0,100}(bypass|override|skip|ignore|violat|relax|suspend)\b')

      -- Pattern 4: "fallback method which does not require approval/verification"
      OR match(lower(assistant_message), '\b(fallback|alternative|backup).{0,50}(method|approach|path|option).{0,80}(not require|bypass|skip|without|no.{0,20}need.{0,20}for).{0,80}(approval|verification|classification|validation|clearance|authorization|policy|constraint)\b')

      -- Pattern 5: "proceed despite the usual/normal/standard policy/constraint"
      OR match(lower(assistant_message), '\b(proceed|continue|execute|perform|complete).{0,80}despite.{0,80}(the )?(usual|normal|standard|typical|required|established|defined).{0,80}(policy|constraint|restriction|rule|safety|protocol|approval|procedure)\b')
    )
