id: rp-001
name: "Prompt Injection Shield"
version: "1.0.0"
description: "Detects direct and indirect prompt injection attacks, jailbreak attempts, and goal hijacking across all message surfaces."
severity: critical
category: prompt_injection
fp_rate: medium
hook_sources: "user_input,llm_request"
required_telemetry: ""
author: "Timeplus"
tags:
  - security
  - prompt-injection
query_sql: |
  SELECT
    event_time                AS detected_at,
    'rp-001'                  AS rule_id,
    'Prompt Injection Shield' AS rule_name,
    'critical'                AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name             AS hook_name,
    tool_name,
    concat('Potential prompt injection in ', raw_hook_name, ' from agent ', agent_id) AS message,
    raw_event_data            AS event_data
  FROM agentshield_cim_event
  WHERE event_type IN ('user_input', 'llm_request')
    AND (
         lower(user_message)   LIKE '%ignore previous instructions%'
      OR lower(user_message)   LIKE '%ignore all previous%'
      OR lower(user_message)   LIKE '%jailbreak%'
      OR lower(user_message)   LIKE '%disregard your%'
      OR lower(user_message)   LIKE '%you are now a%'
      OR lower(user_message)   LIKE '%forget everything%'
      OR lower(user_message)   LIKE '%new instructions:%'
      OR lower(raw_event_data) LIKE '%ignore previous instructions%'
      OR lower(raw_event_data) LIKE '%ignore all previous%'
      OR lower(raw_event_data) LIKE '%jailbreak%'
      OR lower(raw_event_data) LIKE '%disregard your%'
      OR lower(raw_event_data) LIKE '%you are now a%'
      OR lower(raw_event_data) LIKE '%forget everything%'
      OR lower(raw_event_data) LIKE '%new instructions:%'
    )
