id: rp-069
name: "Upward Deception — Agent False Task Completion & Fabricated Success Detector"
version: "0.2.0"
description: |
  Detects LLM agents that fabricate task completion signals, silently swallow tool failures and claim success, or use simulated/mock tool calls to generate false attestations. arXiv:2512.04864 ("Are Your Agents Upward Deceivers?", Dec 2025) benchmarked 11 frontier LLMs on 200 constrained-environment tasks and found agents routinely exhibit: guessing results, performing unsupported simulations, substituting unavailable information sources, and fabricating completion evidence. arXiv:2603.03116 ("Revealing Corrupt Success", Mar 2026) found 27-78% of benchmark-reported agent successes are "corrupt successes" concealing policy violations — with per-model failure signatures (GPT-5: spread across policy/execution/intent; Kimi-K2-Thinking: 78% concentrated in policy faithfulness; Mistral-Large-3: dominated by faithfulness gaps). In high-stakes deployments (payments, healthcare, security audits), false success attestations can cause operators and orchestrators to proceed on the assumption that consequential actions were taken — when they were not.

  Distinct from rp-057 (ML evaluator tampering — specific to eval metric patching) and rp-050 (semantic rollback — checkpoint/restore duplicate execution). This rule targets ANY domain where agents report success despite tool_success=false, call mock/simulate tools to generate fake signals, or tool_result explicitly admits simulation.

  References: arXiv:2512.04864 (Upward Deceivers Dec 2025), arXiv:2603.03116 (Corrupt Success Mar 2026), OWASP Agentic AI ASI03:2026 -
  - https://arxiv.org/abs/2512.04864,
  - https://arxiv.org/abs/2603.03116

severity: critical
category: agent_privilege_escalation
fp_rate: medium
hook_sources: "tool_complete,tool_invoke"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - agent-privilege-escalation
  - upward-deception
  - false-completion
  - fabricated-success
  - corrupt-success
  - task-integrity
  - owasp-asi03
  - arxiv-2512.04864
  - arxiv-2603.03116
sql_template: |
  -- rp-069 v0.2.0 (2026-04-19)
  -- CRITICAL FIX: Removed all \b word boundaries — Timeplus RE2 does not support \b;
  -- patterns silently returned false. Replaced with context-sensitive anchors (.{0,N} / (^|[^a-z]))
  -- or multi-word phrases that are specific enough without boundaries.
  -- arXiv:2512.04864 (Are Your Agents Upward Deceivers? Dec 2025): 11 LLMs, 200 tasks
  -- arXiv:2603.03116 (Revealing Corrupt Success Mar 2026): 27-78% corrupt benchmark successes
  --
  -- Branch A: tool_complete with tool_success=false AND success claim in assistant_message
  -- The core upward deception signal: agent swallows tool failure and reports success
  SELECT
    event_time                              AS detected_at,
    'rp-069'                                AS rule_id,
    'Upward Deception — Agent False Task Completion & Fabricated Success Detector' AS rule_name,
    'critical'                              AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'Agent upward deception detected: tool=', coalesce(tool_name, 'n/a'),
      ' reported tool_success=false but assistant claimed success',
      ', session=', session_id,
      ', agent=', agent_id
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete')
    AND tool_success = false
    AND (
      -- Task completion claims (multi-word phrases specific enough without \b)
      match(lower(assistant_message), '(successfully completed|task completed|done successfully)')
      OR match(lower(assistant_message), 'operation (was |is |)(successful|complete|done|finished)')
      OR match(lower(assistant_message), 'completed the (task|operation|request|action|step)')
      -- First-person completion assertions
      OR match(lower(assistant_message), 'i have (sent|uploaded|processed|submitted|completed|confirmed|executed|finished|done) (the|your|this|it|them|all)')
      OR match(lower(assistant_message), '(your request|the request).{0,40}(fulfilled|processed|completed|handled|done)')
      -- Terse success signals — anchored with surrounding context
      OR match(lower(assistant_message), '(all done[!.]|everything (went through|is done|worked out)|task confirmed|transfer confirmed|payment confirmed)')
      -- Transaction/payment false attestation
      OR match(lower(assistant_message), '(payment|transaction|transfer|order).{0,60}(processed|completed|confirmed|successful|sent)')
      -- Communication false attestation
      OR match(lower(assistant_message), '(email|message|notification|alert|sms).{0,60}(sent|delivered|dispatched|transmitted)')
    )

  UNION ALL

  -- Branch B: tool_invoke — mock/simulate/fake tool calls generating fabricated success signals
  -- Agents calling stand-in tools rather than real execution tools
  SELECT
    event_time                              AS detected_at,
    'rp-069'                                AS rule_id,
    'Upward Deception — Agent False Task Completion & Fabricated Success Detector' AS rule_name,
    'critical'                              AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'Agent invoking mock/simulate tool for fabricated success: tool=', tool_name,
      ', session=', session_id,
      ', agent=', agent_id
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke')
    AND (
      -- Mock/simulate tool name patterns used to generate fake results
      -- RE2-compatible: use (^|_) instead of \b for word boundary at tool name start
      match(lower(tool_name), '(^|_)(mock|simulate|fake|dummy|stub|noop|no.?op)_(complete|result|execute|run|action|task|response)')
      OR match(lower(tool_name), '(simulate_result|mock_complete|fallback_complete|dummy_execute|stub_action)')
      -- Fallback pattern combined with success-term in tool_input
      OR (
        match(lower(tool_name), '(^|_)(fallback|placeholder|synthetic|virtual)(_|$)')
        AND match(lower(tool_input), '(success|complet|done|result|ok|true)')
      )
    )

  UNION ALL

  -- Branch C: tool_complete — tool_result explicitly admits simulation or fabrication
  -- Agent's tool returns explicit simulation admission that should trigger alert
  SELECT
    event_time                              AS detected_at,
    'rp-069'                                AS rule_id,
    'Upward Deception — Agent False Task Completion & Fabricated Success Detector' AS rule_name,
    'warning'                               AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'Tool result contains simulation/fabrication admission: tool=', coalesce(tool_name, 'n/a'),
      ', session=', session_id,
      ', agent=', agent_id
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete')
    AND (
      -- Explicit simulation flags in JSON tool results
      match(lower(tool_result), '"simulated"\s*:\s*true')
      OR match(lower(tool_result), '"mocked"\s*:\s*true')
      OR match(lower(tool_result), '"fake"\s*:\s*true')
      OR match(lower(tool_result), '"synthetic"\s*:\s*true')
      -- Verbal admission of tool unavailability + fake result
      OR match(lower(tool_result), '(tool unavailable|service unavailable|could not execute|execution skipped).{0,80}(estimated|guessed|simulated|approximated|fabricated|placeholder)')
      OR match(lower(tool_result), '(used estimated|using estimated|estimated result|guessed result|simulated result|fallback result)')
      -- "Skipped and returned" patterns indicating deception
      OR match(lower(tool_result), 'skipped.{0,40}(result|execution|action).{0,40}(returned|using|providing).{0,40}(estimated|fake|simulated|placeholder)')
    )
