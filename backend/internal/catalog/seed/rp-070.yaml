id: rp-070
name: "CIPL Channel-Inversion Privacy Leakage via Tool Retrieval Oracle Detector"
version: "0.1.0"
description: |
  Detects Channel-Inversion Privacy Leakage (CIPL) attacks where adversaries extract private information from LLM agent pipelines by observing tool invocation patterns — rather than directly reading memory stores. arXiv:2603.22751 (CIPL, Mar 2026) presents a unified measurement framework showing that tool-mediated leakage is strongly shaped by the "exposed observation surface": adversaries craft queries that cause agents to make retrieval calls whose parameters mirror private stored context, turning the tool invocation itself into an extraction oracle. Three attack surfaces: (1) Retrieval-mediated leakage — user query causes agent to call memory/vector-search tools with verbatim sensitive terms from stored context, leaking private data in tool_input; (2) Boolean oracle — yes/no queries cause observable presence/absence of retrieval calls revealing private record existence; (3) High-frequency enumeration — rapid succession of varied-topic retrieval calls maps private memory contents without direct read access.

  Distinct from rp-033 (ADAM/MEXTRA — direct memory dump extraction via explicit "dump all memory" directives) and rp-038 (ATE — tool schema/API recon). CIPL targets side-channel inference through retrieval call observable patterns, not bulk extraction commands or schema probing.

  References: arXiv:2603.22751 (CIPL Mar 2026), OWASP LLM02:2025, OWASP Agentic AI ASI05:2026 -
  - https://arxiv.org/abs/2603.22751,
  - https://arxiv.org/html/2603.22751v2

severity: warning
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "user_input,tool_invoke,tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - data-exfiltration
  - privacy-leakage
  - channel-inversion
  - side-channel
  - retrieval-oracle
  - memory
  - cipl
  - owasp-llm02
  - owasp-asi05
  - arxiv-2603.22751
sql_template: |
  -- rp-070: CIPL Channel-Inversion Privacy Leakage via Tool Retrieval Oracle Detector v0.1.0
  -- arXiv:2603.22751 (CIPL, Mar 2026): observable channel measurement framework
  -- Tool invocation patterns reveal private agent memory state as side-channel oracle.
  --
  -- Branch A: user_input — Targeted knowledge oracle queries triggering retrieval
  -- Attacker asks "do you have/know/store" + sensitive term → agent calls retrieval tool
  SELECT
    event_time                              AS detected_at,
    'rp-070'                                AS rule_id,
    'CIPL Channel-Inversion Privacy Leakage via Tool Retrieval Oracle Detector' AS rule_name,
    'warning'                               AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'CIPL oracle query detected in user_message: session=', session_id,
      ', agent=', agent_id,
      '. Adversarial knowledge-probing query for sensitive stored context.'
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('user_input')
    AND (
      -- Knowledge oracle: "do you have/know/remember/store" + sensitive category
      -- Compound: requires knowledge-probe verb AND sensitive category noun
      (
        match(lower(user_message), '\b(do you (have|know|remember|store|contain|recall)|what do you (have|know|remember|store)|any (notes|records|info) (about|on|for))\b')
        AND match(lower(user_message), '\b(password|credential|secret|api.?key|token|private.?key|ssn|social.?security|credit.?card|bank.?account|auth|certificate|private)\b')
      )
      -- "Tell me about X" probe for sensitive stored data
      OR (
        match(lower(user_message), '\btell me (everything|all|what) (you know|you have|you remember|is stored) (about|regarding|related to)\b')
        AND match(lower(user_message), '\b(password|credential|secret|key|token|account|user.?data|private|sensitive|confidential|pii|personal)\b')
      )
      -- "What's stored for [person/entity]" — cross-context probe
      OR match(lower(user_message), '\bwhat.{0,20}(stored|saved|remembered|recorded|in (memory|your records)).{0,60}(for|about|regarding).{0,60}(user|account|person|client|customer|patient)\b')
    )

  UNION ALL

  -- Branch B: tool_invoke — retrieval tool called with adversarially-injected sensitive terms
  -- Agent propagates attacker-controlled query into retrieval call, leaking stored context in tool_input
  SELECT
    event_time                              AS detected_at,
    'rp-070'                                AS rule_id,
    'CIPL Channel-Inversion Privacy Leakage via Tool Retrieval Oracle Detector' AS rule_name,
    'warning'                               AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'CIPL retrieval oracle: retrieval tool=', tool_name,
      ' called with sensitive credential-class terms in query param',
      ', session=', session_id,
      ', agent=', agent_id
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke')
    AND match(lower(tool_name), '\b(memory|recall|retrieve|vector.?search|embedding.?search|semantic.?search|similarity.?search|lookup|remember|knowledge.?search)\b')
    AND (
      -- Credential-class terms injected into retrieval query (attacker-controlled oracle)
      -- Compound: retrieval tool + credential/PII term in tool_input query parameter
      match(lower(tool_input), '"query"\s*:\s*"[^"]{0,200}(password|secret|api.?key|credential|private.?key|token|ssn|social.?security|credit.?card|bank.?account|auth)')
      OR match(lower(tool_input), '(password|passwd|secret|api.?key|credential|private.?key).{0,50}(or|and).{0,50}(token|credential|key|secret|auth)')
      -- Person-named targeted retrieval probing memory for specific user records
      OR (
        match(lower(tool_input), '"top_k"\s*:\s*([5-9][0-9]|[1-9][0-9]{2,})')
        AND match(lower(tool_input), '(password|secret|credential|key|token|auth|ssn|credit)')
      )
    )

  UNION ALL

  -- Branch C: tool_complete — retrieval tool result confirms existence of sensitive private context
  -- The confirmation itself is the leakage: attacker learns what the agent has stored
  SELECT
    event_time                              AS detected_at,
    'rp-070'                                AS rule_id,
    'CIPL Channel-Inversion Privacy Leakage via Tool Retrieval Oracle Detector' AS rule_name,
    'warning'                               AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'CIPL retrieval result contains sensitive private context: tool=', coalesce(tool_name, 'n/a'),
      ', session=', session_id,
      ', agent=', agent_id,
      '. Retrieved content includes credential-class data exposed to adversarial probe.'
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete')
    AND match(lower(tool_name), '\b(memory|recall|retrieve|vector.?search|embedding.?search|semantic.?search|lookup|remember|knowledge.?search)\b')
    AND tool_success = true
    AND (
      -- Retrieved result exposes credential/PII data to adversarial query
      match(lower(tool_result), '\b(password|secret|api.?key|private.?key|credential|ssn|social.?security|credit.?card)\b')
    )
    AND (
      -- Corroborate: the user query was an oracle probe (match knowledge-probe language in same session context)
      match(lower(user_message), '\b(do you (have|know|remember|store)|tell me (about|what)|what.{0,20}(stored|saved|remembered))\b')
    )
