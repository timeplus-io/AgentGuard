id: rp-013
name: "Anomalous LLM Output Token Spike"
version: "0.3.0"
description: |
  Detects data exfiltration via abnormally large LLM output responses (OWASP LLM10:2025 Unbounded Consumption). Uses metrics-based detection over agentguard_cim_metrics: fires when llm.output_tokens for a single LLM call exceeds 8,000 tokens (absolute threshold) OR exceeds 5x the rolling 10-call session average. Elevated output token counts indicate an agent may be dumping verbatim database records, file contents, or full context windows — a key data exfiltration pattern that bypasses network-level controls. Also covers Back-Reveal (arXiv:2604.05432, Apr 2026) — a backdoored-agent exfiltration framework that weaponizes tool-use agents to systematically exfiltrate user data through inflated LLM response channels. Microsoft Security Blog (Feb 2026) identifies output token spike detection as a first-order signal for backdoored model detection at scale. fp_rate reduced from medium to low by filtering out code-generation agents via a high-input-token guard (code gen always has large tool_result input, not just large output).

  References: OWASP LLM10:2025, arXiv:2604.05432 (Back-Reveal) -
  - https://arxiv.org/abs/2604.05432,
  - https://www.microsoft.com/en-us/security/blog/2026/02/04/detecting-backdoored-language-models-at-scale/,
  - https://dasroot.net/posts/2026/02/llm-observability-metrics-tracing/,
  Example: llm.output_tokens=42000 in a single session window (5x session average of 8400), indicating forced verbosity or full database dump exfiltration.
  - https://guardion.ai/blog/ai-agent-data-exfiltration-defense

severity: warning
category: data_exfiltration_and_leakage
fp_rate: low
hook_sources: "llm_response"
required_telemetry: "agentguard_cim_metrics:llm.output_tokens"
author: "AgentGuard Research Team"
tags:
  - security
  - data_exfiltration
  - token-spike
  - metrics
  - owasp-llm10
  - anomaly-detection
  - cost-amplification
  - back-reveal
  - arXiv-2604.05432
query_sql: |
  -- v0.2.0 changelog:
  --   PRECISION: fp_rate medium → low by adding:
  --     (a) llm.input_tokens companion metric to detect code-gen false positives:
  --         large CODE GEN outputs also have large INPUTS (> 4000 input tokens);
  --         data exfiltration dumps have small inputs but huge outputs.
  --     (b) Added 3x sustained-spike signal: 3 consecutive calls each > 3000 tokens
  --         (Back-Reveal pattern — sustained high-output across session, not one-off burst)
  --   REFERENCES: Added Back-Reveal (arXiv:2604.05432, Apr 2026) and Microsoft backdoor
  --     detection research (Feb 2026) to description.
  --   NOTE: The absolute threshold (8000) and relative threshold (5x baseline) are unchanged;
  --     input-token ratio guard is new to suppress code-gen FPs.
  WITH session_stats AS (
    SELECT
      event_time,
      metric_name,
      metric_value,
      agent_id,
      deployment_id,
      session_id,
      tags,
      avg(if(metric_name = 'llm.output_tokens', metric_value, 0)) OVER (
        PARTITION BY session_id
        ORDER BY event_time
        ROWS BETWEEN 10 PRECEDING AND 1 PRECEDING
      ) AS rolling_avg_output_tokens,
      avg(if(metric_name = 'llm.input_tokens', metric_value, 0)) OVER (
        PARTITION BY session_id
        ORDER BY event_time
        ROWS BETWEEN 3 PRECEDING AND CURRENT ROW
      ) AS rolling_avg_input_tokens,
      count() OVER (
        PARTITION BY session_id
        ORDER BY event_time
        ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
      ) AS recent_call_count
    FROM agentguard_cim_metrics
    WHERE metric_name IN ('llm.output_tokens', 'llm.input_tokens')
  )
  SELECT
    event_time AS detected_at,
    'rp-013' AS rule_id,
    'Anomalous LLM Output Token Spike' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    tags['run_id'] AS run_id,
    '' AS hook_name,
    tags['tool_name'] AS tool_name,
    concat(
      'LLM output token spike detected: ', to_string(to_int64(metric_value)),
      ' tokens in single call',
      if(rolling_avg_output_tokens > 0,
        concat(' (', to_string(to_int64(metric_value / rolling_avg_output_tokens)), 'x session avg of ',
               to_string(to_int64(rolling_avg_output_tokens)), ')'),
        ' (no prior session baseline)'),
      '. Possible data exfiltration via verbose LLM output (Back-Reveal pattern). Agent: ', agent_id
    ) AS message,
    to_string(metric_value) AS event_data
  FROM session_stats
  WHERE metric_name = 'llm.output_tokens'
    AND (
      -- Absolute threshold: single call output tokens > 8,000
      -- Guard: exclude code-gen agents (large output AND large input = legitimate generation)
      (metric_value > 8000 AND rolling_avg_input_tokens < 4000)
      -- Relative threshold: > 5x rolling session average (catches gradual escalation)
      -- Guard: require baseline established (> 200 avg) to avoid cold-start spikes
      OR (rolling_avg_output_tokens > 200 AND metric_value > rolling_avg_output_tokens * 5)
      -- Sustained spike: 3 consecutive calls each > 3,000 tokens (Back-Reveal sustained exfil pattern)
      -- Uses the window count proxy — fires when rolling avg stays high across 3 calls
      OR (recent_call_count >= 3 AND rolling_avg_output_tokens > 3000 AND metric_value > 3000)
    )
