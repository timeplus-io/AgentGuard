id: rp-004
name: "Supply Chain Watch"
version: "1.0.0"
description: "Monitors external model dependencies and third-party library calls for anomalous behavior."
severity: warning
category: supply_chain
fp_rate: high
hook_sources: "tool_invoke"
required_telemetry: ""
author: "Timeplus"
tags:
  - security
  - supply-chain
query_sql: |
  SELECT
    event_time           AS detected_at,
    'rp-004'             AS rule_id,
    'Supply Chain Watch' AS rule_name,
    'warning'            AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name        AS hook_name,
    tool_name,
    concat('Package install by agent ', agent_id, ' via ', if(tool_name != '', tool_name, raw_hook_name)) AS message,
    raw_event_data       AS event_data
  FROM agentshield_cim_event
  WHERE event_type = 'tool_invoke'
    AND (
         lower(concat(tool_input, ' ', raw_event_data)) LIKE '%npm install%'
      OR lower(concat(tool_input, ' ', raw_event_data)) LIKE '%pip install%'
      OR lower(concat(tool_input, ' ', raw_event_data)) LIKE '%yarn add%'
      OR lower(concat(tool_input, ' ', raw_event_data)) LIKE '%cargo install%'
      OR lower(concat(tool_input, ' ', raw_event_data)) LIKE '%apt-get install%'
      OR lower(concat(tool_input, ' ', raw_event_data)) LIKE '%brew install%'
    )
