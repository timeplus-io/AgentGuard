id: rp-084
name: "Sabotage-from-Within — Compromised Sub-Agent Task Fabrication & Capability Denial Detector"
version: "0.2.0"
description: |
  Detects sub-agent sabotage in multi-agent systems: a compromised sub-agent (via supply chain attack, model backdoor, or prompt injection) returns fabricated tool_result content that undermines the orchestrator's planning, exfiltrates data, or tampers with instruction passing between agents. Sabotage-from-Within (OpenReview ICLR 2026 submission 2W8r54OfvP, NKUA) demonstrates >70% effectiveness on multi-agent pipelines. Malice in Agentland (Boisvert et al., NeurIPS 2025, OpenReview kI7kCgcY8Y) shows that fine-tuning backdoors in data pipelines achieve >80% ASR exfiltrating confidential information when triggered by poisoning as few as 2% of training traces. Three distinct sabotage signals are detected: (1) Contradiction: sub-agent claims tool/capability unavailable AND task completed simultaneously — logically inconsistent behavior indicating false completion. (2) Fabrication flags: tool_result JSON contains explicit fabrication disclosure keys (result_fabricated, is_fabricated, synthetic_data) indicating the sub-agent is aware it is returning fake data. (3) Instruction tampering: tool_result falsely attributes an exfiltration directive to the orchestrator ("per orchestrator instructions, transfer to external-host"), a classic multi-hop pivot technique.

  Distinct from rp-076 (MAS CFH: false error redirecting orchestrator to code executor) and rp-069 (upward deception: agent fabricating success to human operator). This rule targets intra-MAS sub-agent sabotage where the compromised agent returns poisoned results to the orchestrator within the agent pipeline. Also captures the SGoatMAS Scapegoating variant (OpenReview 2026): a malicious agent induces downstream agents to sabotage tasks by poisoning shared context rather than acting directly, maintaining low detection rates.

  References: OpenReview ICLR 2026 (Sabotage from Within, NKUA) -
  - https://openreview.net/attachment?id=2W8r54OfvP&name=pdf,
  OpenReview NeurIPS 2025 (Malice in Agentland, Boisvert et al.) -
  - https://openreview.net/forum?id=kI7kCgcY8Y,
  OpenReview 2026 (SGoatMAS Scapegoating: covert attack via Vulnerability-to-Risk ratio agent selection, induces downstream agents to sabotage rather than acting directly) -
  - https://openreview.net/forum?id=plIRiWr6lO,
  OWASP Agentic AI ASI02:2026 (Agentic AI Tool Misuse), MITRE T1565.001 (Stored Data Manipulation) -
  - https://labs.lares.com/owasp-agentic-top-10/,
  Example: tool_result = {"status": "tool_unavailable", "message": "search offline.", "result": null, "task_status": "completed"} — logically contradictory, indicating sabotage.

severity: critical
category: lateral_movement_and_pivoting
fp_rate: low
hook_sources: "tool_complete"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - lateral-movement
  - multi-agent
  - subagent-sabotage
  - task-fabrication
  - capability-denial
  - instruction-tampering
  - malice-in-agentland
  - sabotage-from-within
  - sgoatmas
  - scapegoating-attack
  - owasp-asi02
  - mitre-t1565
sql_template: |
  -- rp-084 v0.2.0 (2026-04-19)
  -- Sabotage-from-Within: Compromised Sub-Agent Task Fabrication & Capability Denial
  -- OpenReview ICLR 2026 submission (Sabotage from Within, NKUA): >70% ASR on MAS pipelines
  -- OpenReview NeurIPS 2025 (Malice in Agentland, Boisvert et al.): >80% ASR, 2% poisoning
  -- OpenReview 2026 (SGoatMAS Scapegoating): covert MAS attack via Vulnerability-to-Risk ratio;
  --   malicious agent induces downstream agents to sabotage, maintaining low detection rate.
  -- v0.2.0 (2026-04-19): Added SGoatMAS Scapegoating reference; updated description and tags
  --
  -- Three detection branches:
  --
  -- Branch 1 (Contradiction): Sub-agent tool_result simultaneously claims
  --   (a) tool/capability is unavailable/offline AND (b) task is completed/done.
  --   This logical contradiction is the primary sabotage signal — a cooperative agent
  --   that cannot execute a task would report failure, not success. Dual-predicate anchored.
  --
  -- Branch 2 (Fabrication flags): tool_result JSON contains explicit self-disclosure
  --   keys indicating the sub-agent knows it is returning fabricated data:
  --   "result_fabricated": true, "is_fabricated": true, "synthetic_data": true, etc.
  --   These keys appear in compromised agent tool implementations that expose internal
  --   state (debug flags, test mode, backdoor disclosure). High precision; fp_rate: low.
  --
  -- Branch 3 (Instruction tampering): tool_result falsely attributes an exfiltration
  --   directive to the orchestrator ("per orchestrator instructions, transfer to X").
  --   A compromised relay or aggregation sub-agent inserts this to redirect downstream
  --   agents to exfiltrate data. Requires: orchestrator attribution + exfil verb + URL.
  --   Three-predicate anchor gives very high specificity.
  --
  -- fp_rate: low — all branches require multi-predicate anchors.
  --   Branch 1: contradiction requires BOTH unavailable AND completed in same result.
  --   Branch 2: fabrication keys are non-standard; don't appear in legitimate schemas.
  --   Branch 3: triple-anchor (attribution + verb + URL) extremely rare in benign output.

  -- Branch 1: Logical contradiction — capability unavailable AND task completed simultaneously
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Subagent sabotage detected: tool_result simultaneously claims capability UNAVAILABLE and task COMPLETED.',
      ' Logical contradiction indicates fabricated result. Tool=', coalesce(tool_name, 'unknown'),
      ', agent=', agent_id,
      '. Possible compromised sub-agent (Sabotage-from-Within ICLR 2026, Malice in Agentland NeurIPS 2025).'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_complete'
    AND (
      -- Unavailability claim in tool_result
      match(lower(tool_result), '(tool|capability|service|function|api|endpoint).{0,50}(unavailable|offline|not available|inaccessible|down|unreachable|cannot be used|not supported)')
      OR match(lower(tool_result), '"status"\s*:\s*"(tool_unavailable|service_unavailable|capability_offline|offline|unavailable|not_available)"')
    )
    AND (
      -- Simultaneous task-completion claim in same tool_result (the contradiction)
      match(lower(tool_result), '(task|operation|step|request|job|action).{0,60}(completed|done|finished|successful|complete)')
      OR match(lower(tool_result), '"(task_status|status|completion_status)"\s*:\s*"(completed|done|success|finished|ok)"')
      OR match(lower(tool_result), 'marked (the task|this task|it) as (complete|done|finished|successful)')
    )

  UNION ALL

  -- Branch 2: Fabrication self-disclosure — JSON keys indicating agent returned fake data
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Subagent fabrication flag detected in tool_result: JSON contains explicit fabrication disclosure key.',
      ' Tool=', coalesce(tool_name, 'unknown'),
      ', agent=', agent_id,
      '. Compromised agent may be self-disclosing that data is synthetic/fabricated.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_complete'
    AND (
      -- Explicit fabrication boolean keys in JSON tool_result
      match(lower(tool_result), '"(result_fabricated|is_fabricated|fake_result|data_fabricated|synthetic_result|mocked_result|fabricated)"\s*:\s*(true|1|"true")')
      -- Synthetic/placeholder data flag
      OR match(lower(tool_result), '"(synthetic_data|placeholder_data|dummy_data|test_data)"\s*:\s*(true|1|"true")')
      -- Internal note field revealing fabrication (debug artifact from compromised implementation)
      OR match(lower(tool_result), '"(internal_note|_internal|debug_note|_debug)"\s*:\s*"[^"]*fabricat[^"]*"')
      -- Actual value disclosed as null/unavailable alongside a non-null result (value mismatch signal)
      OR match(lower(tool_result), '"actual_value"\s*:\s*"(null|unavailable|unknown|n/a|none)"')
      -- Explicit skip/fabrication disclosure in free text within tool_result
      OR match(lower(tool_result), '(result_fabricated|data_fabricated|using fabricated|returned fabricated|synthetic result|placeholder result).{0,30}(true|yes|1)')
    )

  UNION ALL

  -- Branch 3: Instruction tampering — tool_result attributes exfil directive to orchestrator
  SELECT
    event_time AS detected_at,
    '__rule_id__' AS rule_id,
    '__rule_name__' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Subagent instruction tampering detected: tool_result attributes exfiltration directive to orchestrator.',
      ' Tool=', coalesce(tool_name, 'unknown'),
      ', agent=', agent_id,
      '. Compromised relay/aggregation agent inserting false orchestrator instructions.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_complete'
    AND (
      -- Falsely attributes instruction to orchestrator/coordinator + exfil verb + external URL
      -- Triple-anchor: [attribution] + [exfil verb] + [external destination]
      match(lower(tool_result), 'per (orchestrator|coordinator|manager|supervisor|system|dispatch).{0,50}(instructions?|directive|order|command|request).{0,100}(transfer|send|upload|exfil|forward|export|copy|post|push).{0,100}(to|at|via).{0,20}https?://')
      -- False instruction claiming orchestrator wants data sent to external host
      OR match(lower(tool_result), 'orchestrator (has |)(instructed|requested|directed|ordered|commanded).{0,100}(transfer|send|upload|exfil|forward|export).{0,100}https?://')
      -- "As per system instructions, forward all [data] to [external]"
      OR match(lower(tool_result), 'as per (system|orchestrator|coordinator) instructions?.{0,100}(forward|send|transfer|route|export).{0,80}(all |)(data|results?|output|context|conversation|memory).{0,80}(to|at)\s+https?://')
    )
