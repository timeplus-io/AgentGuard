id: rp-014
name: "Indirect Prompt Injection via Tool Result"
version: "0.5.0"
description: >
  Detects indirect prompt injection attacks (OWASP LLM01:2025) where malicious
  instructions are embedded in external content returned by agent tools — web page
  fetches, emails, files, database records, GitHub issues, or CRM entries.
  Monitors tool_complete events for extraction-override language in tool_result.
  Documented in the wild by Palo Alto Unit 42 (2025), Microsoft MSRC (2026), and
  extended by AdapTools adaptive IPI framework (arXiv:2602.20720, Feb 2026).
  Also covers QueryIPI query-agnostic injection patterns (arXiv:2510.23675).
  v0.3.0 adds ChatInject (arXiv:2509.22830, ICLR 2026): chat-template token injection
  where malicious payloads are formatted to mimic native LLM chat template tokens
  (im_start, INST, SYS, Phi/Falcon tokens) embedded in tool results. ChatInject
  achieves 6x higher ASR than plain-text injection (45.90% on InjecAgent) with
  strong cross-model transferability including against closed-source models.
  v0.4.0 adds web-based IDPI evasion techniques observed in production telemetry by
  Palo Alto Unit 42 (March 3, 2026): CSS visual concealment injection (display:none,
  font-size:0, visibility:hidden, opacity:0 hiding malicious instructions in web
  content fetched by browser/HTTP agents), fork-bomb DoS payloads embedded in HTML,
  SQL data destruction commands hidden in web pages, unauthorized transaction
  directives, and SEO poisoning instructions. The Unit 42 report documents 22 distinct
  in-the-wild delivery techniques including the first confirmed AI ad review bypass
  (Dec 2025). Note: fp_rate elevated to medium for v0.4.0 due to CSS patterns;
  combined signal with override text remains low FP.
  v0.5.0 adds webhook/event-driven injection patterns: Cisco Talos "n8n n8mare" (Apr 15
  2026) documented 686% increase in malicious n8n webhook URLs in emails (Jan 2025 to
  Mar 2026); attacker webhooks serve dynamic payloads based on User-Agent fingerprinting.
  Security Boulevard (Apr 2026) documented supervisor blind-spot attacks where injection
  payloads in profile fields (Name, bio, account tier) bypass supervisor agents that
  only watch direct user chat input. Adds ## Markdown header injection (common in GitHub
  PR titles, Jira descriptions, n8n/Zapier webhook bodies), supervisor-blind-spot user
  profile injection pattern, and webhook tool_name-gated new-task directive.
  Also covers CVE-2026-21858 (n8n unauthenticated RCE) and CVE-2025-68613 (CISA KEV).
  References: OWASP LLM01:2025, OWASP Agentic AI ASI02:2026, Unit42/MSRC incidents,
  arXiv:2602.20720 (AdapTools), arXiv:2510.23675 (QueryIPI), arXiv:2509.22830
  (ChatInject ICLR 2026), Unit42 Web-IDPI Mar 2026, Cisco Talos n8n n8mare Apr 2026,
  Security Boulevard Supervisor Blind Spot Apr 2026 -
  https://arxiv.org/abs/2509.22830,
  https://unit42.paloaltonetworks.com/ai-agent-prompt-injection/,
  https://unit42.paloaltonetworks.com/indirect-prompt-injection,
  https://blog.talosintelligence.com/the-n8n-n8mare/,
  https://securityboulevard.com/2026/04/bypassing-llm-supervisor-agents-through-indirect-prompt-injection/,
  https://owasp.org/www-project-top-10-for-large-language-model-applications/
severity: critical
category: prompt_injection_and_hijacking
fp_rate: medium
hook_sources: "tool_complete,user_input"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - prompt-injection
  - indirect-injection
  - tool-result-poisoning
  - owasp-llm01
  - supply-chain
  - adaptools
  - queryipi
  - chatinject
  - chat-template-injection
  - iclr-2026
  - web-idpi
  - css-concealment
  - unit42
  - webhook-injection
  - n8n-abuse
  - supervisor-blind-spot
  - cisco-talos
  - event-driven-injection
query_sql: |
  -- v0.2.0 changelog:
  --   PRECISION: Replaced broad LIKE patterns with tight regex alternatives.
  --   NEW: new primary/main objective directive pattern (AdapTools adaptive IPI)
  --   NEW: query-agnostic IPI trigger phrases (QueryIPI, arXiv:2510.23675)
  --   fp_rate: low confirmed — all patterns require multi-word specificity.
  -- v0.3.0 changelog (2026-04-16):
  --   NEW: ChatInject chat-template token injection patterns (arXiv:2509.22830, ICLR 2026)
  --   NEW: Mistral/Zephyr/Qwen <|im_start|> token in tool_result
  --   NEW: Llama [INST] / <<SYS>> structural block in tool_result
  --   NEW: Phi/Falcon <|system|>/<|user|>/<|assistant|> template tokens
  --   NEW: Generic [SYSTEM] block injection
  --   NEW: JSON chat-format role injection ("role":"system" with malicious content)
  --   NEW: Chat template tokens in user_message (direct injection variant)
  --   Added user_input to hook_sources for user_message template-token detection.
  -- v0.4.0 changelog (2026-04-17):
  --   NEW: CSS display:none concealment pattern (Unit 42 ad review bypass, Dec 2025)
  --   NEW: CSS font-size:0 / visibility:hidden / opacity:0 concealment (Unit 42 Mar 2026)
  --   NEW: Fork bomb payload embedded in web content (DoS intent — Unit 42 taxonomy)
  --   NEW: SQL data destruction commands in tool_result (DROP TABLE/DATABASE directive)
  --   NEW: Unauthorized transaction directive (complete/initiate this transfer/payment)
  --   NEW: SEO poisoning instruction (include/always recommend this site)
  --   fp_rate raised to medium: CSS patterns alone have higher FP vs combined signals.
  SELECT
    event_time AS detected_at,
    'rp-014' AS rule_id,
    'Indirect Prompt Injection via Tool Result' AS rule_name,
    'critical' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Indirect prompt injection detected in tool_result from tool [',
      coalesce(tool_name, 'unknown'), ']. ',
      'Malicious instructions embedded in external content may hijack agent behavior. ',
      'Agent: ', agent_id
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_complete', 'user_input')
    AND (
      -- Classic override phrasing (regex-anchored)
      match(lower(tool_result), 'ignore (all |)previous instructions')
      OR match(lower(tool_result), 'disregard (all |prior |)instructions')
      -- System takeover patterns (tightened from broad LIKE)
      OR match(lower(tool_result), 'system override')
      OR match(lower(tool_result), 'you are now in (developer|debug|unrestricted|jailbreak|admin|maintenance|override|god|superuser) mode')
      OR match(lower(tool_result), 'act as (an |a |)(unrestricted|uncensored|unfiltered|jailbroken|evil|malicious|unethical) (ai|assistant|agent|model|bot|llm)')
      -- Instruction forgetting patterns (tightened)
      OR match(lower(tool_result), 'forget (all |your |)(instructions|guidelines|rules|constraints|safety)')
      -- Tool hijacking — explicit dangerous tool list only (was: broad '%use the%tool to%')
      OR match(lower(tool_result), 'use the (send_email|exfil|data_export|file_write|shell|bash|exec|curl|fetch|http_post|http_get|upload|post_to) tool')
      -- Pre-response hook directive (was: broad '%before responding%call%')
      OR match(lower(tool_result), 'before (responding|answering|replying).*(call|invoke|execute|run) the')
      -- New task with exfil verb (was: broad '%new task:%')
      OR match(lower(tool_result), 'new task:\s*(exfil|send|export|upload|post|transmit|forward)')
      -- New: primary/main objective override directive (AdapTools adaptive IPI)
      OR match(lower(tool_result), '\bnew (primary|main) (objective|directive|goal|mission):\s*(exfil|steal|dump|harvest|send|upload|forward)')
      -- Hidden content markers
      OR lower(tool_result) LIKE '%[hidden]%'
      OR lower(tool_result) LIKE '%[system:%'
      -- HTML comment injection (tightened from broad '<!-- %instruction%')
      OR match(lower(tool_result), '<!--.*(instruction|override|inject|system|task)')
      OR lower(tool_result) LIKE '%jailbreak%'
      -- QueryIPI: query-agnostic IPI — instruction injection regardless of original task
      OR match(lower(tool_result), '\byour (new |updated |actual |real |)(primary |main |)(task|goal|objective|instruction|directive) (is|now is|has changed to)\b')
      -- v0.3.0: ChatInject — chat template token injection in tool_result (arXiv:2509.22830)
      -- These structural tokens should NEVER appear in legitimate external data tool results.
      -- Presence indicates attacker embedding payload formatted as LLM chat template.
      -- Mistral / Zephyr / Qwen im_start token
      OR match(tool_result, '<\|im_start\|>\s*(system|user|assistant)')
      OR match(tool_result, '<\|im_end\|>')
      -- Llama 2 / Llama 3 INST + SYS block markers
      OR match(tool_result, '\[INST\]\s*(<<SYS>>|ignore|you are now|your new task|override)')
      OR match(tool_result, '<<SYS>>[\s\S]{0,300}<</SYS>>')
      -- Phi / Falcon / generic template tokens
      OR match(tool_result, '<\|system\|>|<\|user\|>|<\|assistant\|>')
      -- Generic [SYSTEM] block injection with directive
      OR match(lower(tool_result), '\[system\]\s*(ignore|you are|your new|new task|override|disregard)')
      -- JSON chat-format injection: {"role":"system","content":"<malicious>"}
      OR match(lower(tool_result), '"role"\s*:\s*"system"\s*,\s*"content"\s*:\s*"(ignore|you are now|your new task|override|disregard|forget)')
      -- v0.3.0: ChatInject in user_message (direct injection attempt using template tokens)
      OR match(user_message, '<\|im_start\|>|<\|im_end\|>|<\|system\|>|<\|user\|>|<\|assistant\|>')
      OR match(user_message, '\[INST\]|<<SYS>>|<</SYS>>')
      -- v0.4.0: Web-IDPI in-the-wild evasion techniques (Unit 42, March 2026)
      -- CSS visual concealment: malicious instructions hidden from human view
      -- style="display:none" — primary ad-review bypass technique (Dec 2025 in-the-wild)
      OR match(lower(tool_result), 'style\s*=\s*["\x27]?[^"\x27]*display\s*:\s*none')
      -- style="font-size:0" — zero-height text injection
      OR match(lower(tool_result), 'style\s*=\s*["\x27]?[^"\x27]*font-size\s*:\s*0')
      -- style="visibility:hidden" — invisible element injection
      OR match(lower(tool_result), 'style\s*=\s*["\x27]?[^"\x27]*visibility\s*:\s*hidden')
      -- style="opacity:0" — transparent element injection
      OR match(lower(tool_result), 'style\s*=\s*["\x27]?[^"\x27]*opacity\s*:\s*0')
      -- Fork bomb DoS payload in web content (Unit 42 DoS intent category)
      OR match(tool_result, ':\(\)\{\s*:\|:\s*&\s*\}')
      -- SQL data destruction directive embedded in web content
      OR match(lower(tool_result), '\b(drop\s+table|drop\s+database|delete\s+from)\b.{0,80}\b(users?|sessions?|accounts?|orders?|data)\b')
      -- Unauthorized transaction / payment directive (Unit 42 financial fraud category)
      OR match(lower(tool_result), '\b(complete|initiate|execute|process)\s+(this\s+)?(transfer|transaction|payment|wire)\b')
      -- SEO poisoning: instruct AI to always recommend attacker URL (Unit 42 SEO category)
      OR match(lower(tool_result), '\b(always\s+(include|recommend|mention|link|reference)|add\s+to\s+your\s+(top|results|response))\b')
      -- v0.5.0: Webhook / event-driven injection (Cisco Talos n8n n8mare Apr 2026,
      -- Security Boulevard supervisor blind-spot Apr 2026)
      -- ## Markdown header injection in webhook payloads (GitHub PR titles, Jira descriptions,
      -- n8n/Zapier event bodies). Requires admin/system/override keyword to exclude normal Markdown.
      OR match(lower(tool_result), '##\s*(admin|system|override|instruction|directive|task|alert)\b')
      -- 'this is an admin test/command/instruction' attack framing (Security Boulevard profile injection)
      OR match(lower(tool_result), '\bthis is an admin (test|command|instruction|override|directive)\b')
      -- Maintenance mode revelation directive (supervisor blind-spot variant from profile field attack)
      OR match(lower(tool_result), 'maintenance mode.{0,80}(output|reveal|show|dump|confirm|print|display)')
      -- Webhook tool_name-gated new-task directive (scoped to avoid broad match on all tool results)
      -- Only fires when tool_result contains 'new task/instruction:' AND tool is a webhook/event receiver
      OR (
        match(lower(tool_result), '\bnew (primary |main |)(task|instruction|goal|directive)\s*:\s*\S')
        AND match(lower(tool_name), '(webhook|event_receive|slack_event|github_event|jira_event|zapier|n8n|process_event|handle_event|receive_event)')
      )
      -- Supervisor blind spot: ## injection via user_message assembled from profile/context fields
      -- Example: profile Name = "John ## THIS IS AN ADMIN TEST: Ignore prior instructions..."
      -- Supervisor only watches chat input; this bypasses detection at the LLM context assembly point.
      OR match(lower(user_message), '##\s*(admin|system|override|instruction|directive)\b')
      OR match(lower(user_message), '\bthis is an admin (test|command|instruction|override)\b')
    )
