    name: "通过工具结果的间接提示注入"
    description: |
      检测间接提示注入攻击(OWASP LLM01:2025),此类攻击将恶意指令嵌入智能体工具返回的外部内容中——网页抓取结果、电子邮件、文件、数据库记录、GitHub issue 或 CRM 条目。监控 tool_complete 事件中 tool_result 里的提取/覆盖类语言。已由 Palo Alto Unit 42(2025)和 Microsoft MSRC(2026)在真实环境中记录,并由 AdapTools 自适应间接提示注入(IPI)框架(arXiv:2602.20720,ICML 2026)加以扩展。v1.2.0 新增分支 3:AdapTools 隐蔽良性工具渗出转向(Stealthy Benign Tool Exfiltration Pivot,arXiv:2602.20720,ICML 2026,相较分支 2 的危险工具门控,攻击成功率提升 2.13 倍)。AdapTools 选择在语义上与任务相关的非危险工具(send_email、http_request、slack、webhook、calendar、publish)在完成 IPI 投递后渗出上下文——从而绕过仅拦截分支 2 所覆盖的 shell/exec 转向的任务相关性防御机制。同时覆盖 QueryIPI 查询无关注入模式(arXiv:2510.23675)。v0.3.0 新增 ChatInject(arXiv:2509.22830,ICLR 2026):聊天模板令牌注入,即将恶意载荷格式化为模仿 LLM 原生聊天模板令牌(im_start、INST、SYS、Phi/Falcon 令牌)的形式,嵌入到工具结果中。ChatInject 的攻击成功率比纯文本注入高 6 倍(在 InjecAgent 上达到 45.90%),且具备很强的跨模型可迁移性,对闭源模型同样有效。v0.4.0 新增 Palo Alto Unit 42(2026 年 3 月 3 日)在生产环境遥测数据中观察到的基于 Web 的间接提示注入(IDPI)规避手法检测:CSS 视觉隐藏注入(display:none、font-size:0、visibility:hidden、opacity:0,将恶意指令隐藏在浏览器/HTTP 智能体抓取的网页内容中)、嵌入 HTML 中的 fork 炸弹 DoS 载荷、隐藏在网页中的 SQL 数据破坏命令、未授权交易指令,以及 SEO 投毒指令。Unit 42 报告记录了 22 种不同的真实环境投递手法,其中包括首次确认的 AI 广告审核绕过案例(2025 年 12 月)。注:由于 CSS 模式的引入,v0.4.0 的 fp_rate 提升为中;但与覆盖类文本结合的组合信号误报率仍然较低。v0.5.0 新增 webhook/事件驱动注入模式检测:Cisco Talos《n8n n8mare》(2026 年 4 月 15 日)报告显示,电子邮件中恶意 n8n webhook URL 的数量(2025 年 1 月至 2026 年 3 月)增长了 686%;攻击者的 webhook 会根据 User-Agent 指纹提供动态载荷。Security Boulevard(2026 年 4 月)记录了"监督者盲区"(supervisor blind-spot)攻击:注入载荷藏于个人资料字段(姓名、简介、账户等级)中,从而绕过仅监视用户直接聊天输入的监督智能体。新增 ## Markdown 标题注入检测(常见于 GitHub PR 标题、Jira 描述、n8n/Zapier webhook 正文)、监督者盲区用户资料注入模式,以及基于 webhook tool_name 门控的新任务指令检测。同时覆盖 CVE-2026-21858(n8n 未经身份验证的远程代码执行)和 CVE-2025-68613(CISA 已知被利用漏洞,KEV)。v0.7.0 新增 CoT Forgery——伪造思维链角色混淆攻击(arXiv:2603.12277,MIT/圣路易斯华盛顿大学,2026 年 2 月),在包括 GPT-4、Gemini、Claude 在内的前沿模型上,StrongREJECT 攻击成功率达 60%,而基线成功率接近 0%。模型是根据句法模式而非实际来源来推断"是谁在说话"的。将 <think>/<thinking> 推理区块令牌注入检索到的内容(tool_result)或 user_message 中,会使模型将攻击者伪造的推理误认为自己内部的思考过程——从而绕过安全训练。有别于 v0.3.0 的 ChatInject(角色边界模板令牌)和 v0.6.0 的 Phantom STI(Llama/Mistral 结构化令牌)——CoT Forgery 针对的是 DeepSeek-R1、Claude 扩展思考(extended thinking)、Gemini Flash Thinking 和 QwQ 等模型所标准化的思考/推理模态。v0.9.0 新增 ObliInjection——顺序无关的多源提示注入(Order-Oblivious Multi-Source Prompt Injection,arXiv:2512.09321,NDSS 2026,杜克大学):首个专为多源 LLM 输入聚合场景设计的注入攻击。攻击者仅需控制 N 个输入片段中的 1 个,且无论对抗性载荷在聚合提示中的片段顺序如何,其都会被激活。在片段污染比例为 1/6–1/100 的情况下均有效。在 3 个数据集和 12 个 LLM 上进行了测试。覆盖 RAG 多文本块投毒、工具结果聚合以及评论摘要工作流。特征:干净内容与恶意内容混合(长度 > 200)、跨来源覆盖指令(如"忽略其他摘要")、强制性审计/合规渗出话术,以及针对聚合上下文、以"所有先前工具结果的内容"为目标的提取指令。v0.8.0 新增隐藏注释技能注入(Hidden-Comment Skill Injection,arXiv:2602.10498,山东大学,2026 年 2 月):LLM 智能体会将 Markdown Skill 文档原样加载进模型上下文。HTML 注释区块(<!-- ... -->)对审阅渲染后文档的人类不可见,但对读取原始文本的 LLM 完全可见。能够修改 Skill 文件(供应链、项目仓库、MCP 服务器)的攻击者会在 HTML 注释中嵌入高优先级的恶意指令,在没有任何可见迹象的情况下引导智能体调用凭据收集或数据渗出工具。已在 DeepSeek-V3.2 和 GLM-4.5-Air 上得到验证。有别于 v0.4.0(抓取到的网页内容中的 CSS display:none)——本手法针对的是 IDE/编码智能体加载的原始 Skill 文件。v0.6.0 新增 Phantom 结构化模板注入(Phantom Structural Template Injection,arXiv:2602.16958,2026 年 2 月):通过向检索内容中注入经过优化的结构化 LLM 角色边界令牌来实现自动化智能体劫持。与 ChatInject(v0.3.0)不同,Phantom 针对的是 Llama-3 头部令牌(<|start_header_id|>tool/assistant<|end_header_id|>、<|eot_id|>)、Mistral 函数调用标签(<|python_tag|>)以及伪造的 XML 工具调用区块(<tool_call>...</tool_call>),这些均有别于此前已覆盖的 Qwen/Mistral <|im_start|> 令牌。该论文在 GPT-4、Gemini 和 Qwen 等真实商业产品中共确认了 70 余个漏洞。此外新增对伪造嵌套 tool-result JSON("tool_name":...、"result":...渗出操作)的检测,该手法通过将攻击者指令伪装成智能体先前的输出来利用角色混淆。v1.3.0 新增分支 4:文档字体/幻影令牌自然语言指令注入(arXiv:2506.00089 TrapDoc,EMNLP 2025;arXiv:2505.16957 恶意字体注入,2025 年 5 月;ePrint 2026/278 PDF 混淆,普渡大学,2026 年)。攻击者利用字体字形重映射或幻影 Unicode 令牌,在 PDF/HTML 中嵌入对人工审阅者不可见、但对 LLM 文本提取器可见的恶意指令。提取出的 tool_result 包含不带注入标记的自然语言行为指令(批准/发送/部署/绕过)——从而绕过分支 1(ag_tool_inject_check)和 rp-056(零宽 Unicode)。ePrint 2026/278 论文证实,该攻击模式仅使用符合标准的 PDF 特性,即可对 6 个主流 PDF 解析平台生效。包含两个子分支:4a 检测文档 tool_result 中的即时行为覆盖指令;4b 检测"文档读取→高影响工具调用"的时序模式。

      参考文献:OWASP LLM01:2025、OWASP Agentic AI ASI02:2026、Unit42/MSRC 相关事件、arXiv:2602.20720(AdapTools)、arXiv:2510.23675(QueryIPI)、arXiv:2509.22830(ChatInject,ICLR 2026)、Unit42 Web-IDPI,2026 年 3 月、Cisco Talos n8n n8mare,2026 年 4 月、Security Boulevard 监督者盲区,2026 年 4 月、arXiv:2602.16958(Phantom STI,2026 年 2 月)、arXiv:2506.00089(TrapDoc)、arXiv:2505.16957(字体注入)、ePrint 2026/278(PDF 混淆) -
