id: dsa-a03
name: "[A03] Sensitive Information in Model Output"
version: "1.0.0"
description: |
  Detects personal information, customer information, account data,
  authentication information, and business-sensitive data in model replies.
  Treated as highest-risk when the output does not originate from the current
  user's own session. (Customer audit rule A03.)
severity: critical
category: sensitive_data_exposure
fp_rate: medium
hook_sources: "llm_response"
required_telemetry: ""
author: "Timeplus"
tags:
  - data-security
  - customer-baseline
  - audit-a03
  - pii
sql_template: |
  SELECT
    event_time                AS detected_at,
    '__rule_id__'             AS rule_id,
    '__rule_name__'           AS rule_name,
    'critical'                AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name             AS hook_name,
    tool_name,
    concat('Sensitive data in model output from agent ', agent_id) AS message,
    raw_event_data            AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'llm_response'
    AND (
         match(assistant_message, 'sk-ant-[A-Za-z0-9_-]{16,}')
      OR match(assistant_message, 'sk-[A-Za-z0-9]{32,}')
      OR match(assistant_message, 'AKIA[0-9A-Z]{16}')
      OR match(assistant_message, 'AIza[0-9A-Za-z_-]{35}')
      OR match(assistant_message, 'gh[pousr]_[A-Za-z0-9]{30,}')
      OR match(assistant_message, 'xox[baprs]-[A-Za-z0-9-]{10,}')
      OR match(assistant_message, 'eyJ[A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]{5,}')
      OR match(assistant_message, '-----BEGIN [A-Z ]*PRIVATE KEY-----')
      OR match(lower(assistant_message), '(api|secret|access|private)[_-]?key[[:space:]]*[=:][[:space:]]*[a-z0-9_+/.-]{12,}')
      OR match(lower(assistant_message), '(password|passwd|pwd|token|bearer)[[:space:]]*[=:][[:space:]]*[^[:space:]]{8,}')
      OR match(lower(assistant_message), '(密码|口令|密钥|令牌)[：:＝=][^[:space:]]{6,}')
      OR match(assistant_message, '[1-9][0-9]{5}(19|20)[0-9]{2}[01][0-9][0-3][0-9][0-9]{3}[0-9Xx]')
      OR match(assistant_message, '[0-9]{3}-[0-9]{2}-[0-9]{4}')
      OR match(assistant_message, '[0-9]{4}[ -][0-9]{4}[ -][0-9]{4}[ -][0-9]{1,7}')
      OR match(assistant_message, '(^|[^0-9])1[3-9][0-9]{9}([^0-9]|$)')
    )
translations:
  zh-CN:
    name: "模型输出敏感信息"
    description: |
      检测回复中的个人信息、客户信息、账户数据、认证信息及业务敏感数据。输出并非来自当前用户本次会话时按最高风险处置。
