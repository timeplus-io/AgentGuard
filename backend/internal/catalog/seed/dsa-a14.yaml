id: dsa-a14
name: "[A14] Sensitive Data to External Tool"
version: "1.0.0"
description: |
  Flags third-party or internet-facing tool calls (HTTP, webhook, upload,
  email, object-store) whose parameters carry sensitive data without a
  recorded allowed data-type / field scope. (Customer audit rule A14.)
severity: critical
category: data_exfiltration_and_leakage
fp_rate: medium
hook_sources: "tool_invoke"
required_telemetry: ""
author: "Timeplus"
tags:
  - data-security
  - customer-baseline
  - audit-a14
sql_template: |
  SELECT
    event_time                AS detected_at,
    '__rule_id__'             AS rule_id,
    '__rule_name__'           AS rule_name,
    'critical'                AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name             AS hook_name,
    tool_name,
    concat('Sensitive data sent to external tool ', tool_name) AS message,
    raw_event_data            AS event_data
  FROM agentguard_cim_event
  WHERE event_type = 'tool_invoke'
    AND multi_search_any(lower(tool_name), ['http', 'fetch', 'curl', 'webhook', 'upload', 'post', 'send', 'email', 'slack', 's3', 'url', 'request'])
    AND (
         match(tool_input, 'sk-ant-[A-Za-z0-9_-]{16,}')
      OR match(tool_input, 'sk-[A-Za-z0-9]{32,}')
      OR match(tool_input, 'AKIA[0-9A-Z]{16}')
      OR match(tool_input, 'AIza[0-9A-Za-z_-]{35}')
      OR match(tool_input, 'gh[pousr]_[A-Za-z0-9]{30,}')
      OR match(tool_input, 'xox[baprs]-[A-Za-z0-9-]{10,}')
      OR match(tool_input, 'eyJ[A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]{5,}')
      OR match(tool_input, '-----BEGIN [A-Z ]*PRIVATE KEY-----')
      OR match(lower(tool_input), '(api|secret|access|private)[_-]?key[[:space:]]*[=:][[:space:]]*[a-z0-9_+/.-]{12,}')
      OR match(lower(tool_input), '(password|passwd|pwd|token|bearer)[[:space:]]*[=:][[:space:]]*[^[:space:]]{8,}')
      OR match(lower(tool_input), '(密码|口令|密钥|令牌)[：:＝=][^[:space:]]{6,}')
      OR match(tool_input, '[1-9][0-9]{5}(19|20)[0-9]{2}[01][0-9][0-3][0-9][0-9]{3}[0-9Xx]')
      OR match(tool_input, '[0-9]{3}-[0-9]{2}-[0-9]{4}')
      OR match(tool_input, '[0-9]{4}[ -][0-9]{4}[ -][0-9]{4}[ -][0-9]{1,7}')
      OR match(tool_input, '(^|[^0-9])1[3-9][0-9]{9}([^0-9]|$)')
    )
translations:
  zh-CN:
    name: "敏感数据传向外部工具"
    description: |
      第三方或互联网工具参数包含敏感数据,且没有允许的数据类型和字段范围记录。
