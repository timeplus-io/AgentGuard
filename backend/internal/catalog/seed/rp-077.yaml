id: rp-077
name: "Generative Montage — Multi-Agent Cognitive Collusion Belief Manipulation Detector"
version: "0.1.0"
description: |
  Detects multi-agent cognitive collusion attacks (Generative Montage, arXiv:2601.01685, Jan 2026, 74.4% ASR against proprietary LLMs). In this attack, adversarial agents coordinate to steer a victim LLM's beliefs using exclusively truthful but selectively curated evidence fragments distributed through shared context channels. A Writer-Editor- Director coalition posts individually accurate but collectively deceptive fragments (e.g., earnings decline, insider sales, negative sentiment) to a shared coordination context, causing the victim orchestrator to synthesize a false conclusion (financial distress, security compromise, pending disaster) and act on it (execute sell order, approve escalation). The paper demonstrates that reasoning-specialized models are MORE vulnerable due to overthinking — GPT-5, Gemini 2.5 at 74.4% ASR, open-weights at 70.6%, with false beliefs cascading to downstream judges at >60% deception rate.

  Distinct from rp-010 (single-agent authority/override claims) and rp-054 (orchestrator outbound exfil) — this is a multi-agent coordinated false consensus attack on victim beliefs via shared context poisoning without any individual false statement. Maps to OWASP Agentic AI ASI05:2026 (Agent Trust Exploitation), OWASP LLM10:2025.

  References: arXiv:2601.01685 (Lying with Truths / Generative Montage, Jan 2026) -
  - https://arxiv.org/abs/2601.01685, OWASP Agentic AI ASI05:2026 -
  - https://labs.lares.com/owasp-agentic-top-10/,
  Example: Three colluding agents post SEC filings, insider trading disclosures, and negative sentiment surveys to a shared context within 60s; victim orchestrator synthesizes "financial distress — recommend immediate sell action" and executes.

severity: warning
category: lateral_movement_and_pivoting
fp_rate: medium
hook_sources: "tool_invoke,tool_complete,llm_response"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - multi-agent
  - cognitive-collusion
  - generative-montage
  - belief-manipulation
  - false-consensus
  - writer-editor-director
  - shared-context-poisoning
  - owasp-asi05
  - owasp-llm10
  - arxiv-2601.01685
query_sql: |
  -- rp-077 v0.1.0 (2026-04-19)
  -- Generative Montage: Multi-Agent Cognitive Collusion Belief Manipulation
  -- arXiv:2601.01685 (Lying with Truths, Jan 2026): 74.4% ASR proprietary, 70.6% open-weights
  -- Attack: Writer-Editor-Director coalition posts truthful-but-selective fragments to shared
  -- context, causing victim LLM to synthesize false conclusion and act on it.
  --
  -- Branch A: Shared-context tool call with polarizing conclusion framing + convergent consensus
  --   Detects: colluding agent posting to shared context tool with synthetic consensus framing:
  --   "independent/multiple source" + polarizing action-driving conclusion.
  --   tool_name scoped to shared-context tools; tool_input carries the colluding fragment.
  --   Dual-anchor: polarizing conclusion + convergent consensus framing (low FP).
  --
  -- Branch B: Victim orchestrator synthesis of multi-source convergent narrative + immediate action
  --   Detects: orchestrator assistant_message showing "based on multiple/independent sources"
  --   synthesis combined with an immediate action recommendation (sell, escalate, terminate).
  --   This is the cascaded false belief propagation leg of the Generative Montage kill chain.
  --   Dual-anchor: multi-source synthesis phrase + immediate action verb (very specific).
  --
  -- Branch C: Shared-context read tool_result with synthetic convergent structure
  --   Detects: tool_result returning synthesized content with multiple attributed
  --   agent/source/analyst entries all pointing toward the same conclusion.
  --   Pattern: 3+ agent/source/analyst_N labels in a single tool_result + conclusion language.
  --   Indicates victim agent is reading colluded content assembled by adversary coalition.
  --
  -- fp_rate: medium — burst context posting in high-parallelism legitimate pipelines may trigger
  --   Branch A; Branch B requires specific action + synthesis framing (lower FP); Branch C
  --   requires structured multi-agent attribution in a single result (low FP alone).
  --
  -- SQL validated against Timeplus (count=0 on test corpus). 2026-04-19.
  SELECT
    event_time AS detected_at,
    'rp-077' AS rule_id,
    'Generative Montage — Multi-Agent Cognitive Collusion Belief Manipulation Detector' AS rule_name,
    'warning' AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat(
      'Multi-agent cognitive collusion signal: shared-context coordinated evidence framing ',
      'detected. Event: ', event_type,
      ', Tool: ', coalesce(tool_name, 'n/a'),
      ', Agent: ', agent_id,
      '. Generative Montage (arXiv:2601.01685) achieves 74.4% ASR by distributing truthful fragments.'
    ) AS message,
    raw_event_data AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke', 'tool_complete', 'llm_response')
    AND (
      -- Branch A: Colluding agent posting to shared-context tool with convergent evidence framing
      -- tool_name matches shared-context write tools; tool_input has consensus + polarizing content
      -- Dual-anchor: polarizing conclusion language + independent/multiple source attribution
      (
        match(lower(tool_name), '(post_to_shared|add_to_shared|publish_finding|write_to_ledger|post_to_context|add_finding|share_result|broadcast_finding|update_shared)')
        AND match(lower(tool_input), '(financial.distress|imminent.failure|security.compromise|immediate.action.required|strongly.recommend|critical.risk|severe.concern|urgent.action)')
        AND match(lower(tool_input), '(independent|multiple.source|corroborat|multiple.analyst|several.independent|cross.referenced)')
      )

      -- Branch B: Victim orchestrator synthesizing multi-source convergent narrative + acting
      -- Catches the false belief propagation leg: orchestrator accepts and acts on collusion
      -- Dual-anchor: multi-source synthesis + immediate action directive (very specific pattern)
      OR (
        event_type = 'llm_response'
        AND match(lower(assistant_message), '(based on|synthesiz|combin|cross.referenc).{0,60}(multiple|independent|several).{0,40}(agent|source|finding|report|analys)')
        AND match(lower(assistant_message), '(recommend.{0,20}(sell all|execute immediately|approv immediately|escalat immediately|terminat immediately|halt immediately|freeze immediately)|take immediate action|act immediately on this|this requires immediate)')
      )

      -- Branch C: Shared-context read returning synthetically convergent multi-attributed content
      -- Detects victim reading colluded content: 3+ distinct agent/source/analyst_N labels
      -- pointing toward the same conclusion — structure of completed Generative Montage attack
      OR (
        event_type = 'tool_complete'
        AND match(lower(tool_result), '(analyst|source|agent)[_\-]?[0-9]+.{0,300}(analyst|source|agent)[_\-]?[0-9]+.{0,300}(analyst|source|agent)[_\-]?[0-9]+')
        AND match(lower(tool_result), '(conclusion|recommendation|finding|assessment|verdict|determination).{0,120}(action|immediately|urgent|critical|risk|distress|compromise|failure)')
      )
    )
