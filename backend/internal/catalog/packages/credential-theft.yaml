id: credential-theft
name: "Credential Theft & Harvesting"
description: |
  Detects attempts to read, harvest, or exfiltrate secrets — access to
  credential stores, environment and dotfile scraping, cloud metadata and token
  endpoints, and API keys or private keys surfacing in agent activity.
default_enabled: false
rules:
  - rp-008
  - rp-048
  - rp-061
  - rp-110
translations:
  zh-CN:
    name: "凭据窃取与收集"
    description: |
      检测读取、收集或外泄机密的行为——访问凭据存储、抓取环境变量与 dotfile、
      云元数据与令牌端点,以及智能体活动中出现的 API 密钥或私钥。
