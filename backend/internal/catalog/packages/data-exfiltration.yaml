id: data-exfiltration
name: "Data Exfiltration & Leakage"
description: |
  Detects data leaving the agent boundary through unauthorized channels —
  outbound network calls to untrusted hosts, encoded or staged payloads,
  clipboard and file-based exfiltration, and sensitive content in tool outputs.
default_enabled: false
rules:
  - rp-007
  - rp-012
  - rp-013
  - rp-017
  - rp-025
  - rp-026
  - rp-027
  - rp-033
  - rp-034
  - rp-035
  - rp-038
  - rp-040
  - rp-046
  - rp-053
  - rp-054
  - rp-055
  - rp-058
  - rp-059
  - rp-060
  - rp-062
  - rp-063
  - rp-070
  - rp-073
  - rp-124
  - rp-125
  - rp-128
translations:
  zh-CN:
    name: "数据外泄与泄露"
    description: |
      检测数据通过未授权渠道离开智能体边界的行为——向不受信任主机发起的出站网络请求、
      编码或分阶段构造的载荷、基于剪贴板和文件的外泄,以及工具输出中的敏感内容。
