id: resource-abuse
name: "Resource Exhaustion & DoS"
description: |
  Detects runaway or abusive resource consumption — token and cost runaway,
  unbounded loops and recursion, fork bombs, and request floods that can
  exhaust compute, budget, or downstream service limits.
default_enabled: false
rules:
  - rp-006
  - rp-018
  - rp-064
  - rp-115
translations:
  zh-CN:
    name: "资源耗尽与拒绝服务"
    description: |
      检测失控或滥用性的资源消耗——令牌与成本失控、无界循环与递归、fork 炸弹,
      以及可能耗尽算力、预算或下游服务限额的请求洪流。
