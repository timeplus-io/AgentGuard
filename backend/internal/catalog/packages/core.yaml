id: core
name: "Core Protection"
description: |
  The essential starter set: one broad, low-false-positive detection for each
  major threat class — prompt injection, data-loss prevention, agent privilege
  escalation, and supply-chain tampering. Recommended for every deployment and
  pre-selected by default. Enable the functional packages below for deeper,
  targeted coverage.
default_enabled: true
rules:
  - rp-001
  - rp-002
  - rp-003
  - rp-004
translations:
  zh-CN:
    name: "核心防护"
    description: |
      必备的入门规则集:为每个主要威胁类别各提供一条覆盖面广、误报率低的检测规则——
      提示注入、数据防泄漏、智能体权限提升以及供应链篡改。建议所有部署启用,并默认
      预选。如需更深入的针对性覆盖,请启用下方的功能包。
