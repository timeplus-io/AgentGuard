id: sensitive-data
name: "Sensitive Data Exposure"
description: |
  Detects sensitive data — PII, secrets, and regulated content — appearing in
  prompts, model responses, and tool output where it should be masked or
  withheld.
default_enabled: false
rules:
  - rp-002
  - rp-074
translations:
  zh-CN:
    name: "敏感数据暴露"
    description: |
      检测敏感数据——个人身份信息(PII)、机密及受监管内容——出现在本应脱敏或
      隐去的提示、模型响应和工具输出中。
