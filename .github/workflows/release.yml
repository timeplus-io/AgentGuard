name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

jobs:
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/agentguard
            timeplus/agentguard
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release notes with Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          OWNER="${{ github.repository_owner }}"
          CURRENT=$(gh release view "$TAG" --json body -q .body)
          printf '%s\n\n## Docker Image\n\n```bash\ndocker pull ghcr.io/%s/agentguard:%s\n```\n' \
            "$CURRENT" "$OWNER" "$TAG" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-binaries:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: agentguard-linux-amd64
          - goos: linux
            goarch: arm64
            name: agentguard-linux-arm64
          - goos: darwin
            goarch: amd64
            name: agentguard-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: agentguard-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync frontend into backend embed dir
        run: |
          mkdir -p backend/internal/web/dist
          cp -r frontend/dist/. backend/internal/web/dist/

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd backend
          go build -tags embed -o ../${{ matrix.name }} cmd/server/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: 14

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}

  upload-s3:
    # Runs only when ALL publish-binaries matrix legs succeed (fail-fast: false means
    # a partial matrix failure still sets result='failure', so this job is skipped
    # unless every platform built successfully — intentional all-or-nothing behaviour).
    name: Upload binaries to S3
    runs-on: ubuntu-latest
    needs: [publish-binaries]
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish-binaries.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agentguard-*
          merge-multiple: true
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload binaries to S3 (versioned + latest)
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          shopt -s nullglob
          binaries=(dist/agentguard-*)
          if [[ ${#binaries[@]} -eq 0 ]]; then
            echo "ERROR: No binaries found in dist/ — aborting S3 upload"
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            name=$(basename "$binary")
            aws s3 cp "$binary" "s3://${{ secrets.AWS_S3_BUCKET }}/agentguard/${VERSION}/${name}"
            aws s3 cp "$binary" "s3://${{ secrets.AWS_S3_BUCKET }}/agentguard/latest/${name}"
            echo "Uploaded ${name} → versioned + latest"
          done

      - name: Upload install script to S3
        run: |
          set -euo pipefail
          aws s3 cp install/install.sh "s3://${{ secrets.AWS_S3_BUCKET }}/install.sh"
          echo "Uploaded install.sh → s3://${{ secrets.AWS_S3_BUCKET }}/install.sh"

  publish-binaries-main:
    name: Build artifact ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: agentguard-linux-amd64
          - goos: linux
            goarch: arm64
            name: agentguard-linux-arm64
          - goos: darwin
            goarch: amd64
            name: agentguard-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: agentguard-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync frontend into backend embed dir
        run: |
          mkdir -p backend/internal/web/dist
          cp -r frontend/dist/. backend/internal/web/dist/

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd backend
          go build -tags embed -o ../${{ matrix.name }} cmd/server/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: 14
