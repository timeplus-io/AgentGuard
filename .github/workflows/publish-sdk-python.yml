name: Publish Python SDK

# Publishes sdk/python to PyPI as `timeplus-agentguard` (import name `agentguard`).
#
# Release flow: bump `version` in sdk/python/pyproject.toml, merge, then publish
# a GitHub Release whose tag is `sdk-python-v<version>` (e.g. sdk-python-v0.3.1).
# Releases with any other tag are ignored. Running the workflow manually builds
# and validates the package without uploading.
#
# Auth is PyPI Trusted Publishing (OIDC) — no token secret. On PyPI, add a
# trusted publisher for project `timeplus-agentguard`: this repository, workflow
# `publish-sdk-python.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'sdk-python-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling and SDK
        run: python -m pip install hatch twine -e '.[dev]'

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -m hatch version)"
          if [ "$TAG" != "sdk-python-v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version (expected sdk-python-v$version)"
            exit 1
          fi

      - name: Test
        run: make test PYTHON=python

      - name: Build and validate
        run: make check PYTHON=python

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-python-dist
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/timeplus-agentguard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk-python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
