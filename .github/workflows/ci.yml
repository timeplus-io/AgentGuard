name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin-checks:
    name: Plugin — ${{ matrix.plugin }} test & build
    runs-on: ubuntu-latest
    strategy:
      # Surface failures in every plugin even if one fails first.
      fail-fast: false
      matrix:
        plugin: [claudecode, openclaw]
    defaults:
      run:
        working-directory: agents/${{ matrix.plugin }}/agentguard-plugin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/${{ matrix.plugin }}/agentguard-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # claudecode plugin ships a `typecheck` script (tsc --noEmit) because its
      # build is esbuild-only and skips type checking. openclaw uses tsc as the
      # builder, so the build step below also typechecks for it.
      - name: Typecheck (claudecode only)
        if: matrix.plugin == 'claudecode'
        run: npm run typecheck

      - name: Build
        run: npm run build

  hermes-plugin-checks:
    name: Plugin — hermes test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/hermes/agentguard-plugin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test
        run: python -m unittest discover -s tests -v
