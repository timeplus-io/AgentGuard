name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-checks:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend
          version: v2.11.4  # pin; update intentionally via https://github.com/golangci/golangci-lint/releases

      - name: Test
        run: go test ./...

  frontend-checks:
    name: Frontend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  plugin-checks:
    name: Plugin — ${{ matrix.plugin }} test & build
    runs-on: ubuntu-latest
    strategy:
      # Surface failures in every plugin even if one fails first.
      fail-fast: false
      matrix:
        plugin: [claudecode, openclaw]
    defaults:
      run:
        working-directory: agents/${{ matrix.plugin }}/agentguard-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/${{ matrix.plugin }}/agentguard-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # claudecode plugin ships a `typecheck` script (tsc --noEmit) because its
      # build is esbuild-only and skips type checking. openclaw uses tsc as the
      # builder, so the build step below also typechecks for it.
      - name: Typecheck (claudecode only)
        if: matrix.plugin == 'claudecode'
        run: npm run typecheck

      - name: Build
        run: npm run build

  build:
    name: Full embed build
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, plugin-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync frontend into backend embed dir
        run: |
          mkdir -p backend/internal/web/dist
          cp -r frontend/dist/. backend/internal/web/dist/

      - name: Build backend (embedded)
        working-directory: backend
        run: CGO_ENABLED=0 go build -tags embed ./...
