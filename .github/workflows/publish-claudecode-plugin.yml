name: Publish Claude Code plugin

# Publishes agents/claudecode/agentguard-plugin to npm as
# `@timeplus/agentguard-claudecode-plugin`.
#
# Release flow: bump `version` in agents/claudecode/agentguard-plugin/package.json
# (+ lockfile), merge, then publish a GitHub Release whose tag is
# `claudecode-plugin-v<version>` (e.g. claudecode-plugin-v0.5.1). Releases with
# any other tag are ignored. Running the workflow manually tests, builds and
# lists the package contents (`npm pack --dry-run`) without uploading.
#
# Auth is the `NPM_TOKEN` repository secret (a granular npm token with publish
# rights on the `@timeplus` scope). The package is published with provenance,
# which needs `id-token: write` and the `repository` field in package.json.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Test, build & publish to npm
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'claudecode-plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    defaults:
      run:
        working-directory: agents/claudecode/agentguard-plugin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: agents/claudecode/agentguard-plugin/package-lock.json

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "claudecode-plugin-v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected claudecode-plugin-v$version)"
            exit 1
          fi

      - name: Check version is not already on npm
        if: github.event_name == 'release'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published; bump the version first"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # esbuild does not typecheck, so run tsc separately.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `npm publish --dry-run` fails when the version is already on npm, which
      # is the normal state of main between releases, so only pack here.
      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
