<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
    <script>
      // Apply the persisted theme before first paint to avoid a flash (#240).
      // Default is dark; light is opt-in. Kept in sync at runtime by ThemeProvider.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) { /* no-op: <html class="dark"> remains */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
