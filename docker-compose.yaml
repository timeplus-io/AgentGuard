services:
  timeplus:
    image: timeplus/timeplus-enterprise:3.2.1
    platform: linux/amd64
    container_name: timeplus
    ports:
      - "3218:3218"   # HTTP query API (used by AgentGuard)
      - "8123:8123"   # HTTP query API normal
      - "8463:8463"   # Native TCP protocol
      - "4317:4317"   # OTLP gRPC (OpenClaw telemetry)
      - "4318:4318"   # OTLP HTTP (OpenClaw telemetry)
      - "8000:8000"   # Timeplus Enterprise web console
    volumes:
      - timeplus-data:/timeplus/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3218' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  agentguard:
    build: .
    container_name: agentguard
    ports:
      - "8080:8080"
    environment:
      # TIMEPLUS_HOST/TIMEPLUS_PORT pre-populate the setup wizard connection fields.
      TIMEPLUS_HOST: timeplus
      TIMEPLUS_PORT: 3218
      SERVER_PORT: 8080
      # Timeplus calls this URL for alert webhooks; use the Docker service name.
      AGENTGUARD_URL: "http://agentguard:8080"
      # Service credentials for plugin → /api/holds and Timeplus → /api/alerts/webhook.
      # REQUIRED: server-to-server endpoints fail with 503 if these are unset
      # (no session-borrowing fallback). Match whatever user the AgentGuard wizard
      # was configured with. Defaults below are the standard Timeplus dev creds.
      TIMEPLUS_USER: "proton"
      TIMEPLUS_PASSWORD: "timeplus@t+"
      # Registers Sentry's no-side-effect demo_write gated tool so the #221
      # approval flow (card → approve/deny/timeout → audit) can be exercised
      # end-to-end. Override with SENTRY_DEMO_WRITE=0 to hide it.
      SENTRY_DEMO_WRITE: ${SENTRY_DEMO_WRITE:-1}
    volumes:
      # Persists config.yaml and custom catalog rules across container restarts and image upgrades.
      # Mounted at /app/data only — the binary at /app/server is never shadowed by the volume,
      # so `docker compose build && docker compose up` picks up the new binary automatically.
      - agentguard-data:/app/data
    depends_on:
      timeplus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timeplus-data:
  agentguard-data:
