services:
  timeplus:
    image: timeplus/timeplus-enterprise:3.2.1
    platform: linux/amd64
    container_name: timeplus
    ports:
      - "3218:3218"   # HTTP query API (used by AgentGuard)
      - "8123:8123"   # HTTP query API normal
      - "8463:8463"   # Native TCP protocol
      - "4317:4317"   # OTLP gRPC (OpenClaw telemetry)
      - "4318:4318"   # OTLP HTTP (OpenClaw telemetry)
      - "8000:8000"   # Timeplus Enterprise web console
    volumes:
      - timeplus-data:/timeplus/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3218' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  agentguard:
    build: .
    container_name: agentguard
    ports:
      - "8080:8080"
    environment:
      # These env vars pre-populate the setup wizard connection fields.
      # Credentials are never stored here — they are entered in the setup wizard.
      TIMEPLUS_HOST: timeplus
      TIMEPLUS_PORT: 3218
      SERVER_PORT: 8080
      # Timeplus calls this URL for alert webhooks; use the Docker service name.
      AGENTGUARD_URL: "http://agentguard:8080"
    volumes:
      # Persists config.yaml written by the setup wizard across container restarts.
      # On first run, Docker initialises this volume from the image.
      # When upgrading the image, run `docker compose down -v` to reset (re-setup required).
      - agentguard-data:/app
    depends_on:
      timeplus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timeplus-data:
  agentguard-data:
