[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timeplus-agentguard"
version = "0.3.1"
description = "AgentGuard Python SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4"
authors = [
    { name = "Timeplus" },
]
keywords = ["agentguard", "security", "monitoring", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "wrapt>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
    "openai>=1.0",
]
openai = [
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/timeplus-io/AgentGuard/tree/main/sdk/python"
Repository = "https://github.com/timeplus-io/AgentGuard"
Issues = "https://github.com/timeplus-io/AgentGuard/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
