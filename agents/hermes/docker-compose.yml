services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    command: gateway run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.hermes:/opt/data
    environment:
      HERMES_UID: ${UID:-1000}
      AGENTGUARD_AGENT_ID: ${AGENTGUARD_AGENT_ID:-}
      AGENTGUARD_DEPLOYMENT_ID: ${AGENTGUARD_DEPLOYMENT_ID:-local-hermes}
      AGENTGUARD_DEPLOYMENT_NAME: ${AGENTGUARD_DEPLOYMENT_NAME:-Local Hermes}
      AGENTGUARD_TIMEPLUS_URL: ${AGENTGUARD_TIMEPLUS_URL:-http://host.docker.internal:3218}
      AGENTGUARD_STREAM: ${AGENTGUARD_STREAM:-agentguard_hook_events}
      AGENTGUARD_USERNAME: ${AGENTGUARD_USERNAME:-proton}
      AGENTGUARD_PASSWORD: ${AGENTGUARD_PASSWORD:-timeplus@t+}
      OPENAI_API_KEY: ${LITELLM_API_KEY:-sk-openclaw-proxy}
    restart: unless-stopped

  web:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-web
    command: dashboard --host 0.0.0.0 --insecure --no-open
    pid: "service:gateway"
    ports:
      - "18790:9119"
    volumes:
      - ./.hermes:/opt/data
    environment:
      HERMES_UID: ${UID:-1000}
      HERMES_WEB_DIST: /opt/data/web_dist
    restart: unless-stopped
    depends_on:
      - gateway
