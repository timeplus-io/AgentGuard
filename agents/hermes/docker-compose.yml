services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    command: gateway run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.hermes:/opt/data
    # Provider API keys (NVIDIA_API_KEY, OLLAMA_API_KEY, GOOGLE_API_KEY, etc.)
    # live in .env (git-ignored). Add KEY=VALUE lines there as you need them;
    # no compose edit required. The `environment:` block below is only for
    # values with sensible Makefile-level defaults.
    env_file:
      - .env
    environment:
      HERMES_UID: ${UID:-1000}
      AGENTGUARD_AGENT_ID: ${AGENTGUARD_AGENT_ID:-}
      AGENTGUARD_DEPLOYMENT_ID: ${AGENTGUARD_DEPLOYMENT_ID:-local-hermes}
      AGENTGUARD_DEPLOYMENT_NAME: ${AGENTGUARD_DEPLOYMENT_NAME:-Local Hermes}
      AGENTGUARD_TIMEPLUS_URL: ${AGENTGUARD_TIMEPLUS_URL:-http://host.docker.internal:3218}
      AGENTGUARD_STREAM: ${AGENTGUARD_STREAM:-agentguard_hook_events}
      AGENTGUARD_USERNAME: ${AGENTGUARD_USERNAME:-proton}
      AGENTGUARD_PASSWORD: ${AGENTGUARD_PASSWORD:-timeplus@t+}
      # Hermes's `provider: custom` sends this value as the bearer token to
      # whatever base_url is set in .hermes/config.yaml. With base_url pointing
      # at NVIDIA Build, this needs to be your nvapi- key (loaded from .env).
      # Falls back to the LiteLLM dummy key only when NVIDIA_API_KEY is unset
      # — useful if you switch base_url back to the LiteLLM proxy on :4000.
      OPENAI_API_KEY: ${NVIDIA_API_KEY:-${LITELLM_API_KEY:-sk-openclaw-proxy}}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    restart: unless-stopped

  web:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-web
    command: dashboard --host 0.0.0.0 --insecure --no-open
    pid: "service:gateway"
    ports:
      - "18790:9119"
    volumes:
      - ./.hermes:/opt/data
    environment:
      HERMES_UID: ${UID:-1000}
      HERMES_WEB_DIST: /opt/data/web_dist
    restart: unless-stopped
    depends_on:
      - gateway
