name: agentguard
version: 1.0.0
description: "Forwards Hermes session and tool events to AgentGuard for real-time security monitoring."
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
