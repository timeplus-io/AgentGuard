[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard-codex-plugin"
version = "0.1.1"
description = "AgentGuard monitoring plugin for OpenAI Codex"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["agentguard", "codex", "security", "ai-agent", "monitoring", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "agentguard>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/timeplus-io/agentguard"
Repository = "https://github.com/timeplus-io/agentguard"

[project.scripts]
agentguard-codex = "agentguard_codex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentguard_codex"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]