id: rp-068
name: "STAC Sequential Tool Attack Chaining Detector"
version: "0.2.0"
description: |
  Detects Sequential Tool Attack Chaining (STAC) attacks where individually harmless tool-call instructions are chained across multiple turns to achieve harmful cumulative effects invisible to per-step safety checks. arXiv:2509.25624 (STAC, ICLR 2026, AWS AI Labs / UC Berkeley) demonstrates >90% ASR against GPT-4.1 across 483 evaluated attack cases — the canonical example: (1) compress documents to ZIP "for storage optimization," (2) delete originals since backup exists, (3) delete ZIPs as final cleanup. Entire document corpus destroyed via 3 individually-benign instructions. Other chains: exfil-then-destroy (upload files externally, delete local copies, delete remote copies); database-flush chains. The paper shows existing prompt-based defenses provide limited protection (max 28.8% ASR reduction). Detection must reason over action-sequence trajectories, not isolated prompts or responses.

  Distinct from rp-006 (recursive loop DoS — single-turn loop induction), rp-018 (token-drain cost amplification), and rp-050 (semantic rollback checkpoint replay).

  References: arXiv:2509.25624 (STAC ICLR 2026), OWASP LLM01:2025, OWASP Agentic AI ASI03:2026 -
  - https://arxiv.org/abs/2509.25624,
  - https://arxiv.org/html/2509.25624v2,
  - https://github.com/amazon-science/MultiTurnAgentAttack

severity: critical
category: prompt_injection_and_hijacking
fp_rate: medium
hook_sources: "user_input,tool_invoke"
required_telemetry: ""
author: "AgentGuard Research Team"
tags:
  - security
  - prompt-injection
  - multi-turn
  - sequential-tool-chain
  - stac
  - tool-chaining
  - destructive-sequence
  - owasp-llm01
  - owasp-asi03
  - arxiv-2509.25624
query_sql: |
  -- rp-068: STAC Sequential Tool Attack Chaining Detector v0.1.0
  -- arXiv:2509.25624 (STAC, ICLR 2026, AWS AI Labs / UC Berkeley)
  -- >90% ASR against GPT-4.1 across 483 evaluated attack cases.
  -- Detects multi-turn compress→delete, exfil→delete, and numbered destructive chain patterns.
  --
  -- Branch A: user_input — STAC priming language in user_message
  -- Each sub-pattern requires compound signals: archive action AND delete directive in same message,
  -- OR temporal connector linking the two steps.
  SELECT
    event_time                              AS detected_at,
    'rp-068'                                AS rule_id,
    'STAC Sequential Tool Attack Chaining Detector' AS rule_name,
    'critical'                              AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'STAC multi-turn chain priming detected in user_message: session=', session_id,
      ', agent=', agent_id,
      '. Multi-step compress/exfil→delete sequence directive.'
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('user_input')
    AND (
      -- Compress-then-delete: archive operation cited as justification for deletion of originals
      -- Requires both archive signal AND delete signal in close proximity
      (
        match(lower(user_message), '(compress|zip|archive|tar|backup).{0,150}(delete|remove|erase|wipe|clean.?up).{0,100}(original|source|old|file|copy|document)')
      )
      -- Delete-because-archived: delete justified by existence of prior archive/backup
      OR (
        match(lower(user_message), '(delete|remove|erase|wipe|clean.?up).{0,80}(original|source|local.?cop|file).{0,60}(compress|archive|backup|zip|cop|sent|upload|transfer).{0,60}(exist|hav|made|creat|done|complet|alread)')
      )
      -- Upload/exfil-then-destroy chain directive in single message
      OR (
        match(lower(user_message), '(send|upload|transfer|email|export|push).{0,150}(delete|remove|erase|wipe|destroy|clean.?up).{0,100}(local|original|source|file|data|log|copy)')
      )
      -- Temporal sequencing: "after/once/now that you've [archived/sent]...delete"
      OR (
        match(lower(user_message), '(after|once|when|now that).{0,80}(compress|archive|send|upload|backup|zip|transfer|export).{0,100}(delete|remove|clean.?up|wipe|erase|destroy|purge)')
      )
      -- "Clean up" after archive directive
      OR (
        match(lower(user_message), 'clean.{0,15}up.{0,80}(original|backup|cop|file|zip|archive|folder).{0,80}(after|since|because|now|done|complet|finish)')
      )
      -- Numbered multi-step sequence containing both archive and destroy verbs
      -- Requires step numbering pattern AND both archive AND destroy verbs in same message
      OR (
        match(lower(user_message), 'step [0-9]')
        AND match(lower(user_message), '(delete|remove|wipe|destroy|erase|purge)')
        AND match(lower(user_message), '(compress|zip|send|upload|transfer|archive|backup|export)')
      )
    )

  UNION ALL

  -- Branch B: tool_invoke — delete tool call where tool_input cites prior backup as justification
  -- High-specificity: destructive tool called with archive-justification in its own parameters
  SELECT
    event_time                              AS detected_at,
    'rp-068'                                AS rule_id,
    'STAC Sequential Tool Attack Chaining Detector' AS rule_name,
    'critical'                              AS severity,
    agent_id,
    deployment_id,
    session_id,
    run_id,
    raw_hook_name                           AS hook_name,
    tool_name,
    concat(
      'STAC delete-after-archive tool call: tool=', tool_name,
      ', session=', session_id,
      ', agent=', agent_id,
      '. Delete invoked with archive-justification in parameters.'
    )                                       AS message,
    raw_event_data                          AS event_data
  FROM agentguard_cim_event
  WHERE event_type IN ('tool_invoke')
    AND match(lower(tool_name), '^(delete_file|remove_file|delete_dir|rm_file|trash|purge|wipe|bulk_delete|delete_files|file_delete)')
    AND (
      -- Delete tool_input cites backup/archive as justification for deletion
      match(lower(tool_input), '(backup|archive|compress|zip|uploaded|sent|transfer|export).{0,100}(original|source|local|old|cop)')
      OR match(lower(tool_input), '(original|source|local).{0,50}(already|been|is|was).{0,50}(back.?up|archive|compress|zip|upload|sent|transfer)')
    )
  UNION ALL
  -- v0.2.0: Sequential lag() branch — catches the canonical STAC sequence as a precise
  -- event pair within the same session: a user_input containing a chain-priming directive
  -- is immediately followed by a tool_invoke that calls a destructive file operation tool.
  -- This confirms the chain was acted upon (not just proposed), maximizing signal fidelity.
  -- SQL validated: count=0 (test corpus).
  WITH enriched AS (
    SELECT *,
      lag(event_type)   OVER (PARTITION BY session_id) AS prev_event_type,
      lag(user_message) OVER (PARTITION BY session_id) AS prev_user_message
    FROM agentguard_cim_event
  )
  SELECT
    event_time AS detected_at,
    'rp-068' AS rule_id,
    'STAC Sequential Tool Attack Chaining Detector' AS rule_name,
    'critical' AS severity,
    agent_id, deployment_id, session_id, run_id,
    raw_hook_name AS hook_name,
    tool_name,
    concat('Sequential STAC confirmed: chain priming directive (user_input) → destructive tool_invoke [', coalesce(tool_name,'unknown'), '] in session ', session_id, ' by agent ', agent_id) AS message,
    raw_event_data AS event_data
  FROM enriched
  WHERE event_type = 'tool_invoke'
    AND prev_event_type = 'user_input'
    AND match(lower(tool_name), '^(delete_file|remove_file|delete_dir|rm_file|trash|purge|wipe|bulk_delete|delete_files|file_delete|compress|zip_files|archive_files|upload_file|http_post|http_request|send_file|transfer_file)')
    AND (
      match(lower(prev_user_message), '(compress|zip|archive|tar|backup).{0,150}(delete|remove|erase|wipe|clean.?up).{0,100}(original|source|old|file|copy|document)')
      OR match(lower(prev_user_message), '(delete|remove|erase|wipe|clean.?up).{0,80}(original|source|local.?cop|file).{0,60}(compress|archive|backup|zip|cop|sent|upload|transfer).{0,60}(exist|hav|made|creat|done|complet|alread)')
      OR match(lower(prev_user_message), '(send|upload|transfer|email|export|push).{0,150}(delete|remove|erase|wipe|destroy|clean.?up).{0,100}(local|original|source|file|data|log|copy)')
      OR match(lower(prev_user_message), '(after|once|when|now that).{0,80}(compress|archive|send|upload|backup|zip|transfer|export).{0,100}(delete|remove|clean.?up|wipe|erase|destroy|purge)')
    )
